<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="build" content="2026-08-24-2200">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/inter@5.2.5/index.css">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1e2933" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10161b" media="(prefers-color-scheme: dark)">
<title>KKL CMS</title>
<style>
  /* SKYTOPIA Site Safety — Procore-inspired UI (CORE palette: orange-60 action, blue-65 links, gray h200) */
  :root{
    --bg:#f2f3f5; --card:#ffffff; --field:#ffffff;
    --ink:#282828; --sub:#68757d; --line:#dfe3e6; --line2:#c3cbd0;
    --acc:#e11b12; --acc-h:#b8130c; --acc-soft:#fdeae8; --btn-ink:#ffffff; --badge:#d62c2f;
    --blue:#006ddf; --blue-soft:#f0f6fe;
    --good-ink:#177c1f; --good-bg:#eafaea;
    --warn-ink:#8a5b00; --warn-bg:#fff7d9;
    --bad-ink:#d62c2f;  --bad-bg:#fff0f0;
    --hdr:#1e2933; --hdr-ink:#ffffff; --hdr-sub:#9fb0bc;
    --s1:#2a78d6; --s2:#e11b12; --s3:#1baf7a;
    --viz-grid:#e3e6e8; --viz-axis:#c6ccd0; --viz-muted:#8b969d;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15191d; --card:#1e242a; --field:#242b31;
      --ink:#e8ebed; --sub:#98a5ad; --line:#2e363d; --line2:#48535b;
      --acc:#f0362b; --acc-h:#ff5348; --acc-soft:#3a1614; --btn-ink:#ffffff; --badge:#e04b4b;
      --blue:#5aa2f0; --blue-soft:#1c2836;
      --good-ink:#4fce6a; --good-bg:rgba(30,160,60,.16);
      --warn-ink:#f3b73f; --warn-bg:rgba(250,178,25,.14);
      --bad-ink:#ef8080;  --bad-bg:rgba(230,103,103,.16);
      --hdr:#10161b; --hdr-ink:#ffffff; --hdr-sub:#8b9aa5;
      --s1:#3987e5; --s2:#f0362b; --s3:#1baf7a; --icbg:#37475a; --icbg-h:#46596f;
      --viz-grid:#2b3238; --viz-axis:#3d464d; --viz-muted:#8b969d;
    }
  }
  :root[data-theme="dark"]{
    --bg:#15191d; --card:#1e242a; --field:#242b31;
    --ink:#e8ebed; --sub:#98a5ad; --line:#2e363d; --line2:#48535b;
    --acc:#f0362b; --acc-h:#ff5348; --acc-soft:#3a1614; --btn-ink:#ffffff; --badge:#e04b4b;
    --blue:#5aa2f0; --blue-soft:#1c2836;
    --good-ink:#4fce6a; --good-bg:rgba(30,160,60,.16);
    --warn-ink:#f3b73f; --warn-bg:rgba(250,178,25,.14);
    --bad-ink:#ef8080;  --bad-bg:rgba(230,103,103,.16);
    --hdr:#10161b; --hdr-ink:#ffffff; --hdr-sub:#8b9aa5;
    --s1:#3987e5; --s2:#f0362b; --s3:#1baf7a; --icbg:#37475a; --icbg-h:#46596f;
    --viz-grid:#2b3238; --viz-axis:#3d464d; --viz-muted:#8b969d;
  }

  *{box-sizing:border-box;}
  html{background:var(--bg);}
  body{margin:0; font-family:"Helvetica Neue",system-ui,-apple-system,"Segoe UI",Arial,sans-serif; font-size:15px; line-height:1.45; color:var(--ink); background:var(--bg);
       padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);}

  /* ===== app shell: dark top bar + tool sidebar (Procore-style) ===== */
  .appbar{position:fixed; top:0; left:0; right:0; height:48px; z-index:40; background:var(--hdr); color:var(--hdr-ink);
          display:flex; align-items:center; gap:2px; padding:0 10px 0 6px;}
  .appbar .iconbtn{color:var(--hdr-ink); width:38px; height:38px; border-radius:4px;}
  .appbar .iconbtn:hover{background:rgba(255,255,255,.1);}
  .brand{display:flex; align-items:center; gap:8px; text-decoration:none; color:var(--hdr-ink); padding:4px 8px 4px 4px; border-radius:4px;}
  .brand:hover{background:rgba(255,255,255,.08);}
  .bmark{display:flex; align-items:center; justify-content:center; width:24px; height:24px; border-radius:4px;
         background:var(--acc); color:#fff; font-size:14px; font-weight:800;}
  .bword{font-size:14.5px; font-weight:750; letter-spacing:.14em;}
  .mpick{border:1px solid var(--line2,#dfe3e6); border-radius:8px; padding:8px; background:var(--card,#fff);}
  .mpick-chips{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:7px;}
  .mchip{display:inline-flex; align-items:center; gap:5px; font-size:13px; font-weight:600;
    background:var(--soft,#f2f4f6); border:1px solid var(--line2,#dfe3e6); border-radius:20px; padding:3px 6px 3px 11px;}
  .mchip-x{border:0; background:none; font-size:16px; line-height:1; cursor:pointer; color:var(--sub,#68757d); padding:0 3px;}
  .mpick-q{width:100%; margin:0 0 7px;}
  .mpick-res{max-height:290px; overflow-y:auto;}
  .mpick-res .pick{display:flex; align-items:center; gap:9px; padding:7px 4px; border-bottom:1px solid var(--line,#eef1f3);}
  .mpick-res .pick:last-child{border-bottom:0;}
  .blogo{height:26px; background:#fff; border-radius:4px; padding:2px 6px; display:block;}
  #ctxPanel{position:fixed; top:48px; right:0; bottom:0; width:380px; max-width:94vw; background:var(--card);
            border-left:1px solid var(--line); z-index:45; display:flex; flex-direction:column; box-shadow:var(--sh-l,0 16px 40px rgba(0,0,0,.2));}
  .ctx-head{display:flex; align-items:center; gap:8px; padding:12px 16px; border-bottom:1px solid var(--line); font-size:15px;}
  .ctx-body{flex:1; overflow-y:auto; padding:12px 16px 24px;}
  .ctx-sect{font-size:10.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--sub); margin:16px 0 6px;}
  #ctxScrim{position:fixed; inset:48px 0 0 0; z-index:44; background:rgba(15,22,27,.45);}
  @media (min-width:1200px){ .content.ctx-open{margin-right:380px;} }
  .cc-grid{display:grid; grid-template-columns:1fr; gap:0 22px; align-items:start;}
  @media (min-width:1200px){ .cc-grid{grid-template-columns:1fr 370px;} }
  .gsearch-wrap{position:relative; display:none; margin-left:10px;}
  @media (min-width:940px){ .gsearch-wrap{display:block;} }
  #gsearch{min-height:32px; height:32px; width:210px; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.16);
           color:#fff; border-radius:8px; padding:4px 12px; font-size:13px; box-shadow:none; transition:width .15s ease;}
  #gsearch::placeholder{color:rgba(255,255,255,.55);}
  #gsearch:focus{background:#fff; color:#1c252d; width:280px; outline:none; box-shadow:none;}
  #gsearchDD{position:absolute; top:40px; left:0; width:360px; max-width:88vw; max-height:70vh; overflow:auto; background:var(--card);
             border:1px solid var(--line); border-radius:12px; box-shadow:var(--sh-l,0 16px 40px rgba(0,0,0,.2)); display:none; z-index:70; padding:6px;}
  #gsearchDD .lrow{margin-bottom:2px; box-shadow:none; border:none; cursor:pointer;}
  #gsearchDD .lrow:hover{background:var(--bg); transform:none;}
  #updBar{position:fixed; left:12px; right:12px; bottom:14px; z-index:120; background:var(--acc); color:#fff;
          font:inherit; font-size:14px; font-weight:750; border:none; border-radius:8px; padding:13px;
          box-shadow:0 6px 20px rgba(0,0,0,.28); cursor:pointer;}
  .bdiv{width:1px; height:22px; background:rgba(255,255,255,.25); margin:0 8px;}
  .projsel{display:flex; align-items:center; gap:6px; max-width:44vw; background:none; border:none; color:var(--hdr-ink);
           font:inherit; font-size:13.5px; font-weight:600; padding:6px 8px; border-radius:4px; cursor:pointer;}
  .projsel:hover{background:rgba(255,255,255,.1);}
  .projsel span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .projsel svg{width:14px; height:14px; flex:0 0 auto; color:var(--hdr-sub);}
  .abadge{position:absolute; top:3px; right:3px; min-width:16px; height:16px; padding:0 4px; border-radius:8px;
          background:var(--badge); color:#fff; font-size:10.5px; font-weight:700; line-height:16px;}

  .shell{display:flex; padding-top:48px; min-height:100vh;}
  .sidenav{position:fixed; top:48px; bottom:0; left:0; width:230px; z-index:30; overflow-y:auto; overscroll-behavior:contain;
           background:var(--card); border-right:1px solid var(--line); padding:6px 0 30px;}
  .sn-home{margin-top:6px;}
  .sn-group{font-size:10.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--sub); padding:16px 16px 5px;}
  .mxt{border-collapse:collapse;font-size:12.5px;min-width:640px;background:var(--card,#fff)}
  .mxt th,.mxt td{border:1px solid var(--line);padding:6px 8px;text-align:center}
  .mxt tr{cursor:pointer}
  .mxt td.mx.ok{color:#1e8e3e;font-weight:700}.mxt td.mx.warn{color:#b76e00;font-weight:700}.mxt td.mx.bad{color:#c5221f;font-weight:700}
  .sn-item{display:flex; align-items:center; gap:10px; padding:7.5px 14px 7.5px 13px; border-left:3px solid transparent;
           font-size:13.5px; font-weight:600; color:var(--ink); text-decoration:none;}
  .sn-item svg{width:17px; height:17px; color:var(--sub); flex:0 0 auto;}
  .sn-item:hover{background:var(--bg);}
  .sn-item.on{border-left-color:var(--acc); background:var(--acc-soft);}
  .sp-t.on{background:var(--acc); color:#fff; border-color:var(--acc);}
  #spQr .lrow, [id$='-r'] .lrow{padding:8px 10px;}
  .sn-item.on svg{color:var(--ink);}
  .sn-item .sbdg{margin-left:auto; min-width:20px; text-align:center; padding:0 6px; border-radius:9px;
                 background:var(--badge); color:#fff; font-size:11px; font-weight:700; line-height:18px;}
  .scrim{display:none; position:fixed; inset:48px 0 0 0; z-index:25; background:rgba(15,22,27,.45);}
  .content{flex:1; margin-left:230px; min-width:0;}
  .wrap{max-width:1060px; margin:0 auto; padding:0 22px 60px;}
  .burger{display:none;}
  @media (max-width:940px){
    .sidenav{transform:translateX(-102%); transition:transform .18s ease; box-shadow:4px 0 18px rgba(0,0,0,.18);}
    .sidenav.open{transform:none;}
    .scrim.open{display:block;}
    .content{margin-left:0;}
    .burger{display:block;}
    .bword{display:none;}
    .wrap{padding:0 14px 60px;}
  }

  header.top{display:flex; align-items:center; gap:8px; padding:14px 0 12px; position:sticky; top:48px; background:var(--bg); z-index:5;
             border-bottom:1px solid var(--line); margin-bottom:14px;}
  header.top h1{font-size:20px; font-weight:650; margin:0; letter-spacing:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  header.top .spacer{flex:1;}
  .iconbtn{background:none; border:none; color:var(--ink); width:38px; height:38px; padding:7px; cursor:pointer; border-radius:4px; flex:0 0 auto;}
  .iconbtn:hover{background:var(--acc-soft);}
  .iconbtn:active{background:var(--acc-soft);}
  .iconbtn svg{width:100%; height:100%;}

  .brandrule{display:none;}
  h2.sect{display:flex; align-items:center; gap:10px; font-size:11px; font-weight:800; letter-spacing:.14em;
          text-transform:uppercase; color:var(--sub); margin:22px 0 10px;}
  h2.sect::after{content:''; flex:1; height:1px; background:var(--line);}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); gap:10px;}
  .tile{display:block; text-align:center; text-decoration:none; color:var(--ink); -webkit-tap-highlight-color:transparent;
        background:var(--card); border:1px solid var(--line); border-radius:6px; padding:16px 8px 13px;}
  .tile:hover{border-color:var(--line2); box-shadow:0 1px 4px rgba(20,33,43,.10);}
  .tile .ic{position:relative; width:48px; height:48px; margin:0 auto 9px; border-radius:11px;
            background:var(--icbg,#243140); display:flex; align-items:center; justify-content:center;}
  .tile .ic svg{width:26px; height:26px; color:#fff;}
  .tile:hover .ic{background:var(--icbg-h,#33465c);}
  .tile:active .ic{outline:none;}
  .tile .tl{display:block; font-size:12.5px; font-weight:650; color:var(--ink);}
  .tile .bdg{position:absolute; top:-4px; right:-6px; min-width:20px; padding:0 6px; border-radius:10px;
             background:var(--badge); color:#fff; font-size:11.5px; font-weight:700; line-height:1.6;}

  .card{background:var(--card); border:1px solid var(--line); border-radius:6px; padding:16px; margin-bottom:12px;}
  .foot{margin-top:26px; font-size:12px; color:var(--sub); text-align:center;}

  /* list — Procore log-table look */
  .searchwrap{margin-bottom:10px;}
  .searchwrap input{width:100%; max-width:420px;}
  .lrow{display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:0;
        border-left:none; border-right:none; padding:10px 13px; margin-bottom:-1px; cursor:pointer;}
  .lrow:first-child{border-top-left-radius:6px; border-top-right-radius:6px; border-left:1px solid var(--line); border-right:1px solid var(--line);}
  .lrow{border-left:1px solid var(--line); border-right:1px solid var(--line);}
  .lrow:last-child{border-bottom-left-radius:6px; border-bottom-right-radius:6px; margin-bottom:8px;}
  .lrow:hover{background:var(--blue-soft);}
  .lrow:active{background:var(--blue-soft);}
  .lmain{flex:1; min-width:0;}
  .lt{font-size:14px; font-weight:650; color:var(--blue); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .ls{font-size:12.5px; color:var(--sub); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:1px;}
  .lmeta{flex:0 0 auto; text-align:right; max-width:40%;}
  .empty{text-align:center; color:var(--sub); font-size:14px; padding:34px 16px; line-height:1.6;
         background:var(--card); border:1px dashed var(--line2); border-radius:6px;}
  .empty .btn{margin-top:12px;}

  .chip{display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:3px;
        background:var(--blue-soft); color:var(--blue); white-space:nowrap; margin-left:3px;}
  .chip.g{background:var(--good-bg); color:var(--good-ink);}
  .chip.w{background:var(--warn-bg); color:var(--warn-ink);}
  .chip.b{background:var(--bad-bg); color:var(--bad-ink);}
  .chip.n{background:var(--bg); color:var(--sub); border:1px solid var(--line);}
  a.chip.lnk{text-decoration:none;}

  /* forms */
  label{display:block; font-size:12.5px; font-weight:650; color:var(--sub); margin:14px 0 6px;}
  input,select,textarea{width:100%; min-width:0; font:inherit; font-size:16px; color:var(--ink); background:var(--field);
        border:1px solid var(--line2); border-radius:6px; padding:9px 12px; min-height:44px;}
  textarea{min-height:0; line-height:1.45;}
  /* iOS WebKit: empty date/time inputs keep an intrinsic width and spill out of
     grid columns; normalising appearance makes them behave like text inputs */
  input[type="date"],input[type="time"]{-webkit-appearance:none; appearance:none; display:block; max-width:100%; text-align:left;}
  input[type="date"]::-webkit-date-and-time-value,input[type="time"]::-webkit-date-and-time-value{text-align:left;}
  input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--blue); outline-offset:1px;}
  input.err,select.err,textarea.err{border-color:var(--bad-ink); outline:2px solid var(--bad-ink);}
  .hint{font-size:12px; color:var(--sub); margin-top:4px;}
  .fgrid{display:grid; grid-template-columns:1fr 1fr; gap:0 14px; align-items:start;}
  .fgrid .fld{grid-column:1/-1; min-width:0;}
  .fgrid .fld.half{grid-column:auto;}
  .fld{min-width:0;}
  .fld input,.fld select,.fld textarea{max-width:100%;}

  .btn{display:inline-block; font:inherit; font-size:14px; font-weight:650; color:var(--btn-ink); background:var(--acc);
       border:1px solid var(--acc); border-radius:4px; padding:10px 18px; cursor:pointer; min-height:42px;}
  .btn:hover{background:var(--acc-h); border-color:var(--acc-h);}
  .btn.ghost{background:var(--card); color:var(--ink); border:1px solid var(--line2);}
  .btn.ghost:hover{background:var(--bg);}
  .btn svg{width:19px; height:19px; vertical-align:-4px;}
  .btn.danger{background:var(--card); color:var(--bad-ink); border:1px solid var(--bad-ink);}
  .btn.danger:hover{background:var(--bad-bg);}
  .btnrow{display:flex; gap:10px; margin-top:18px;}
  .btnrow .btn:first-child{flex:1;}
  .minor{background:none; border:1.5px dashed var(--line2); color:var(--blue); font-size:13.5px; font-weight:650;
         border-radius:4px; padding:9px 12px; cursor:pointer; width:100%; margin-top:8px;}
  .minor:hover{background:var(--blue-soft);}

  /* repeating sub-rows */
  .rowswrap{display:flex; flex-direction:column; gap:8px;}
  .subrow{position:relative; border:1px solid var(--line); border-radius:4px; background:var(--bg); padding:10px 34px 10px 10px;}
  .subrow .rm{position:absolute; top:6px; right:6px; width:26px; height:26px; border:none; background:none;
              color:var(--bad-ink); font-size:17px; line-height:1; cursor:pointer; border-radius:4px; padding:0;}
  .sub-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:7px;}
  .cell{min-width:0;}
  .cell.full{grid-column:1/-1;}
  .cell .cl{display:block; font-size:10.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--sub); margin-bottom:2px;}
  .cell input,.cell select{min-height:38px; padding:6px 8px; font-size:14px; background:var(--card);}
  .cell textarea{padding:6px 8px; font-size:14px; background:var(--card);}

  /* member picker */
  [hidden]{display:none !important;}
  .pickgrid{display:grid; grid-template-columns:repeat(2,1fr); gap:6px;}
  @media(min-width:520px){.pickgrid{grid-template-columns:repeat(3,1fr);}}
  @media(min-width:900px){.pickgrid{grid-template-columns:repeat(4,1fr);}}
  .pick{display:flex; align-items:center; gap:7px; border:1px solid var(--line); border-radius:4px; background:var(--field);
        padding:7px 9px; font-size:13.5px; font-weight:600; color:var(--sub); cursor:pointer; margin:0; user-select:none;}
  .pick input{width:17px; height:17px; min-height:0; padding:0; margin:0; flex:0 0 auto; accent-color:var(--acc);}
  .pick:has(input:checked){border-color:var(--acc); background:var(--acc-soft); color:var(--ink);}
  .pick span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  /* cert expiry */
  .exphead{font-size:12.5px; font-weight:750; letter-spacing:.05em; text-transform:uppercase; margin:20px 0 8px;}
  .exphead.b{color:var(--bad-ink);} .exphead.w{color:var(--warn-ink);} .exphead.g{color:var(--good-ink);} .exphead.n{color:var(--sub);}

  /* statistics + home overview */
  .tiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; margin-bottom:12px;}
  .stile{background:var(--card); border:1px solid var(--line); border-radius:6px; padding:12px 13px;}
  .stile .v{font-size:23px; font-weight:700; line-height:1.2;}
  .stile .l{font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--sub); margin-top:3px;}
  a.stile{display:block; text-decoration:none; color:var(--ink);}
  a.stile:hover{border-color:var(--line2); box-shadow:0 1px 4px rgba(20,33,43,.10);}
  .stile .v.b{color:var(--bad-ink);} .stile .v.w{color:var(--warn-ink);} .stile .v.g{color:var(--good-ink);}
  .charthead{font-size:14.5px; font-weight:700; margin:2px 0 4px;}
  .legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--sub); font-weight:600; margin:2px 0 6px;}
  .legend i{display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px;}
  .chartwrap{overflow-x:auto;}
  .chartwrap svg{display:block; width:100%; height:auto; min-width:480px;}
  .bar{cursor:pointer;}
  .bar:hover{opacity:.82;}
  .tip{position:fixed; display:none; z-index:50; background:var(--ink); color:var(--bg); font-size:12.5px; font-weight:600;
       padding:5px 9px; border-radius:4px; pointer-events:none; max-width:240px;}
  .dtable{width:100%; border-collapse:collapse; font-size:12.5px; margin-top:6px;}
  .dtable th,.dtable td{border-bottom:1px solid var(--line); padding:5px 6px; text-align:right; font-variant-numeric:tabular-nums;}
  .dtable th:first-child,.dtable td:first-child{text-align:left;}
  .dtable th{color:var(--sub); font-weight:700; font-size:11px; letter-spacing:.04em; text-transform:uppercase;}
  details summary{cursor:pointer; font-size:13.5px; font-weight:650; color:var(--blue);}
  .mhgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-top:10px;}
  @media(min-width:700px){.mhgrid{grid-template-columns:repeat(6,1fr);}}
  .mh span{display:block; font-size:11px; font-weight:700; color:var(--sub); margin-bottom:2px;}
  .mh input{min-height:38px; padding:6px 8px; font-size:14px;}

  /* photos */
  .thumbs{display:flex; gap:8px; flex-wrap:wrap;}
  .thumb{position:relative; width:86px; height:86px; border:1px solid var(--line2); border-radius:4px; overflow:hidden; flex:0 0 auto;}
  .thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .thumb .rmp{position:absolute; top:3px; right:3px; width:22px; height:22px; border:none; border-radius:50%;
              background:rgba(0,0,0,.55); color:#fff; font-size:13px; line-height:1; cursor:pointer; padding:0;}
  .thumb .mkp{position:absolute; bottom:3px; right:3px; width:24px; height:24px; border:none; border-radius:50%;
              background:rgba(0,0,0,.6); color:#fff; font-size:13px; line-height:1; cursor:pointer; padding:0;}
  .mkwrap{position:fixed; inset:0; z-index:220; background:rgba(8,12,15,.94); display:flex; flex-direction:column;}
  .mkbar{display:flex; gap:8px; align-items:center; padding:10px 12px; flex-wrap:wrap;}
  .mkt{font:inherit; font-size:13px; font-weight:650; padding:8px 12px; border-radius:6px; border:1px solid #46525c;
       background:#1d252c; color:#dfe5e9; cursor:pointer;}
  .mkt.on{background:#dfe5e9; color:#1d252c;}
  .mkt.mksave{background:var(--acc); border-color:var(--acc); color:#fff;}
  .mkc{width:26px; height:26px; border-radius:50%; border:2px solid transparent; cursor:pointer; display:inline-block;}
  .mkc.on{border-color:#fff;}
  .mkcv{flex:1; display:flex; align-items:center; justify-content:center; overflow:auto; padding:8px;}
  .mkcv canvas{max-width:96vw; max-height:74vh; touch-action:none; background:#000;}

  /* ranked horizontal bars */
  .hbar{margin:8px 0;}
  .hbar .hlab{font-size:12.5px; color:var(--sub); font-weight:600; display:flex; justify-content:space-between; gap:10px;}
  .hbar .hlab b{color:var(--ink); font-variant-numeric:tabular-nums; white-space:nowrap;}
  .hbar .htrack{background:var(--bg); border:1px solid var(--line); border-radius:3px; height:14px; margin-top:3px; overflow:hidden;}
  .hbar .hfill{height:100%; background:var(--s2); border-radius:2px; min-width:2px;}

  /* monthly report */
  .repmeta{font-size:13px; color:var(--sub); line-height:1.7;}
  .repmeta b{color:var(--ink);}

  /* toast */
  .toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(80px); z-index:60; max-width:88vw;
         background:var(--hdr); color:#fff; font-size:13.5px; font-weight:600; padding:11px 18px; border-radius:6px;
         box-shadow:0 4px 18px rgba(0,0,0,.3); opacity:0; transition:all .22s ease; pointer-events:none;}
  .toast.show{transform:translateX(-50%); opacity:1;}
  .toast.bad{background:#8f1f1f;}

  /* project switcher */
  .projmenu{position:fixed; top:50px; left:56px; z-index:45; min-width:250px; max-width:86vw; display:none;
            background:var(--card); border:1px solid var(--line); border-radius:6px; box-shadow:0 6px 24px rgba(0,0,0,.22); padding:6px 0;}
  .projmenu.open{display:block;}
  .pm-head{font-size:10.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--sub); padding:8px 14px 4px;}
  .pm-item{display:flex; align-items:center; gap:8px; width:100%; text-align:left; background:none; border:none; font:inherit;
           font-size:13.5px; font-weight:600; color:var(--ink); padding:9px 14px; cursor:pointer;}
  .pm-item:hover{background:var(--bg);}
  .pm-item.on{color:var(--acc);}
  .pm-item .tick{width:16px; flex:0 0 auto; color:var(--acc);}
  .pm-new{border-top:1px solid var(--line); margin-top:4px; color:var(--blue);}

  /* sign-in landing */
  body.gated .appbar, body.gated .sidenav, body.gated .scrim, body.gated .projmenu{display:none;}
  body.gated .content{margin-left:0;}
  body.gated .shell{padding-top:0;}

  .mxt tr:last-child td{border-bottom:none;}

  @media print{

let H2P=null;

/* render a self-contained report HTML offscreen and convert to a PDF blob */
/* Find a page break that does not cut through a row of text: scan a band just
   above the ideal break for the horizontal line with the least ink (a gap
   between rows reads as almost-white; only column borders survive). */
function cleanBreakH(canvas, y, idealH){
  const bandH=Math.min(Math.floor(idealH*0.18), Math.max(0, idealH-40));
  if(bandH<8) return idealH;
  const yStart=y+idealH-bandH, W2=700;   /* wide enough that text still reads as edges; 140 blurred it into a fake gap */
  const sc=document.createElement('canvas'); sc.width=W2; sc.height=bandH;
  const cx=sc.getContext('2d');
  cx.fillStyle='#ffffff'; cx.fillRect(0,0,W2,bandH);
  cx.drawImage(canvas, 0, yStart, canvas.width, bandH, 0, 0, W2, bandH);
  let data; try{ data=cx.getImageData(0,0,W2,bandH).data; }catch(e){ return idealH; }
  /* Count horizontal EDGES, not dark pixels: a row of text changes brightness
     many times across the width, while a flat cell fill (the grey label column)
     or a plain gap changes almost never. Cutting through a fill is fine;
     cutting through text is not. */
  let best=-1, bestEdges=Infinity;
  for(let r=bandH-1; r>=0; r--){          /* nearest the ideal break wins ties */
    let edges=0, prev=-1;
    for(let c=0;c<W2;c++){ const i=(r*W2+c)*4;
      const lum=(data[i]*299+data[i+1]*587+data[i+2]*114)/1000;
      if(prev>=0 && Math.abs(lum-prev)>28) edges++;
      prev=lum; }
    if(edges<bestEdges){ bestEdges=edges; best=r; if(!edges) break; }
  }
  if(best<0||bestEdges>8) return idealH;       /* nothing quiet enough — keep it */
  const h=(idealH-bandH)+best+1;
  return h<idealH*0.5?idealH:h;                /* never shrink a page dramatically */
}
async function htmlToPdfBlob(docHtml){
  if(!await loadH2P()) return null;
  const W=726; /* A4 210mm minus 9mm margins at 96dpi — html2pdf clips, never scales */
  const fr=document.createElement('iframe');
  fr.style.cssText='position:fixed;left:-10000px;top:0;width:'+W+'px;height:1200px;border:0;visibility:hidden';
  document.body.appendChild(fr);
  try{
    fr.contentDocument.open(); fr.contentDocument.write(docHtml); fr.contentDocument.close();
    const st=fr.contentDocument.createElement('style');
    st.textContent='table{table-layout:fixed;width:100% !important;max-width:100%}td,th{overflow-wrap:anywhere}';
    fr.contentDocument.head.appendChild(st);
    await new Promise(r=>setTimeout(r,250)); /* let images decode */
    const el=fr.contentDocument.body;
    el.style.margin='0'; el.style.padding='0'; el.style.maxWidth=W+'px'; el.style.width=W+'px';
    /* Capture at ~288 DPI (scale 3 over a 96dpi layout) so text stays sharp
       when zoomed or printed. A tall report makes a tall canvas, and Safari on
       iOS has a far smaller canvas budget than desktop — so the ceiling is
       device-aware, and a failed/blank capture retries smaller rather than
       silently writing an empty page. */
    const docH=Math.max(1200, el.scrollHeight||1200);
    const iOS=/iP(hone|ad|od)/.test(navigator.platform||'')||
              ((navigator.maxTouchPoints||0)>1&&/Mac/.test(navigator.platform||''));
    const MAXDIM=iOS?8192:32000, MAXAREA=iOS?16e6:90e6;
    /* floor at the previous fixed scale on desktop so a long report never comes
       out softer than it used to; iOS may go lower, and the retry below covers it */
    let sc=Math.min(3, MAXDIM/docH, Math.sqrt(MAXAREA/(W*docH)));
    sc=Math.max(sc, iOS?1:2);
    const grab=async k=>{
      const c=await window.html2canvas(el,{scale:k,useCORS:false,logging:false,windowWidth:W,width:W,backgroundColor:'#ffffff'});
      if(!c||!c.width||!c.height) return null;
      /* a canvas over the device budget comes back blank — sample for ink */
      const pr=document.createElement('canvas'); pr.width=32; pr.height=32;
      const px2=pr.getContext('2d');
      px2.fillStyle='#fff'; px2.fillRect(0,0,32,32);
      px2.drawImage(c,0,0,c.width,Math.min(c.height,c.width*4),0,0,32,32);
      const d2=px2.getImageData(0,0,32,32).data;
      let ink2=0; for(let i=0;i<d2.length;i+=4){ if(d2[i]<245||d2[i+1]<245||d2[i+2]<245) ink2++; }
      return ink2>0?c:null;
    };
    let canvas=null;
    for(let attempt=0; attempt<3 && !canvas; attempt++){
      try{ canvas=await grab(sc); }catch(err){ canvas=null; }
      if(!canvas){ sc=Math.max(1, sc*0.6); }
    }
    if(!canvas) throw new Error('capture failed');
    /* place the canvas onto A4 pages ourselves — 192mm printable width */
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
    const mL=9, mT=10, mB=12, imgWmm=210-mL*2, innerHmm=297-mT-mB;
    const pxPerMm=canvas.width/imgWmm;
    const pageHpx=Math.floor(innerHmm*pxPerMm);
    let y=0, first=true;
    while(y<canvas.height){
      let sliceH=Math.min(pageHpx, canvas.height-y);
      /* not the last page: break between rows, never through one */
      if(y+sliceH<canvas.height) sliceH=cleanBreakH(canvas, y, sliceH);
      const pc=document.createElement('canvas');
      pc.width=canvas.width; pc.height=sliceH;
      const ctx=pc.getContext('2d');
      ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,pc.width,pc.height);
      ctx.drawImage(canvas,0,y,canvas.width,sliceH,0,0,canvas.width,sliceH);
      /* skip effectively-blank slices (trailing padding produced empty pages) */
      const probe=document.createElement('canvas'); probe.width=40; probe.height=40;
      const pctx=probe.getContext('2d'); pctx.fillStyle='#fff'; pctx.fillRect(0,0,40,40);
      pctx.drawImage(pc,0,0,pc.width,pc.height,0,0,40,40);
      const px=pctx.getImageData(0,0,40,40).data;
      let ink=0; for(let i=0;i<px.length;i+=4){ if(px[i]<245||px[i+1]<245||px[i+2]<245) ink++; }
      if(ink>3){
        if(!first) pdf.addPage();
        /* JPEG only: jsPDF re-encodes PNG uncompressed (a 141KB PNG page became
           a 20MB object), so quality comes from capture scale, not the codec. */
        pdf.addImage(pc.toDataURL('image/jpeg',0.93),'JPEG',mL,mT,imgWmm,sliceH/pxPerMm);
        first=false;
      }
      y+=sliceH;
    }
    return pdf.output('blob');
  }catch(e){ console.warn('pdf conversion failed',e); return null;
  }finally{ fr.remove(); }
}

/* upload one generated report into the cloud repository (best effort) */
async function repoUpload(cat, name, payload, mime){
  try{
    if(!SB.client) return false;                        /* local-only device */
    const {data:{session}}=await SB.client.auth.getSession();
    if(!session) return false;                          /* signed out */
    const key=repoKeySafe(db.settings.project||root.cur||'Project')+'/'+repoKeySafe(cat)+'/'+repoKeySafe(name);
    const body=(payload instanceof Blob)?payload:new Blob([payload],{type:mime||'text/plain'});
    const {error}=await SB.client.storage.from('reports').upload(key, body,
      {contentType:(payload instanceof Blob)?(payload.type||mime):mime, upsert:true});
    if(error){ console.warn('repo upload failed', error); return false; }
    return true;
  }catch(e){ console.warn('repo upload failed', e); return false; }
}

function fileStamp(s){ return String(s||'').replace(/[\\/:*?"<>|]+/g,'-').replace(/\s+/g,' ').trim().slice(0,60); }
function compressImage(file, cb){
  const img=new Image();
  img.onload=()=>{
    const max=900, sc=Math.min(1, max/Math.max(img.width,img.height));
    const c=document.createElement('canvas');
    c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(img.src);
    cb(c.toDataURL('image/jpeg',0.55));
  };
  img.onerror=()=>{ URL.revokeObjectURL(img.src); alert('Could not read that image.'); };
  img.src=URL.createObjectURL(file);
}

function migrateV1(d){
  const root=blankRoot(), p=root.projects[0];
  const src=structuredClone(BLANK);
  for(const k in src){ if(d[k]!==undefined) src[k]=d[k]; }
  COMPANY_STORES.forEach(k=>root.company[k]=src[k]);
  PROJECT_STORES.forEach(k=>p[k]=src[k]);
  p.manhours=src.manhours; p.mandays=src.mandays; p.settings=src.settings;
  root.company.name=src.settings.company||'';
  return root;

function fixRoot(r){
  if(!r || typeof r!=='object' || !Array.isArray(r.projects) || !r.projects.length) return blankRoot();
  if(!r.company) r.company={name:'',members:[],equipment:[],training:[],raLibrary:[]};
  COMPANY_STORES.forEach(k=>{ if(!Array.isArray(r.company[k])) r.company[k]=[]; });
  r.projects.forEach(p=>{
    if(!p.id) p.id=uid();
    /* Near Miss rename: rewrite the pre-rename wording so the form preselects.
       Literal, not OBS_KIND_OLD — fixRoot runs before those consts exist. */
    if(Array.isArray(p.observations))
      p.observations.forEach(o=>{ if(o&&o.kind==='Negative — safety non-compliance') o.kind='Unsafe act / unsafe condition'; });
    if(!p.settings) p.settings=structuredClone(BLANK.settings);
    if(!p.manhours) p.manhours={}; if(!p.mandays) p.mandays={};
    PROJECT_STORES.forEach(k=>{ if(!Array.isArray(p[k])) p[k]=[]; });
  });
  if(!r.projects.some(p=>p.id===r.cur)) r.cur=r.projects[0].id;
  return r;
}

  }catch(e){ console.warn('load failed',e); }

/* ============ generic form engine ============ */
const app=document.getElementById('app');
let curEdit=null;

function fieldHtml(f, v){
  let val = (v===undefined||v===null) ? '' : v;
  if(val==='' && v===undefined && f.def!==undefined) val = (f.def==='today') ? today() : f.def;
  let inner='';
  const t=f.type||'text';
  if(t==='textarea'){
    inner='<textarea data-f="'+f.k+'" rows="'+(f.rows||3)+'" placeholder="'+esc(f.ph||'')+'">'+esc(val)+'</textarea>';
  }else if(t==='select'){
    const optArr=typeof f.opts==='function'?f.opts():f.opts; /* dynamic option lists + [value,label] pairs */
    const _sp=otherSplit(val), _hasOther=f.other||optArr.some(o=>(Array.isArray(o)?o[0]:o)==='Others');
    inner='<select data-f="'+f.k+'"><option value=""></option>'+
      optArr.map(o=>{ const v=Array.isArray(o)?o[0]:o, l=Array.isArray(o)?o[1]:o;
        return '<option value="'+esc(v)+'"'+(String(v)===String(_sp.opt)?' selected':'')+'>'+esc(l)+'</option>'; }).join('')+'</select>'+
      (_hasOther?otherBoxHtml(f,val):'');
  }else{
    const listArr = f.list ? (typeof f.list==='function'?f.list():f.list) : null;
    inner='<input data-f="'+f.k+'" type="'+t+'" value="'+esc(val)+'" placeholder="'+esc(f.ph||'')+'"'+
      (listArr?' list="dl-'+f.k+'"':'')+'>'+
      (listArr?'<datalist id="dl-'+f.k+'">'+listArr.map(o=>'<option value="'+esc(o)+'">').join('')+'</datalist>':'');
  }
  return '<div class="fld'+(f.half?' half':'')+'"><label>'+esc(f.label)+(f.req?' *':'')+'</label>'+inner+
    (f.hint?'<div class="hint">'+f.hint+'</div>':'')+'</div>';
}

function subRow(f, r){
  r=r||{};
  const cell=c=>{
    const v=r[c.k]===undefined?'':r[c.k];
    let inp;
    if(c.type==='select'){
      const optArr=typeof c.opts==='function'?c.opts():(c.opts||[]);
      const sp=otherSplit(v), hasOther=optArr.some(o=>(Array.isArray(o)?o[0]:o)==='Others');
      inp='<select data-c="'+c.k+'"><option value=""></option>'+
        optArr.map(o=>{ const ov=Array.isArray(o)?o[0]:o, ol=Array.isArray(o)?o[1]:o;
          return '<option value="'+esc(ov)+'"'+(String(ov)===String(sp.opt)?' selected':'')+'>'+esc(ol)+'</option>'; }).join('')+'</select>'+
        (hasOther?'<input data-cother="'+c.k+'" class="otherbox" placeholder="Please specify" value="'+esc(sp.txt)+'"'+(sp.opt==='Others'?'':' hidden')+' style="margin-top:5px">':'');
    }else if(c.type==='photos'){
      const arr=Array.isArray(v)?v:[];
      return '<div class="cell full"><span class="cl">'+esc(c.label)+'</span>'+
        '<div class="thumbs" data-cphotos="'+c.k+'">'+arr.map(thumbHtml).join('')+'</div>'+
        '<button type="button" class="minor" data-addrowphoto="1">+ Photo</button></div>';
    }else if(c.type==='textarea'){
      inp='<textarea data-c="'+c.k+'" rows="2">'+esc(v)+'</textarea>';
    }else if(c.list){
      inp='<input data-c="'+c.k+'" type="'+(c.type||'text')+'" value="'+esc(v)+'" list="dlr-'+f.k+'-'+c.k+'" placeholder="'+esc(c.ph||'')+'">';
    }else{
      inp='<input data-c="'+c.k+'" type="'+(c.type||'text')+'" value="'+esc(v)+'">';
    }
    return '<div class="cell'+(c.w==='full'?' full':'')+'"><span class="cl">'+esc(c.label)+'</span>'+inp+'</div>';
  };
  return '<div class="subrow"><button type="button" class="rm" title="Remove row" aria-label="Remove row">&times;</button><div class="sub-grid">'+f.cols.map(cell).join('')+'</div></div>';
}

function rowsHtml(f, arr){
  /* one datalist per suggesting column, shared by every row incl. added ones */
  const dls=(f.cols||[]).filter(c=>c.list).map(c=>{
    const items=typeof c.list==='function'?c.list():c.list;
    return '<datalist id="dlr-'+f.k+'-'+c.k+'">'+(items||[]).map(n=>'<option value="'+esc(n)+'">').join('')+'</datalist>';
  }).join('');
  return '<div class="fld"><label>'+esc(f.label)+'</label>'+dls+
    '<div class="rowswrap" data-rows="'+f.k+'">'+(arr||[]).map(r=>subRow(f,r)).join('')+'</div>'+
    '<button type="button" class="minor" data-addrow="'+f.k+'">+ '+esc(f.add||'Add row')+'</button>'+
    (f.hint?'<div class="hint">'+f.hint+'</div>':'')+'</div>';
}

function thumbHtml(dataUrl){
  return '<div class="thumb"><img src="'+dataUrl+'" alt="photo">'+
    '<button type="button" class="rmp" title="Remove photo" aria-label="Remove photo">&times;</button>'+
    '<button type="button" class="mkp" title="Mark up photo" aria-label="Mark up photo">&#9998;</button></div>';
}
function photosHtml(f, arr){
  return '<div class="fld"><label>'+esc(f.label)+'</label>'+
    '<div class="thumbs" data-photos="'+f.k+'">'+(arr||[]).map(thumbHtml).join('')+'</div>'+
    '<button type="button" class="minor" data-addphoto="'+f.k+'">+ Add photo (camera or library)</button>'+
    '<input type="file" accept="image/*" multiple hidden data-photofile="'+f.k+'">'+
    (f.hint?'<div class="hint">'+f.hint+'</div>':'')+'</div>';
}

/* "Others — something" splits back into the option and the free text */
function otherSplit(v){
  const m=/^Others\s+\u2014\s+(.*)$/.exec(String(v||''));
  return m?{opt:'Others', txt:m[1]}:{opt:v||'', txt:''};
}
function otherBoxHtml(f, v){
  const sp=otherSplit(v);
  return '<input data-other="'+f.k+'" class="otherbox" placeholder="Please specify" value="'+esc(sp.txt)+'"'+
    (sp.opt==='Others'?'':' hidden')+' style="margin-top:6px">';
}
/* where a members field keeps its signatures: {memberId: dataURL} */
function sigKeyOf(f){ return f.sigKey||(f.k+'Sigs'); }
function membersHtml(f, ids, sigs){
  ids=ids||[];
  const ms=[...db.members].filter(m=>!m.mergedInto).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  if(!ms.length)
    return '<div class="fld"><label>'+esc(f.label)+'</label>'+
      '<div class="hint">No workers registered yet — add them under Workers to tick attendance here.</div></div>';
  /* hidden authoritative set: one checkbox per worker, read on save */
  const grid='<div class="pickgrid" data-f="'+f.k+'" data-type="members" hidden>'+
    ms.map(m=>'<input type="checkbox" data-mid="'+m.id+'"'+(ids.includes(m.id)?' checked':'')+'>').join('')+'</div>';
  return '<div class="fld"><label>'+esc(f.label)+'</label>'+
    '<div class="mpick" data-for="'+f.k+'">'+
      '<div class="mpick-chips"></div>'+
      '<input class="mpick-q" type="search" inputmode="search" autocomplete="off" placeholder="Search worker name or ID\u2026">'+
      '<div class="mpick-res"></div>'+
    '</div>'+ grid +
    (f.sig?('<textarea data-sigstore="'+f.k+'" hidden>'+esc(JSON.stringify(sigs||{}))+'</textarea>'+
            '<div data-sigwrap="'+f.k+'">'+sigListHtml(ids, sigs||{}, 'msig')+'</div>'):'')+
    (f.hint?'<div class="hint">'+f.hint+'</div>':'')+'</div>';
}
/* ---- signatures on any attendance field (delegated: works in every render path) ---- */
function sigStoreRead(wrap){
  const ta=wrap.parentNode.querySelector('[data-sigstore="'+wrap.dataset.sigwrap+'"]');
  try{ return JSON.parse(ta.value||'{}'); }catch(e){ return {}; }
}
function sigStoreWrite(wrap, obj){
  const ta=wrap.parentNode.querySelector('[data-sigstore="'+wrap.dataset.sigwrap+'"]');
  if(ta) ta.value=JSON.stringify(obj||{});
}
function sigWrapPaint(wrap){
  const grid=wrap.parentNode.querySelector('.pickgrid[data-f="'+wrap.dataset.sigwrap+'"]');
  if(!grid) return;
  const ids=[...grid.querySelectorAll('[data-mid]')].filter(c=>c.checked).map(c=>c.dataset.mid);
  wrap.innerHTML=sigListHtml(ids, sigStoreRead(wrap), 'msig');
}
/* ticking / unticking someone refreshes their sign-here button */
document.addEventListener('change',e=>{
  const grid=e.target.closest&&e.target.closest('.pickgrid[data-type="members"]');
  if(!grid) return;
  const wrap=grid.parentNode.querySelector('[data-sigwrap="'+grid.dataset.f+'"]');
  if(wrap) sigWrapPaint(wrap);
});
document.addEventListener('click',e=>{
  const btn=e.target.closest&&e.target.closest('[data-msig]');
  if(!btn) return;
  const wrap=btn.closest('[data-sigwrap]'); if(!wrap) return;
  const id=btn.dataset.msig, m=db.members.find(x=>x.id===id);
  sigPadOpen(m?m.name:'', d=>{
    if(!d) return;
    const cur=sigStoreRead(wrap); cur[id]=d; sigStoreWrite(wrap, cur); sigWrapPaint(wrap);
  });
});
/* ---- searchable attendance picker (delegated: works in every render path) ---- */
function mpickBox(el){ return el.closest('.mpick'); }
function mpickGrid(box){ return box.parentNode.querySelector('.pickgrid[data-f="'+box.dataset.for+'"]'); }
function mpickPaint(box){
  const grid=mpickGrid(box); if(!grid) return;
  const chips=box.querySelector('.mpick-chips');
  const on=[...grid.querySelectorAll('[data-mid]')].filter(c=>c.checked);
  chips.innerHTML = on.length
    ? on.map(c=>{ const m=db.members.find(x=>x.id===c.dataset.mid);
        return '<span class="mchip">'+esc(m?memberLabel(m):c.dataset.mid)+
          '<button type="button" class="mchip-x" data-cid="'+c.dataset.mid+'" aria-label="Remove">\u00d7</button></span>'; }).join('')
    : '<span class="hint" style="padding:2px 0">Nobody ticked yet.</span>';
  const cnt=box.querySelector('.mpick-cnt');
  if(cnt) cnt.textContent=on.length+' selected';
}
function mpickSearch(box){
  const grid=mpickGrid(box); if(!grid) return;
  const q=(box.querySelector('.mpick-q').value||'').trim().toLowerCase();
  const res=box.querySelector('.mpick-res');
  if(q.length<1){ res.innerHTML='<div class="hint">Type a name or worker ID to find people. Or let workers scan the QR code to check themselves in.</div>'; return; }
  const hits=db.members.filter(m=>!m.mergedInto).filter(m=>
    ((m.name||'')+' '+(m.wid||'')+' '+(m.company||'')).toLowerCase().includes(q)).slice(0,40);
  if(!hits.length){ res.innerHTML='<div class="hint">No worker matches \u201c'+esc(q)+'\u201d.</div>'; return; }
  res.innerHTML=hits.map(m=>{
    const cb=grid.querySelector('[data-mid="'+m.id+'"]');
    return '<label class="pick"><input type="checkbox" data-rid="'+m.id+'"'+((cb&&cb.checked)?' checked':'')+'>'+
      '<span>'+esc(memberLabel(m))+(m.company?' <span class="hint">'+esc(m.company)+'</span>':'')+'</span></label>';
  }).join('')+'<div class="hint mpick-cnt"></div>';
  mpickPaint(box);
}
document.addEventListener('input',e=>{
  if(e.target.classList&&e.target.classList.contains('mpick-q')) mpickSearch(mpickBox(e.target));
});
document.addEventListener('change',e=>{
  const rid=e.target.dataset&&e.target.dataset.rid; if(!rid) return;
  const box=mpickBox(e.target), grid=box&&mpickGrid(box); if(!grid) return;
  const cb=grid.querySelector('[data-mid="'+rid+'"]'); if(cb) cb.checked=e.target.checked;
  mpickPaint(box);
  grid.dispatchEvent(new Event('change',{bubbles:true}));
});
document.addEventListener('click',e=>{
  const cid=e.target.dataset&&e.target.dataset.cid; if(!cid) return;
  const box=mpickBox(e.target), grid=box&&mpickGrid(box); if(!grid) return;
  const cb=grid.querySelector('[data-mid="'+cid+'"]'); if(cb) cb.checked=false;
  const row=box.querySelector('[data-rid="'+cid+'"]'); if(row) row.checked=false;
  mpickPaint(box);
  grid.dispatchEvent(new Event('change',{bubbles:true}));
});

document.addEventListener('DOMContentLoaded',()=>{});
function mpickInitAll(){ document.querySelectorAll('.mpick').forEach(b=>{ mpickSearch(b); mpickPaint(b); }); }

let ROWPHOTO_TARGET=null;
function collectRows(wrap){
  if(!wrap) return [];
  return [...wrap.querySelectorAll(':scope > .subrow')].map(sr=>{
    const o={};
    sr.querySelectorAll('[data-c]').forEach(el=>o[el.dataset.c]=el.value.trim());
    sr.querySelectorAll('[data-cother]').forEach(ob=>{
      const k=ob.dataset.cother, t=ob.value.trim();
      if(o[k]==='Others' && t) o[k]='Others — '+t;
    });
    sr.querySelectorAll('[data-cphotos]').forEach(pw=>
      o[pw.dataset.cphotos]=[...pw.querySelectorAll('img')].map(im=>im.src));
    return o;
  }).filter(o=>Object.values(o).some(v=>Array.isArray(v)?v.length:v!==''));
}

function collectForm(mod){
  const obj={}; let ok=true, first=null;
  for(const f of mod.fields){
    if(f.type==='rows'){ obj[f.k]=collectRows(app.querySelector('[data-rows="'+f.k+'"]')); continue; }
    if(f.type==='photos'){
      const pw=app.querySelector('[data-photos="'+f.k+'"]');
      obj[f.k]=pw?[...pw.querySelectorAll('img')].map(im=>im.src):[];
      continue;
    }
    if(f.type==='members'){
      const pg=app.querySelector('.pickgrid[data-f="'+f.k+'"]');
      obj[f.k]=pg?[...pg.querySelectorAll('[data-mid]')].filter(c=>c.checked).map(c=>c.dataset.mid):[];
      if(f.sig){ /* keep only signatures of people still ticked */
        const ta=app.querySelector('[data-sigstore="'+f.k+'"]');
        let all={}; try{ all=JSON.parse((ta&&ta.value)||'{}'); }catch(e){}
        const keep={}; obj[f.k].forEach(id=>{ if(all[id]) keep[id]=all[id]; });
        obj[sigKeyOf(f)]=keep;
      }
      continue;
    }
    const el=app.querySelector('[data-f="'+f.k+'"]');
    let v=el?el.value.trim():'';
    if(v==='Others'){
      const ob=app.querySelector('[data-other="'+f.k+'"]');
      const ot=ob?ob.value.trim():'';
      if(ot) v='Others — '+ot;
    }
    obj[f.k]=v;
    if(el) el.classList.remove('err');
    if(f.req && !v){ ok=false; if(el){el.classList.add('err'); first=first||el;} }
  }
  if(!ok){ if(first) first.scrollIntoView({behavior:'smooth',block:'center'}); return null; }
  return obj;
}

/* form snapshot without validation — powers close-and-resume drafts (auditor item 22) */
function formSnapshot(mod){
  const obj={};
  for(const f of mod.fields){
    if(f.type==='rows'){ obj[f.k]=collectRows(app.querySelector('[data-rows="'+f.k+'"]')); continue; }
    if(f.type==='photos'){ const pw=app.querySelector('[data-photos="'+f.k+'"]');
      obj[f.k]=pw?[...pw.querySelectorAll('img')].map(im=>im.src):[]; continue; }
    if(f.type==='members'){ const pg=app.querySelector('.pickgrid[data-f="'+f.k+'"]');
      obj[f.k]=pg?[...pg.querySelectorAll('[data-mid]')].filter(c=>c.checked).map(c=>c.dataset.mid):[];
      if(f.sig){ const ta=app.querySelector('[data-sigstore="'+f.k+'"]');
        try{ obj[sigKeyOf(f)]=JSON.parse((ta&&ta.value)||'{}'); }catch(e){} }
      continue; }
    const el=app.querySelector('[data-f="'+f.k+'"]');
    let v=el?el.value:'';
    if(v==='Others'){ const ob=app.querySelector('[data-other="'+f.k+'"]');
      const ot=ob?ob.value.trim():''; if(ot) v='Others — '+ot; }
    if(el) obj[f.k]=v;
  }
  return obj;
}

/* delegated handlers for repeating rows */
app.addEventListener('click', e=>{
  const add=e.target.closest('[data-addrow]');
  if(add && curEdit){
    const f=MODULES[curEdit.key].fields.find(x=>x.k===add.dataset.addrow);
    const wrap=app.querySelector('[data-rows="'+f.k+'"]');
    if(f && wrap){ wrap.insertAdjacentHTML('beforeend', subRow(f)); }
    return;
  }
  const rm=e.target.closest('.subrow .rm');
  if(rm){ rm.closest('.subrow').remove(); return; }
  const arp=e.target.closest('[data-addrowphoto]');
  if(arp){
    const wrap=arp.parentNode.querySelector('[data-cphotos]');
    if(wrap && wrap.children.length>=3){ alert('Maximum 3 photos per finding — remove one first.'); return; }
    ROWPHOTO_TARGET=wrap;
    let inp=document.getElementById('rowPhotoFile');
    if(!inp){
      inp=document.createElement('input');
      inp.type='file'; inp.accept='image/*'; inp.multiple=true; inp.hidden=true; inp.id='rowPhotoFile';
      inp.addEventListener('change',()=>{
        const files=[...(inp.files||[])]; inp.value='';
        if(!files.length||!ROWPHOTO_TARGET) return;
        const room=Math.max(0, 3-ROWPHOTO_TARGET.children.length);
        if(files.length>room) toast('Only '+room+' more photo(s) fit here — the rest were skipped.');
        files.slice(0,room).forEach(f=>compressImage(f, d=>ROWPHOTO_TARGET.insertAdjacentHTML('beforeend', thumbHtml(d))));
      });
      document.body.appendChild(inp);
    }
    inp.click();
    return;
  }
  const ap=e.target.closest('[data-addphoto]');
  if(ap){
    const wrap=app.querySelector('[data-photos="'+ap.dataset.addphoto+'"]');
    if(wrap && wrap.children.length>=3){ alert('Maximum 3 photos per field — remove one first.'); return; }
    const inp=app.querySelector('[data-photofile="'+ap.dataset.addphoto+'"]');
    if(inp) inp.click();
    return;
  }
  const rp=e.target.closest('.thumb .rmp');
  if(rp){ rp.closest('.thumb').remove(); return; }
  const mk=e.target.closest('.thumb .mkp');
  if(mk){ openMarkup(mk.closest('.thumb').querySelector('img')); }
});

/* company registers viewed from a project default to the site subset; HQ can
   flip to the whole company. Searching always spans the whole register so a
   worker/machine can be found and brought onto site. */
const LSCOPE={};
function renderList(key){
  const mod=MODULES[key];
  let items=[...db[mod.store]];
  if(mod.baseFilter) items=items.filter(mod.baseFilter);
  items.sort(mod.sort || ((a,b)=>(b.date||'').localeCompare(a.date||'')));
  const scoped=!!mod.siteFilter;
  const scope=scoped?(LSCOPE[key]||'site'):'company';
  const siteItems=scoped?mod.siteFilter(items):items;
  const subconField=mod.fields.some(f=>f.k==='subcon');
  const subcons=subconField?[...new Set(items.map(i=>(i.subcon||'').trim()).filter(Boolean))].sort():[];
  const newHash=mod.newRoute||('#/'+key+'/new');
  app.innerHTML = header(mod.title, true,
      (items.length?'<button class="iconbtn" aria-label="Export CSV" title="Export CSV (Excel)" onclick="exportModuleCsv(\''+key+'\')">'+ic('dl')+'</button>':'')+
      '<button class="iconbtn" aria-label="Add" onclick="location.hash=\''+newHash+'\'">'+ic('plus')+'</button>')+
    (scoped?'<div class="btnrow" style="margin:0 0 10px">'+
      '<button class="btn'+(scope==='site'?'':' ghost')+'" id="scSite" style="flex:1">On this project ('+siteItems.length+')</button>'+
      (isHQ()?'<button class="btn'+(scope==='company'?'':' ghost')+'" id="scAll" style="flex:1">Whole company ('+items.length+')</button>':'')+
      '</div>':'')+
    (mod.listHeader?mod.listHeader(scope==='site'?siteItems:items):'')+
    '<div class="searchwrap" style="display:flex;gap:8px;flex-wrap:wrap">'+
      '<input id="q" type="search" placeholder="Search '+mod.title.toLowerCase()+(scoped?' (searches the whole register)':'')+'&hellip;" autocomplete="off" style="flex:1;min-width:180px">'+
      (subcons.length?'<select id="fSub" style="width:auto;max-width:220px"><option value="">All subcontractors</option>'+
        subcons.map(s=>'<option>'+esc(s)+'</option>').join('')+'</select>':'')+
    '</div>'+
    '<div id="rows"></div>';
  const sB=document.getElementById('scSite'), aB=document.getElementById('scAll');
  if(sB) sB.onclick=()=>{ LSCOPE[key]='site'; renderList(key); };
  if(aB) aB.onclick=()=>{ LSCOPE[key]='company'; renderList(key); };
  const rowsEl=document.getElementById('rows');
  const draw=()=>{
    const q=(document.getElementById('q').value||'').toLowerCase();
    const fs=document.getElementById('fSub'); const sub=fs?fs.value:'';
    let f=(scope==='site'&&!q)?siteItems:items;
    if(sub) f=f.filter(i=>(i.subcon||'').trim()===sub);
    if(q) f=f.filter(i=>JSON.stringify(i).toLowerCase().includes(q));
    rowsEl.innerHTML = f.length ? f.map(i=>
      '<div class="lrow" onclick="location.hash=\'#/'+key+'/'+i.id+'\'">'+
        '<div class="lmain"><div class="lt">'+(mod.line1(i)||'<span style="color:var(--sub)">(untitled)</span>')+'</div>'+
        '<div class="ls">'+(mod.line2?mod.line2(i):'')+'</div></div>'+
        '<div class="lmeta">'+(mod.meta?mod.meta(i):'')+'</div></div>').join('')
     : '<div class="empty">'+((q||sub)?'No matches.':(mod.empty||'No records yet.'))+
       ((q||sub)?'':'<br><button class="btn" style="margin-top:12px" onclick="location.hash=\''+newHash+'\'">+ Add first record</button>')+'</div>';
  };
  draw();
  document.getElementById('q').oninput=draw;
  const fs=document.getElementById('fSub'); if(fs) fs.onchange=draw;
}

let PREFILL=null;
function renderEdit(key, id){
  const mod=MODULES[key];
  const item=id?db[mod.store].find(x=>x.id===id):null;
  if(id && !item){ location.hash='#/'+key; return; }
  curEdit={key,id};
  /* entry memory: new records prefill remembered fields (who conducted, which
     provider, ...) and can copy the whole previous entry */
  let mem={}; try{ mem=item?{}:JSON.parse(localStorage.getItem('kkl-mem-'+key)||'{}'); }catch(e){}
  const pre=(!item&&PREFILL&&PREFILL.key===key)?PREFILL.vals:null;
  PREFILL=null;
  window._draftMute=false;
  /* close-and-resume: an unfinished new entry survives the app closing */
  let draft=null;
  if(!item && !pre){
    try{
      const d=JSON.parse(localStorage.getItem('kkl-draft-'+key)||'null');
      if(d&&d.vals&&(Date.now()-d.at)<86400000&&Object.values(d.vals).some(v=>Array.isArray(v)?v.length:String(v||'').trim())) draft=d;
      else localStorage.removeItem('kkl-draft-'+key);
    }catch(e){}
  }
  app.innerHTML = header((item?'Edit — ':'New — ')+mod.title, true)+
    '<div class="card">'+
    (draft?'<div class="hint" style="background:#fff6e2;border:1px solid #e8c877;border-radius:8px;padding:8px 10px;margin-bottom:10px;color:#5c4400">⏎ Resumed your unfinished entry — nothing was lost when the app closed. '+
      '<a href="javascript:void 0" id="draftKill" style="font-weight:650">Start fresh instead</a></div>':'')+
    '<div class="fgrid">'+
    mod.fields.map(f=>{
      const v=item?item[f.k]
        :(pre&&pre[f.k]!==undefined)?pre[f.k]
        :(draft&&draft.vals[f.k]!==undefined&&draft.vals[f.k]!==''&&!(Array.isArray(draft.vals[f.k])&&!draft.vals[f.k].length))?draft.vals[f.k]
        :(f.mem&&mem[f.k]!==undefined)?mem[f.k]
        :undefined;
      if(f.type==='rows') return rowsHtml(f, v);
      if(f.type==='members') return membersHtml(f, v,
        item?item[sigKeyOf(f)]:((draft&&draft.vals[sigKeyOf(f)])||(pre&&pre[sigKeyOf(f)])||{}));
      if(f.type==='photos') return photosHtml(f, v);
      return fieldHtml(f, v);
    }).join('')+
    '</div><div class="btnrow"><button class="btn" id="saveBtn">Save</button>'+
    ((!item&&mod.copyLast&&db[mod.store].length&&!pre)?'<button class="btn ghost" type="button" id="copyLastBtn">Copy last entry</button>':'')+
    (item?'<button class="btn ghost" title="Print / PDF report" onclick="location.hash=\'#/'+key+'/'+id+'/print\'" style="padding:12px 14px">'+ic('print')+'</button>':'')+
    (item?'<button class="btn danger" id="delBtn">Delete</button>':'')+'</div></div>';
  const clb=document.getElementById('copyLastBtn');
  if(clb) clb.onclick=()=>{
    const last=[...db[mod.store]].sort(mod.sort||((a,b)=>(b.date||'').localeCompare(a.date||'')))[0];
    if(!last) return;
    const SKIP=['id','date','time','status','photos','beforePhotos','afterPhotos','checkins','attendees',
                'closedDate','rectifiedDate','verifiedDate','deliveredDate','qrToken','readiness','overrides','contextSnapshot'];
    const vals={};
    mod.fields.forEach(f=>{
      if(SKIP.includes(f.k)||f.type==='photos') return;
      if(last[f.k]!==undefined) vals[f.k]=JSON.parse(JSON.stringify(last[f.k]));
    });
    PREFILL={key, vals};
    renderEdit(key, null);
    toast('Copied from the last entry — adjust and save');
  };
  document.getElementById('saveBtn').onclick=()=>{
    const obj=collectForm(mod); if(!obj) return;
    window._draftMute=true;
    try{ localStorage.removeItem('kkl-draft-'+key); }catch(e){}
    const memFs=mod.fields.filter(f=>f.mem);
    if(memFs.length){
      const m={}; memFs.forEach(f=>{ if(obj[f.k]) m[f.k]=obj[f.k]; });
      try{ localStorage.setItem('kkl-mem-'+key, JSON.stringify(m)); }catch(e){}
    }
    if(item){ Object.assign(item,obj); }
    else{ obj.id=uid(); db[mod.store].push(obj); }
    if(mod.beforeSave) mod.beforeSave(item||obj);
    save();
    EV.emit('record:changed',{store:mod.store, id:(item||obj).id});
    location.hash='#/'+key;
  };
  const del=document.getElementById('delBtn');
  if(del) del.onclick=()=>{
    if(confirm('Delete this record? This cannot be undone.')){
      audit('record-deleted', mod.store, id, {label:String(item.name||item.title||item.activity||item.desc||item.date||'').slice(0,80)}, null);
      db[mod.store]=db[mod.store].filter(x=>x.id!==id); save();
      EV.emit('record:deleted',{store:mod.store, id});
      location.hash='#/'+key;
    }
  };
  if(!item){
    const dkey='kkl-draft-'+key; let _dt=null;
    const _snap=()=>{ if(window._draftMute||!curEdit||curEdit.key!==key||curEdit.id) return;
      try{ localStorage.setItem(dkey, JSON.stringify({at:Date.now(), vals:formSnapshot(mod)})); }catch(e){} };
    const dcard=app.querySelector('.card');
    if(dcard) ['input','change','click'].forEach(ev=>dcard.addEventListener(ev,()=>{ clearTimeout(_dt); _dt=setTimeout(_snap, ev==='input'?700:900); }));
    const dk=document.getElementById('draftKill');
    if(dk) dk.onclick=()=>{ window._draftMute=true; try{ localStorage.removeItem(dkey); }catch(e){} renderEdit(key,null); };
  }
  if(mod.afterRender) mod.afterRender(item);
}

/* ============ router ============ */
function route(){
  if(typeof GATED!=='undefined' && GATED) return; /* sign-in landing owns the screen */
  setTimeout(()=>{ try{ mpickInitAll(); }catch(e){} },0);
  const p=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
  if(window._keepScroll){ window._keepScroll=false; }
  else window.scrollTo(0,0);
  curEdit=null;
  if(/^#access_token=|^#error/.test(location.hash)){ /* Supabase invite/recovery link landing */
    app.innerHTML='<div class="empty" style="margin-top:60px">Completing sign-in&hellip;</div>';
    return;
  }
  if(p[0]==='setpw') return renderSetPw();
  if(p[0]==='team') return renderTeam();
  if(p[0]==='toolbox') return renderToolbox();
  if(p[0]==='checkin' && p[3]) return renderCheckin(p[1], p[2], decodeURIComponent(p[3]));
  if(p[0]==='hazard' && p[2]) return renderHazardPublic(p[1], decodeURIComponent(p[2]));
  if(p[0]==='hazardqr') return renderHazardPoster();
  if((p[0]==='rasys'||p[0]==='raver'||p[0]==='raworker') && SB.profile && SB.profile.role==='viewer'){
    app.innerHTML=header('RA / SWP', true)+'<div class="empty">RA / SWP is restricted.</div>'; return;
  }
  if(p[0]==='rasys') return p[1]?renderRaDetail(p[1]):renderRaSys();
  if(p[0]==='raver'&&p[1]) return renderRaVer(p[1]);
  if(p[0]==='raworker'&&p[1]) return renderRaWorker(p[1]);
  if((p[0]==='ra'||p[0]==='raimport'||p[0]==='ralib'||p[0]==='ramasters'||p[0]==='rareviews'||p[0]==='legacy'||p[0]==='raexport'||p[0]==='radiff') && !canRA()){
    app.innerHTML=header('RA / SWP', true)+
      '<div class="empty">The RA / SWP register is restricted to '+esc(root.company.name||'the main contractor')+'’s safety personnel<br>(admin / WSHO accounts).</div>';
    return;
  }
  if(p[0]==='raimport') return renderRaImport();
  if(p[0]==='ramasters') return p[1]?renderRaMasterDetail(p[1]):renderRaMasters();
  if(p[0]==='radiff'&&p[2]) return renderRaDiffView(p[1],p[2]);
  if(p[0]==='rareviews') return renderRaReviews();
  if(p[0]==='legacy') return renderLegacyDocs();
  if(p[0]==='raexport'&&p[1]) return renderRaExport(p[1]);
  if(p[0]==='connect' && p[1]){ /* one-tap device setup: #/connect/<base64url cfg> */
    try{
      const cfg=JSON.parse(atob(decodeURIComponent(p[1]).replace(/-/g,'+').replace(/_/g,'/')));
      if(cfg.url && cfg.anon){
        localStorage.setItem(SB.cfgKey, JSON.stringify({url:cfg.url, anon:cfg.anon}));
        location.hash='#/settings'; syncInit(); return;
      }
    }catch(e){}
    location.hash='#/'; return;
  }
  syncShell(p[0]||'');
  if(!p.length) return renderHome();
  const key=p[0], sub=p[1];
  if(key==='companyhome'||key==='audit'||key==='organisations'){
    if(!isHQ()){ app.innerHTML=header('Company (HQ)', true)+'<div class="empty">Company-level data is restricted to HQ users.</div>'; return; }
    if(key==='companyhome') return renderCompanyHome();
    if(key==='audit') return renderAudit();
    /* organisations falls through to the generic module below */
  }
  if(key==='layout')   return sub?renderLayoutEditor(sub):renderLayouts();
  if(key==='diary')    return renderDiary();
  if(key==='lmracheck') return renderLmraCheck();
  if(key==='eq'&&sub)  return renderEqQuick(sub);
  if(key==='eqposters') return renderEqPosters();
  if(key==='matrix')   return renderMatrix();
  if(key==='finder')   return renderFinder();
  if(key==='dupes'){
    if(!isHQ()){ app.innerHTML=header('Duplicate Review', true)+'<div class="empty">HQ users only.</div>'; return; }
    return renderDupes();
  }
  if(key==='passport'&&sub) return renderPassport(sub);
  if(key==='sic')      return sub?renderSicSession(sub):renderSic();
  if(key==='sicready') return renderSicReadiness(null);
  if(key==='reports') return renderReports();
  if(key==='memberPrivate'&&!canHR()){ app.innerHTML=header('Private (HR)', true)+'<div class="empty">HR-restricted records.</div>'; return; }
  if(key==='memberPrivate'&&sub&&SB.profile){
    window.PVSEEN=window.PVSEEN||new Set();
    if(!PVSEEN.has(sub)){ PVSEEN.add(sub); audit('private-viewed','memberPrivate',sub,null,null); save(); }
  }
  if(key==='certexp')  return renderCertExp();
  if(key==='stats')    return renderStats();
  if(key==='report')   return renderReport();
  if(key==='actions')  return renderActions();
  if(key==='settings') return renderSettings();
  if(MODULES[key]){
    if(!sub) return renderList(key);
    if(sub==='new') return renderEdit(key,null);
    if(p[2]==='print') return renderRecordPrint(key,sub);
    return renderEdit(key,sub);
  }
  renderHome();
}

    if(obj.memberId&&obj.course){
      const t=wfGuessType(obj.course);
      if(t&&t.code!=='OTH'){
        const m=db.members.find(x=>x.id===obj.memberId);
        let comp=db.workerCompetencies.find(c=>c.memberId===obj.memberId&&c.typeCode===t.code);

          comp={id:'wc-t-'+obj.id, memberId:obj.memberId, memberName:m?m.name:obj.name,
            company:m?m.company||'':'', typeCode:t.code, typeName:t.name};
          db.workerCompetencies.push(comp);
          audit('competency-from-training','workerCompetency',comp.id,null,{typeCode:t.code, trainingId:obj.id});
        }
        if(!comp.expiry||(obj.expiry&&obj.expiry>comp.expiry)){
          comp.certNo=comp.certNo||obj.certNo||''; comp.issuer=comp.issuer||obj.provider||'';
          comp.issued=obj.date||comp.issued||''; comp.expiry=obj.expiry||comp.expiry||'';

 workerCompetencies:{ title:'Competency', store:'workerCompetencies',

   {k:'expiry',label:'Expiry',type:'date',half:1},
   {k:'verification',label:'Verification',type:'select',half:1,opts:['UNVERIFIED','VERIFIED','AI_EXTRACTED','LEGACY']},
   {k:'photos',label:'Certificate photo',type:'photos'},
   {k:'remarks',label:'Remarks',type:'textarea',rows:2}],
  beforeSave:function(obj){
    const m=db.members.find(x=>x.id===obj.memberId);
    if(m){ obj.memberName=m.name||''; obj.company=m.company||''; }
    const t=compTypeByCode(obj.typeCode);
    if(t&&!obj.typeName) obj.typeName=t.name;
    /* regulated validity: suggest expiry from issue date when none entered
       (CSOC 2y, crane reg 2y, forklift 3y, OFAC 2y, LEW 5y, ...) */
    if(t&&t.validYears&&obj.issued&&!obj.expiry){
      const d=new Date(obj.issued+'T00:00'); d.setFullYear(d.getFullYear()+t.validYears);
      obj.expiry=isoLocal(d);
    }
    if(!obj.verification) obj.verification='UNVERIFIED';
    const prev=db.workerCompetencies.find(x=>x.id===obj.id);
    if(obj.verification==='VERIFIED'&&(!prev||prev.verification!=='VERIFIED')){
      obj.verifiedBy=raWho(); obj.verifiedAt=today();
      audit('competency-verified','workerCompetency',obj.id,prev?{verification:prev.verification}:null,{verification:'VERIFIED'});
    }else if(prev&&prev.verification==='VERIFIED'&&obj.verification!=='VERIFIED'){
      audit('competency-unverified','workerCompetency',obj.id,{verification:'VERIFIED'},{verification:obj.verification});
    }else if(!prev){
      audit('competency-added','workerCompetency',obj.id,null,{typeCode:obj.typeCode,memberId:obj.memberId});
    }
  },
  siteFilter:items=>{ const ids=projectMemberIds(); return items.filter(c=>ids.has(c.memberId)); },

/* ============ open-actions hub ============ */
function allOpenActions(){
  const out=[];
  const add=(due,label,detail,link,src,by)=>out.push({due:due||'', days:daysTo(due), label, detail, link, src, by:by||''});
  db.observations.forEach(o=>{ if(o.kind!==OBS_POS && o.status!=='Closed')
    add(o.due, o.category||'Near miss / unsafe condition', [o.subitem||o.desc, o.subcon].filter(Boolean).join(' · '), '#/observations/'+o.id, 'Near miss', o.by); });
  db.defects.forEach(o=>{ if(o.status!=='Closed')
    add(o.due, [o.element,o.grouping].filter(Boolean).join(' — ')||'Defect', [o.desc, o.subcon].filter(Boolean).join(' · '), '#/defects/'+o.id, 'Defect', o.subcon); });
  db.inspections.forEach(i=>(i.findings||[]).forEach(f=>{ if(f.status!=='Closed' && (f.desc||f.action))
    add(f.due, f.desc||'Finding', [f.action, f.by].filter(Boolean).join(' · '), '#/inspections/'+i.id, 'Inspection', f.by); }));
  db.incidents.forEach(i=>(i.actions||[]).forEach(a=>{ if(a.status!=='Closed' && (a.desc||a.by))
    add(a.due, a.desc||'Incident action', [a.by, fmtD(i.date)].filter(Boolean).join(' · '), '#/incidents/'+i.id, 'Incident', a.by); }));
  db.meetings.forEach(m=>(m.agenda||[]).forEach(a=>{ if(a.status!=='Closed' && (a.item||a.action))
    add(a.due, a.action||a.item, [a.by, fmtD(m.date)].filter(Boolean).join(' · '), '#/meetings/'+m.id, 'Meeting', a.by); }));
  /* expired statutory items become corrective actions automatically */
  certRows('site').filter(r=>r.days<0).slice(0,60).forEach(r=>
    add(r.expiry, 'Renew: '+r.name, r.owner+' \u00b7 expired '+fmtD(r.expiry), r.link, 'Cert'));
  /* material requests approaching or past their needed-by date */
  db.materialRequests.forEach(m=>{
    if(m.status==='Delivered'||m.status==='Rejected'||!m.neededBy) return;
    if((daysTo(m.neededBy)??1)<=3)
      add(m.neededBy, 'Material: '+(((m.items||[])[0]||{}).desc||'request'),
          [m.status, m.requestedBy].filter(Boolean).join(' \u00b7 '), '#/materialRequests/'+m.id, 'Material', m.approvedBy||m.requestedBy);
  });
  /* recurring statutory inspections due/overdue */
  db.recurringChecks.forEach(rc=>{
    const due=recNextDue(rc);
    if(due&&(daysTo(due)??1)<=7)
      add(due, rc.title||'Recurring inspection', [rc.area, rc.freq, rc.assignTo].filter(Boolean).join(' \u00b7 '), '#/recurringChecks/'+rc.id, 'Recurring', rc.assignTo);
  });
  return out.sort((a,b)=>(a.days??9e9)-(b.days??9e9));
}
const REC_FREQ={'Daily':1,'Weekly':7,'Fortnightly':14,'Monthly':30,'Quarterly':91,'6-Monthly':182,'Yearly':365};
function recNextDue(rc){
  const days=REC_FREQ[rc.freq]||7;
  if(!rc.lastDone) return today();
  const d=new Date(rc.lastDone+'T00:00'); d.setDate(d.getDate()+days);
  return isoLocal(d);
}
function openActionCounts(){
  const acts=allOpenActions();
  return { total:acts.length, overdue:acts.filter(a=>a.days!==null&&a.days<0).length };
}
let ACTF={mine:false};
function renderActions(){
  let acts=allOpenActions();
  const myName=(SB.profile&&(SB.profile.display_name||SB.profile.email||'').split('@')[0]||'').toLowerCase();
  if(ACTF.mine&&myName) acts=acts.filter(a=>(a.by||'').toLowerCase().includes(myName));
  const groups=[
   {t:'Overdue', c:'b', f:a=>a.days!==null&&a.days<0},
   {t:'Due within 7 days', c:'w', f:a=>a.days!==null&&a.days>=0&&a.days<=7},
   {t:'Later / no due date', c:'n', f:a=>a.days===null||a.days>7}];
  const row=a=>'<div class="lrow" onclick="location.hash=\''+a.link+'\'">'+
    '<div class="lmain"><div class="lt">'+esc(a.label)+'</div>'+
    '<div class="ls">'+esc(a.detail||'')+'</div></div>'+
    '<div class="lmeta"><span class="chip">'+a.src+'</span>'+(a.due?'<br><span class="chip '+(a.days<0?'b':a.days<=7?'w':'n')+'">'+fmtD(a.due)+'</span>':'')+'</div></div>';
  app.innerHTML = header('Open Actions', true)+
    ((SB.profile)?'<div class="btnrow" style="margin:0 0 10px">'+
      '<button class="btn'+(ACTF.mine?' ghost':'')+'" id="actAll" style="flex:1">All</button>'+
      '<button class="btn'+(ACTF.mine?'':' ghost')+'" id="actMine" style="flex:1">Assigned to me</button></div>':'')+
    (acts.length
      ? groups.map(g=>{ const gr=acts.filter(g.f); if(!gr.length) return '';
          return '<div class="exphead '+g.c+'">'+g.t+' ('+gr.length+')</div>'+gr.map(row).join(''); }).join('')
      : '<div class="empty">No open corrective actions.<br>Actions from observations, inspections, incidents, meetings, defects, recurring inspections and expired certs all roll up here.</div>');
  const aa=document.getElementById('actAll'), am=document.getElementById('actMine');
  if(aa) aa.onclick=()=>{ ACTF.mine=false; renderActions(); };
  if(am) am.onclick=()=>{ ACTF.mine=true; renderActions(); };
}

function recordPrintCard(key, id){
  const mod=MODULES[key];
  const item=db[mod.store].find(x=>x.id===id);
  if(!item) return null;
  const s=db.settings;
  const val=f=>{
    const v=item[f.k];
    if(v===undefined||v===null||v===''||(Array.isArray(v)&&!v.length)) return '';
    if(f.type==='photos') return '<div class="thumbs">'+v.map(d=>'<div class="thumb"><img src="'+d+'"></div>').join('')+'</div>';
    if(f.type==='members'){
      if(f.sig){ /* auditor SS679: signature against each name */
        const sg=item[sigKeyOf(f)]||{};
        return '<table class="dtable" style="margin:4px 0"><tr><th style="width:34px">S/N</th>'+
          '<th style="text-align:left">Worker ID</th><th style="text-align:left">Name</th>'+
          '<th style="text-align:left">Company</th><th style="width:110px">Signature</th></tr>'+
          v.map((idm,i)=>{ const m=db.members.find(x=>x.id===idm)||{};
            return '<tr><td style="text-align:center">'+(i+1)+'</td><td style="text-align:left">'+esc(m.wid||'')+'</td>'+
              '<td style="text-align:left">'+esc(m.name||idm)+'</td><td style="text-align:left">'+esc(m.company||'')+'</td>'+
              '<td style="height:30px;text-align:center">'+(sg[idm]?'<img src="'+sg[idm]+'" style="height:24px">':'')+'</td></tr>'; }).join('')+
          '</table>';
      }
      const names=v.map(idm=>{const m=db.members.find(x=>x.id===idm); return m?esc(memberLabel(m)):'';}).filter(Boolean);
      return names.length? names.join(', ') : '';
    }
    if(f.type==='rows'){
      const cols=f.cols.filter(c=>c.type!=='photos'), pcol=f.cols.find(c=>c.type==='photos');
      return '<table class="dtable" style="margin:4px 0"><tr>'+cols.map(c=>'<th style="text-align:left">'+esc(c.label)+'</th>').join('')+'</tr>'+
        v.map(r=>{
          const imgs=pcol&&Array.isArray(r[pcol.k])?r[pcol.k]:[];
          return '<tr>'+cols.map(c=>'<td style="text-align:left">'+esc(r[c.k]||'')+'</td>').join('')+'</tr>'+
            (imgs.length?'<tr><td colspan="'+cols.length+'" style="text-align:left">'+
              imgs.map(d=>'<img src="'+d+'" style="width:190px;border:1px solid #999;margin:4px 6px 4px 0">').join('')+'</td></tr>':'');
        }).join('')+'</table>';
    }
    if(f.type==='textarea') return esc(v).replace(/\n/g,'<br>');
    if(f.type==='date') return fmtD(v);
    if(f.type==='select'&&typeof f.opts==='function'){ /* resolve [id,label] pairs to the label */
      const hit=(f.opts()||[]).find(o=>Array.isArray(o)&&o[0]===v); if(hit) return esc(hit[1]); }
    return esc(v);
  };
  /* short fields pair up two per row; long content gets a full-width row */
  const cells=[]; let pair=null;
  mod.fields.forEach(f=>{
    const v=val(f); if(!v) return;
    const long = f.type==='rows'||f.type==='photos'||f.type==='textarea'||f.type==='members'||v.length>90||v.includes('<');
    if(long){
      if(pair){ cells.push('<tr>'+pair+'<th></th><td></td></tr>'); pair=null; }
      cells.push('<tr><th>'+esc(f.label)+'</th><td class="wide" colspan="3">'+v+'</td></tr>');
    }else if(pair){ cells.push('<tr>'+pair+'<th>'+esc(f.label)+'</th><td>'+v+'</td></tr>'); pair=null; }
    else pair='<th>'+esc(f.label)+'</th><td>'+v+'</td>';
  });
  if(pair) cells.push('<tr>'+pair+'<th></th><td></td></tr>');
  const proj=[['Project',s.project],['Contractor',s.company||'Koh Kock Leong Enterprise Pte Ltd'],
    ['Contract no.',s.hdbContract],['Site ref',s.siteRef]].filter(x=>x[1]);
  return '<div class="doctitle">'+esc(mod.title.toUpperCase())+' REPORT</div>'+
    '<div class="docmeta">Record ID: <b>'+esc(item.id)+'</b> &nbsp;·&nbsp; Generated: <b>'+fmtD(today())+'</b> &nbsp;·&nbsp; KKL CMS</div>'+
    '<table class="ftable">'+
      (proj.length?'<tr>'+proj.slice(0,2).map(x=>'<th>'+esc(x[0])+'</th><td>'+esc(x[1])+'</td>').join('')+'</tr>':'')+
      (proj.length>2?'<tr>'+proj.slice(2,4).map(x=>'<th>'+esc(x[0])+'</th><td>'+esc(x[1])+'</td>').join('')+
        (proj.length===3?'<th></th><td></td>':'')+'</tr>':'')+
    '</table>'+
    '<table class="ftable">'+cells.join('')+'</table>'+
    (mod.printExtra?mod.printExtra(item):'')+
    '<table class="sigtable"><tr>'+
      '<td>Prepared by (name / designation / signature / date)</td>'+
      '<td>Reviewed by (name / designation / signature / date)</td>'+
    '</tr></table>';
}

/* auto-file a completed record's report: cloud library + OneDrive mirror,
   never a forced download. Fire-and-forget. */
async function autoFileRecord(key, id){
  try{
    const mod=MODULES[key];
    const item=db[mod.store].find(x=>x.id===id); if(!item) return;
    const card=recordPrintCard(key, id); if(!card) return;
    const doc=reportDocHtml(mod.title+' Report', card);
    const pdf=await htmlToPdfBlob(doc); if(!pdf) return;
    const name=mod.store+'-'+(item.date||today())+'-'+fileStamp(item.id)+'.pdf';
    const cat=DIRMAP[key]||'Registers';
    const up=await repoUpload(cat, name, pdf, 'application/pdf');
    await saveToSafety(cat, name, pdf, 'application/pdf').catch(()=>{});
    if(up) toast(mod.title+' report filed to the Report Library');
  }catch(e){ console.warn('auto-file failed', e); }
}
function saveRecordHtml(key, id){
  const mod=MODULES[key];
  const item=db[mod.store].find(x=>x.id===id); if(!item) return;
  const card=recordPrintCard(key, id); if(!card) return;   /* build from data, not the DOM */
  const name=mod.store+'-'+(item.date||today())+'-'+fileStamp(item.id)+'.html';
  saveOrDownload(DIRMAP[key]||'Registers', name, reportDocHtml(mod.title+' Report', card), 'text/html');
}

/* which company resources touch the CURRENT project */
function projectMemberIds(){
  const s=new Set();
  db.workerProjectAccess.forEach(a=>a.memberId&&s.add(a.memberId));
  db.workActivities.forEach(w=>(w.crew||[]).forEach(c=>c.memberId&&s.add(c.memberId)));
  db.tbm.forEach(t=>{ (t.checkins||[]).forEach(c=>c.memberId&&s.add(c.memberId));
                      (t.attendees||[]).forEach(id=>s.add(id)); });
  db.equipment.forEach(e=>{ if(e.projectId===root.cur&&e.operatorMemberId) s.add(e.operatorMemberId); });
  return s;
}
function projectPlantIds(){
  const s=new Set();
  db.workActivities.forEach(w=>(w.plant||[]).forEach(p=>p.equipmentId&&s.add(p.equipmentId)));
  return s;
}
function equipOnSite(e, pIds){ return e.projectId===root.cur || (pIds||projectPlantIds()).has(e.id); }
function trainingMemberOf(t){
  return t.memberId?db.members.find(x=>x.id===t.memberId)
        :db.members.find(x=>(x.name||'').trim().toLowerCase()===(t.name||'').trim().toLowerCase());
}
function certRows(scope){
  const out=[];
  const push=(cat,owner,name,expiry,link,warn)=>{ const d=daysTo(expiry);
    if(d!==null) out.push({cat,owner,name,expiry,days:d,link,warn:warn||30}); };
  const mIds=scope==='site'?projectMemberIds():null;
  const pIds=scope==='site'?projectPlantIds():null;
  db.members.forEach(m=>{
    if(mIds&&!mIds.has(m.id)) return;
    if(m.wpExpiry) push('Work pass', m.name, 'Work pass', m.wpExpiry, '#/members/'+m.id);
    const comps=memberComps(m.id);
    if(comps.length) comps.forEach(c=>push('Competency', m.name, c.typeName||c.typeCode||'Cert', c.expiry, '#/workerCompetencies/'+c.id));
    else (m.certs||[]).forEach(c=>push('Member cert', m.name, c.name||'Cert', c.expiry, '#/members/'+m.id));
  });
  db.equipment.forEach(e=>{
    if(pIds&&!equipOnSite(e,pIds)) return;
    const label=[e.type,e.regNo].filter(Boolean).join(' ');
    (e.certs||[]).forEach(c=>push('Equipment', label, c.name||'LM/LG cert', c.expiry, '#/equipment/'+e.id));
    if(e.hdbML) push('Equipment', label, 'Material list registration', e.hdbML, '#/equipment/'+e.id);
    if(e.aeDue) push('Equipment', label, 'AE inspection & test', e.aeDue, '#/equipment/'+e.id);
    if(e.serviceDue) push('Equipment', label, 'Crane servicing', e.serviceDue, '#/equipment/'+e.id, 14);
  });
  db.training.forEach(t=>{
    if(mIds){ const m=trainingMemberOf(t); if(!m||!mIds.has(m.id)) return; }
    push('Training', t.name, t.course, t.expiry, '#/training/'+t.id);
  });
  db.documents.forEach(d=>push('Document', d.title, 'Validity', d.expiry, '#/documents/'+d.id));
  if(scope!=='site') db.companyDocs.forEach(d=>push('Company doc', d.title, 'Validity', d.expiry, '#/companyDocs/'+d.id));
  return out.sort((a,b)=>a.days-b.days);
}
