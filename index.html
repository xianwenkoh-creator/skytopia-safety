<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1e2933" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10161b" media="(prefers-color-scheme: dark)">
<title>SKYTOPIA Site Safety</title>
<style>
  /* SKYTOPIA Site Safety — Procore-inspired UI (CORE palette: orange-60 action, blue-65 links, gray h200) */
  :root{
    --bg:#f2f3f5; --card:#ffffff; --field:#ffffff;
    --ink:#282828; --sub:#68757d; --line:#dfe3e6; --line2:#c3cbd0;
    --acc:#f47e42; --acc-h:#e2662a; --acc-soft:#fdece1; --btn-ink:#ffffff; --badge:#d62c2f;
    --blue:#006ddf; --blue-soft:#f0f6fe;
    --good-ink:#177c1f; --good-bg:#eafaea;
    --warn-ink:#8a5b00; --warn-bg:#fff7d9;
    --bad-ink:#d62c2f;  --bad-bg:#fff0f0;
    --hdr:#1e2933; --hdr-ink:#ffffff; --hdr-sub:#9fb0bc;
    --s1:#2a78d6; --s2:#f47e42; --s3:#1baf7a;
    --viz-grid:#e3e6e8; --viz-axis:#c6ccd0; --viz-muted:#8b969d;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#15191d; --card:#1e242a; --field:#242b31;
      --ink:#e8ebed; --sub:#98a5ad; --line:#2e363d; --line2:#48535b;
      --acc:#f47e42; --acc-h:#ff8f55; --acc-soft:#37281d; --btn-ink:#ffffff; --badge:#e04b4b;
      --blue:#5aa2f0; --blue-soft:#1c2836;
      --good-ink:#4fce6a; --good-bg:rgba(30,160,60,.16);
      --warn-ink:#f3b73f; --warn-bg:rgba(250,178,25,.14);
      --bad-ink:#ef8080;  --bad-bg:rgba(230,103,103,.16);
      --hdr:#10161b; --hdr-ink:#ffffff; --hdr-sub:#8b9aa5;
      --s1:#3987e5; --s2:#f47e42; --s3:#1baf7a;
      --viz-grid:#2b3238; --viz-axis:#3d464d; --viz-muted:#8b969d;
    }
  }
  :root[data-theme="dark"]{
    --bg:#15191d; --card:#1e242a; --field:#242b31;
    --ink:#e8ebed; --sub:#98a5ad; --line:#2e363d; --line2:#48535b;
    --acc:#f47e42; --acc-h:#ff8f55; --acc-soft:#37281d; --btn-ink:#ffffff; --badge:#e04b4b;
    --blue:#5aa2f0; --blue-soft:#1c2836;
    --good-ink:#4fce6a; --good-bg:rgba(30,160,60,.16);
    --warn-ink:#f3b73f; --warn-bg:rgba(250,178,25,.14);
    --bad-ink:#ef8080;  --bad-bg:rgba(230,103,103,.16);
    --hdr:#10161b; --hdr-ink:#ffffff; --hdr-sub:#8b9aa5;
    --s1:#3987e5; --s2:#f47e42; --s3:#1baf7a;
    --viz-grid:#2b3238; --viz-axis:#3d464d; --viz-muted:#8b969d;
  }

  *{box-sizing:border-box;}
  html{background:var(--bg);}
  body{margin:0; font-family:"Helvetica Neue",system-ui,-apple-system,"Segoe UI",Arial,sans-serif; font-size:15px; line-height:1.45; color:var(--ink); background:var(--bg);
       padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);}

  /* ===== app shell: dark top bar + tool sidebar (Procore-style) ===== */
  .appbar{position:fixed; top:0; left:0; right:0; height:48px; z-index:40; background:var(--hdr); color:var(--hdr-ink);
          display:flex; align-items:center; gap:2px; padding:0 10px 0 6px;}
  .appbar .iconbtn{color:var(--hdr-ink); width:38px; height:38px; border-radius:4px;}
  .appbar .iconbtn:hover{background:rgba(255,255,255,.1);}
  .brand{display:flex; align-items:center; gap:8px; text-decoration:none; color:var(--hdr-ink); padding:4px 8px 4px 4px; border-radius:4px;}
  .brand:hover{background:rgba(255,255,255,.08);}
  .bmark{display:flex; align-items:center; justify-content:center; width:24px; height:24px; border-radius:4px;
         background:var(--acc); color:#fff; font-size:14px; font-weight:800;}
  .bword{font-size:14.5px; font-weight:750; letter-spacing:.14em;}
  .bdiv{width:1px; height:22px; background:rgba(255,255,255,.25); margin:0 8px;}
  .projsel{display:flex; align-items:center; gap:6px; max-width:44vw; background:none; border:none; color:var(--hdr-ink);
           font:inherit; font-size:13.5px; font-weight:600; padding:6px 8px; border-radius:4px; cursor:pointer;}
  .projsel:hover{background:rgba(255,255,255,.1);}
  .projsel span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .projsel svg{width:14px; height:14px; flex:0 0 auto; color:var(--hdr-sub);}
  .abadge{position:absolute; top:3px; right:3px; min-width:16px; height:16px; padding:0 4px; border-radius:8px;
          background:var(--badge); color:#fff; font-size:10.5px; font-weight:700; line-height:16px;}

  .shell{display:flex; padding-top:48px; min-height:100vh;}
  .sidenav{position:fixed; top:48px; bottom:0; left:0; width:230px; z-index:30; overflow-y:auto; overscroll-behavior:contain;
           background:var(--card); border-right:1px solid var(--line); padding:6px 0 30px;}
  .sn-home{margin-top:6px;}
  .sn-group{font-size:10.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--sub); padding:16px 16px 5px;}
  .sn-item{display:flex; align-items:center; gap:10px; padding:7.5px 14px 7.5px 13px; border-left:3px solid transparent;
           font-size:13.5px; font-weight:600; color:var(--ink); text-decoration:none;}
  .sn-item svg{width:17px; height:17px; color:var(--sub); flex:0 0 auto;}
  .sn-item:hover{background:var(--bg);}
  .sn-item.on{border-left-color:var(--acc); background:var(--acc-soft);}
  .sn-item.on svg{color:var(--acc);}
  .sn-item .sbdg{margin-left:auto; min-width:20px; text-align:center; padding:0 6px; border-radius:9px;
                 background:var(--badge); color:#fff; font-size:11px; font-weight:700; line-height:18px;}
  .scrim{display:none; position:fixed; inset:48px 0 0 0; z-index:25; background:rgba(15,22,27,.45);}
  .content{flex:1; margin-left:230px; min-width:0;}
  .wrap{max-width:1060px; margin:0 auto; padding:0 22px 60px;}
  .burger{display:none;}
  @media (max-width:940px){
    .sidenav{transform:translateX(-102%); transition:transform .18s ease; box-shadow:4px 0 18px rgba(0,0,0,.18);}
    .sidenav.open{transform:none;}
    .scrim.open{display:block;}
    .content{margin-left:0;}
    .burger{display:block;}
    .bword{display:none;}
    .wrap{padding:0 14px 60px;}
  }

  header.top{display:flex; align-items:center; gap:8px; padding:14px 0 12px; position:sticky; top:48px; background:var(--bg); z-index:5;
             border-bottom:1px solid var(--line); margin-bottom:14px;}
  header.top h1{font-size:20px; font-weight:650; margin:0; letter-spacing:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  header.top .spacer{flex:1;}
  .iconbtn{background:none; border:none; color:var(--ink); width:38px; height:38px; padding:7px; cursor:pointer; border-radius:4px; flex:0 0 auto;}
  .iconbtn:hover{background:var(--acc-soft);}
  .iconbtn:active{background:var(--acc-soft);}
  .iconbtn svg{width:100%; height:100%;}

  .brandrule{display:none;}
  h2.sect{display:flex; align-items:center; gap:10px; font-size:11px; font-weight:800; letter-spacing:.14em;
          text-transform:uppercase; color:var(--sub); margin:22px 0 10px;}
  h2.sect::after{content:''; flex:1; height:1px; background:var(--line);}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); gap:10px;}
  .tile{display:block; text-align:center; text-decoration:none; color:var(--ink); -webkit-tap-highlight-color:transparent;
        background:var(--card); border:1px solid var(--line); border-radius:6px; padding:16px 8px 13px;}
  .tile:hover{border-color:var(--line2); box-shadow:0 1px 4px rgba(20,33,43,.10);}
  .tile .ic{position:relative; width:46px; height:46px; margin:0 auto 8px; border-radius:6px;
            background:none; display:flex; align-items:center; justify-content:center;}
  .tile .ic svg{width:30px; height:30px; color:var(--sub);}
  .tile:hover .ic svg{color:var(--acc);}
  .tile:active .ic{outline:none;}
  .tile .tl{display:block; font-size:12.5px; font-weight:650; color:var(--ink);}
  .tile .bdg{position:absolute; top:-4px; right:-6px; min-width:20px; padding:0 6px; border-radius:10px;
             background:var(--badge); color:#fff; font-size:11.5px; font-weight:700; line-height:1.6;}

  .card{background:var(--card); border:1px solid var(--line); border-radius:6px; padding:16px; margin-bottom:12px;}
  .foot{margin-top:26px; font-size:12px; color:var(--sub); text-align:center;}

  /* list — Procore log-table look */
  .searchwrap{margin-bottom:10px;}
  .searchwrap input{width:100%; max-width:420px;}
  .lrow{display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:0;
        border-left:none; border-right:none; padding:10px 13px; margin-bottom:-1px; cursor:pointer;}
  .lrow:first-child{border-top-left-radius:6px; border-top-right-radius:6px; border-left:1px solid var(--line); border-right:1px solid var(--line);}
  .lrow{border-left:1px solid var(--line); border-right:1px solid var(--line);}
  .lrow:last-child{border-bottom-left-radius:6px; border-bottom-right-radius:6px; margin-bottom:8px;}
  .lrow:hover{background:var(--blue-soft);}
  .lrow:active{background:var(--blue-soft);}
  .lmain{flex:1; min-width:0;}
  .lt{font-size:14px; font-weight:650; color:var(--blue); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .ls{font-size:12.5px; color:var(--sub); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:1px;}
  .lmeta{flex:0 0 auto; text-align:right; max-width:40%;}
  .empty{text-align:center; color:var(--sub); font-size:14px; padding:34px 16px; line-height:1.6;
         background:var(--card); border:1px dashed var(--line2); border-radius:6px;}
  .empty .btn{margin-top:12px;}

  .chip{display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:3px;
        background:var(--blue-soft); color:var(--blue); white-space:nowrap; margin-left:3px;}
  .chip.g{background:var(--good-bg); color:var(--good-ink);}
  .chip.w{background:var(--warn-bg); color:var(--warn-ink);}
  .chip.b{background:var(--bad-bg); color:var(--bad-ink);}
  .chip.n{background:var(--bg); color:var(--sub); border:1px solid var(--line);}
  a.chip.lnk{text-decoration:none;}

  /* forms */
  label{display:block; font-size:12.5px; font-weight:650; color:var(--sub); margin:12px 0 4px;}
  input,select,textarea{width:100%; font:inherit; font-size:16px; color:var(--ink); background:var(--field);
        border:1px solid var(--line2); border-radius:4px; padding:8px 10px; min-height:42px;}
  textarea{min-height:0;}
  input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--blue); outline-offset:1px;}
  input.err,select.err,textarea.err{border-color:var(--bad-ink); outline:2px solid var(--bad-ink);}
  .hint{font-size:12px; color:var(--sub); margin-top:4px;}
  .fgrid{display:grid; grid-template-columns:1fr 1fr; gap:0 10px;}
  .fgrid .fld{grid-column:1/-1; min-width:0;}
  .fgrid .fld.half{grid-column:auto;}

  .btn{display:inline-block; font:inherit; font-size:14px; font-weight:650; color:var(--btn-ink); background:var(--acc);
       border:1px solid var(--acc); border-radius:4px; padding:10px 18px; cursor:pointer; min-height:42px;}
  .btn:hover{background:var(--acc-h); border-color:var(--acc-h);}
  .btn.ghost{background:var(--card); color:var(--ink); border:1px solid var(--line2);}
  .btn.ghost:hover{background:var(--bg);}
  .btn svg{width:19px; height:19px; vertical-align:-4px;}
  .btn.danger{background:var(--card); color:var(--bad-ink); border:1px solid var(--bad-ink);}
  .btn.danger:hover{background:var(--bad-bg);}
  .btnrow{display:flex; gap:10px; margin-top:18px;}
  .btnrow .btn:first-child{flex:1;}
  .minor{background:none; border:1.5px dashed var(--line2); color:var(--blue); font-size:13.5px; font-weight:650;
         border-radius:4px; padding:9px 12px; cursor:pointer; width:100%; margin-top:8px;}
  .minor:hover{background:var(--blue-soft);}

  /* repeating sub-rows */
  .rowswrap{display:flex; flex-direction:column; gap:8px;}
  .subrow{position:relative; border:1px solid var(--line); border-radius:4px; background:var(--bg); padding:10px 34px 10px 10px;}
  .subrow .rm{position:absolute; top:6px; right:6px; width:26px; height:26px; border:none; background:none;
              color:var(--bad-ink); font-size:17px; line-height:1; cursor:pointer; border-radius:4px; padding:0;}
  .sub-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:7px;}
  .cell{min-width:0;}
  .cell.full{grid-column:1/-1;}
  .cell .cl{display:block; font-size:10.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--sub); margin-bottom:2px;}
  .cell input,.cell select{min-height:38px; padding:6px 8px; font-size:14px; background:var(--card);}
  .cell textarea{padding:6px 8px; font-size:14px; background:var(--card);}

  /* member picker */
  .pickgrid{display:grid; grid-template-columns:repeat(2,1fr); gap:6px;}
  @media(min-width:520px){.pickgrid{grid-template-columns:repeat(3,1fr);}}
  @media(min-width:900px){.pickgrid{grid-template-columns:repeat(4,1fr);}}
  .pick{display:flex; align-items:center; gap:7px; border:1px solid var(--line); border-radius:4px; background:var(--field);
        padding:7px 9px; font-size:13.5px; font-weight:600; color:var(--sub); cursor:pointer; margin:0; user-select:none;}
  .pick input{width:17px; height:17px; min-height:0; padding:0; margin:0; flex:0 0 auto; accent-color:var(--acc);}
  .pick:has(input:checked){border-color:var(--acc); background:var(--acc-soft); color:var(--ink);}
  .pick span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  /* cert expiry */
  .exphead{font-size:12.5px; font-weight:750; letter-spacing:.05em; text-transform:uppercase; margin:20px 0 8px;}
  .exphead.b{color:var(--bad-ink);} .exphead.w{color:var(--warn-ink);} .exphead.g{color:var(--good-ink);} .exphead.n{color:var(--sub);}

  /* statistics + home overview */
  .tiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; margin-bottom:12px;}
  .stile{background:var(--card); border:1px solid var(--line); border-radius:6px; padding:12px 13px;}
  .stile .v{font-size:23px; font-weight:700; line-height:1.2;}
  .stile .l{font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--sub); margin-top:3px;}
  a.stile{display:block; text-decoration:none; color:var(--ink);}
  a.stile:hover{border-color:var(--line2); box-shadow:0 1px 4px rgba(20,33,43,.10);}
  .stile .v.b{color:var(--bad-ink);} .stile .v.w{color:var(--warn-ink);} .stile .v.g{color:var(--good-ink);}
  .charthead{font-size:14.5px; font-weight:700; margin:2px 0 4px;}
  .legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--sub); font-weight:600; margin:2px 0 6px;}
  .legend i{display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px;}
  .chartwrap{overflow-x:auto;}
  .chartwrap svg{display:block; width:100%; height:auto; min-width:480px;}
  .bar{cursor:pointer;}
  .bar:hover{opacity:.82;}
  .tip{position:fixed; display:none; z-index:50; background:var(--ink); color:var(--bg); font-size:12.5px; font-weight:600;
       padding:5px 9px; border-radius:4px; pointer-events:none; max-width:240px;}
  .dtable{width:100%; border-collapse:collapse; font-size:12.5px; margin-top:6px;}
  .dtable th,.dtable td{border-bottom:1px solid var(--line); padding:5px 6px; text-align:right; font-variant-numeric:tabular-nums;}
  .dtable th:first-child,.dtable td:first-child{text-align:left;}
  .dtable th{color:var(--sub); font-weight:700; font-size:11px; letter-spacing:.04em; text-transform:uppercase;}
  details summary{cursor:pointer; font-size:13.5px; font-weight:650; color:var(--blue);}
  .mhgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-top:10px;}
  @media(min-width:700px){.mhgrid{grid-template-columns:repeat(6,1fr);}}
  .mh span{display:block; font-size:11px; font-weight:700; color:var(--sub); margin-bottom:2px;}
  .mh input{min-height:38px; padding:6px 8px; font-size:14px;}

  /* photos */
  .thumbs{display:flex; gap:8px; flex-wrap:wrap;}
  .thumb{position:relative; width:86px; height:86px; border:1px solid var(--line2); border-radius:4px; overflow:hidden; flex:0 0 auto;}
  .thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .thumb .rmp{position:absolute; top:3px; right:3px; width:22px; height:22px; border:none; border-radius:50%;
              background:rgba(0,0,0,.55); color:#fff; font-size:13px; line-height:1; cursor:pointer; padding:0;}

  /* ranked horizontal bars */
  .hbar{margin:8px 0;}
  .hbar .hlab{font-size:12.5px; color:var(--sub); font-weight:600; display:flex; justify-content:space-between; gap:10px;}
  .hbar .hlab b{color:var(--ink); font-variant-numeric:tabular-nums; white-space:nowrap;}
  .hbar .htrack{background:var(--bg); border:1px solid var(--line); border-radius:3px; height:14px; margin-top:3px; overflow:hidden;}
  .hbar .hfill{height:100%; background:var(--s2); border-radius:2px; min-width:2px;}

  /* monthly report */
  .repmeta{font-size:13px; color:var(--sub); line-height:1.7;}
  .repmeta b{color:var(--ink);}

  /* toast */
  .toast{position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(80px); z-index:60; max-width:88vw;
         background:var(--hdr); color:#fff; font-size:13.5px; font-weight:600; padding:11px 18px; border-radius:6px;
         box-shadow:0 4px 18px rgba(0,0,0,.3); opacity:0; transition:all .22s ease; pointer-events:none;}
  .toast.show{transform:translateX(-50%); opacity:1;}
  .toast.bad{background:#8f1f1f;}

  /* project switcher */
  .projmenu{position:fixed; top:50px; left:56px; z-index:45; min-width:250px; max-width:86vw; display:none;
            background:var(--card); border:1px solid var(--line); border-radius:6px; box-shadow:0 6px 24px rgba(0,0,0,.22); padding:6px 0;}
  .projmenu.open{display:block;}
  .pm-head{font-size:10.5px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--sub); padding:8px 14px 4px;}
  .pm-item{display:flex; align-items:center; gap:8px; width:100%; text-align:left; background:none; border:none; font:inherit;
           font-size:13.5px; font-weight:600; color:var(--ink); padding:9px 14px; cursor:pointer;}
  .pm-item:hover{background:var(--bg);}
  .pm-item.on{color:var(--acc);}
  .pm-item .tick{width:16px; flex:0 0 auto; color:var(--acc);}
  .pm-new{border-top:1px solid var(--line); margin-top:4px; color:var(--blue);}

  /* sign-in landing */
  body.gated .appbar, body.gated .sidenav, body.gated .scrim, body.gated .projmenu{display:none;}
  body.gated .content{margin-left:0;}
  body.gated .shell{padding-top:0;}
  .login{min-height:92vh; display:flex; align-items:center; justify-content:center; padding:20px;}
  .lg-card{background:var(--card); border:1px solid var(--line); border-radius:8px; padding:30px 28px; width:100%; max-width:390px;
           box-shadow:0 10px 34px rgba(15,22,27,.10);}
  .lg-brand{display:flex; gap:12px; align-items:center; margin-bottom:6px;}
  .lg-brand .bmark{width:36px; height:36px; font-size:21px; border-radius:6px;}
  .lg-t{font-weight:800; letter-spacing:.14em; font-size:16.5px;}
  .lg-s{font-size:12.5px; color:var(--sub);}
  .lg-err{color:var(--bad-ink); font-size:13px; font-weight:600; margin-top:10px; display:none;}

  /* smart toolbox */
  .tbx-chips{display:flex; flex-wrap:wrap; gap:7px;}
  .tbx-chip{border:1px solid var(--line2); background:var(--card); color:var(--ink); border-radius:16px;
            font:inherit; font-size:13px; font-weight:600; padding:7px 14px; cursor:pointer;}
  .tbx-chip.on{background:var(--acc); border-color:var(--acc); color:#fff;}
  .tbx-risk{border-left:3px solid var(--acc); background:var(--bg); border-radius:0 4px 4px 0; padding:9px 12px; margin:8px 0;}
  .tbx-risk b{display:block; font-size:13.5px;}
  .tbx-risk span{font-size:12.5px; color:var(--sub);}
  .tbx-langs{display:flex; gap:6px; flex-wrap:wrap; margin:8px 0;}
  .tbx-lang{border:1px solid var(--line2); background:var(--card); border-radius:4px; font:inherit; font-size:12.5px;
            font-weight:700; padding:5px 10px; cursor:pointer; color:var(--ink);}
  .tbx-lang.on{background:var(--blue); border-color:var(--blue); color:#fff;}

const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

function fmtD(iso){ if(!iso) return ''; const d=new Date(iso+'T00:00'); if(isNaN(d)) return esc(iso);
  return d.toLocaleDateString('en-SG',{day:'2-digit',month:'short',year:'2-digit'}); }
function daysTo(iso){ if(!iso) return null; const t=new Date(); t.setHours(0,0,0,0);
  const d=new Date(iso+'T00:00'); if(isNaN(d)) return null; return Math.round((d-t)/864e5); }
function expChip(iso, warn){ const d=daysTo(iso); if(d===null) return ''; warn=warn||30;
  if(d<0) return '<span class="chip b">expired '+fmtD(iso)+'</span>';
  if(d<=warn) return '<span class="chip w">'+d+'d left</span>';
  return '<span class="chip g">'+fmtD(iso)+'</span>'; }

function downloadRaw(name, text, mime){

/* ============ SKYTOPIA Safety folder (File System Access API) ============
   Reports & exports save straight into the connected Safety folder
   (OneDrive\Skytopia\Safety), each type into its own subfolder.        */
const DIRMAP={contacts:'Registers',members:'Registers',equipment:'Registers',documents:'Registers',certexp:'Registers',
  tbm:'TBM',inspections:'Inspections',observations:'Observations',checklists:'Checklists',ra:'RA-SWP',training:'Training',
  meetings:'Meetings',incidents:'Incidents',defects:'Quality Defects',report:'Monthly Reports',backup:'Backups'};
function idbOpen(){ return new Promise((res,rej)=>{ const r=indexedDB.open('kkl-cms-fs',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('kv');
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbGet(k){ const d=await idbOpen(); return new Promise((res,rej)=>{
  const t=d.transaction('kv').objectStore('kv').get(k); t.onsuccess=()=>res(t.result); t.onerror=()=>rej(t.error); }); }
async function idbSet(k,v){ const d=await idbOpen(); return new Promise((res,rej)=>{
  const t=d.transaction('kv','readwrite').objectStore('kv').put(v,k); t.onsuccess=()=>res(); t.onerror=()=>rej(t.error); }); }
async function idbDel(k){ const d=await idbOpen(); return new Promise((res,rej)=>{
  const t=d.transaction('kv','readwrite').objectStore('kv').delete(k); t.onsuccess=()=>res(); t.onerror=()=>rej(t.error); }); }
function fsSupported(){ return !!window.showDirectoryPicker; }
async function getSafetyDir(ask){
  let h=null; try{ h=await idbGet('safetyDir'); }catch(e){}
  if(!h) return null;
  try{
    let q=await h.queryPermission({mode:'readwrite'});
    if(q!=='granted' && ask) q=await h.requestPermission({mode:'readwrite'});
    return q==='granted'?h:null;
  }catch(e){ return null; }
}
let toastTimer=null;
function toast(msg, bad){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.toggle('bad',!!bad); t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'), 4200);
}
async function saveToSafety(cat, name, text, mime){
  if(!fsSupported()) return false;
  let root;
  try{ root=await getSafetyDir(true); }catch(e){ return false; }
  if(!root) return false;
  try{
    const dir=await root.getDirectoryHandle(cat,{create:true});
    const fh=await dir.getFileHandle(name,{create:true});
    const w=await fh.createWritable();
    const bom=(mime||'').includes('csv')?'﻿':'';
    await w.write(new Blob([bom+text],{type:mime||'text/plain'}));
    await w.close();
    toast('Saved: '+root.name+' \\ '+cat+' \\ '+name);
    return true;
  }catch(e){ console.warn('folder save failed',e); toast('Folder save failed — downloading instead', true); return false; }
}
async function saveOrDownload(cat, name, text, mime){
  if(await saveToSafety(cat,name,text,mime)) return;
  if((mime||'').includes('csv')) downloadText(name,text,mime); else downloadRaw(name,text,mime);
}

function fileStamp(s){ return String(s||'').replace(/[\\/:*?"<>|]+/g,'-').replace(/\s+/g,' ').trim().slice(0,60); }
function compressImage(file, cb){
  const img=new Image();
  img.onload=()=>{
    const max=900, sc=Math.min(1, max/Math.max(img.width,img.height));
    const c=document.createElement('canvas');
    c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(img.src);
    cb(c.toDataURL('image/jpeg',0.55));
  };
  img.onerror=()=>{ URL.revokeObjectURL(img.src); alert('Could not read that image.'); };
  img.src=URL.createObjectURL(file);
}

/* ============ storage (v2: company level + projects + subcon tags) ============ */
const KEY='kkl-cms-v1';    /* legacy flat schema — migrated, never deleted */
const KEY2='kkl-cms-v2';
const COMPANY_STORES=['members','equipment','training'];
const PROJECT_STORES=['contacts','documents','tbm','inspections','observations','checklists','ra','meetings','incidents','defects'];
const BLANK={contacts:[],members:[],equipment:[],documents:[],tbm:[],inspections:[],observations:[],checklists:[],ra:[],training:[],meetings:[],incidents:[],defects:[],manhours:{},mandays:{},settings:{project:'',company:'',hdbContract:'',siteRef:'',estate:'',neighbourhood:'',precinct:''}};
function blankProject(name){
  const p={id:uid(), settings:structuredClone(BLANK.settings), manhours:{}, mandays:{}};
  p.settings.project=name||'';
  PROJECT_STORES.forEach(k=>p[k]=[]);
  return p;
}
function blankRoot(){
  const p=blankProject('');
  return {v:2, company:{name:'', members:[], equipment:[], training:[]}, projects:[p], cur:p.id};
}
function migrateV1(d){
  const root=blankRoot(), p=root.projects[0];
  const src=structuredClone(BLANK);
  for(const k in src){ if(d[k]!==undefined) src[k]=d[k]; }
  COMPANY_STORES.forEach(k=>root.company[k]=src[k]);
  PROJECT_STORES.forEach(k=>p[k]=src[k]);
  p.manhours=src.manhours; p.mandays=src.mandays; p.settings=src.settings;
  root.company.name=src.settings.company||'';
  return root;
}
function fixRoot(r){
  if(!r || typeof r!=='object' || !Array.isArray(r.projects) || !r.projects.length) return blankRoot();
  if(!r.company) r.company={name:'',members:[],equipment:[],training:[]};
  COMPANY_STORES.forEach(k=>{ if(!Array.isArray(r.company[k])) r.company[k]=[]; });
  r.projects.forEach(p=>{
    if(!p.id) p.id=uid();
    if(!p.settings) p.settings=structuredClone(BLANK.settings);
    if(!p.manhours) p.manhours={}; if(!p.mandays) p.mandays={};
    PROJECT_STORES.forEach(k=>{ if(!Array.isArray(p[k])) p[k]=[]; });
  });
  if(!r.projects.some(p=>p.id===r.cur)) r.cur=r.projects[0].id;
  return r;
}
function load(){
  try{
    const raw2=localStorage.getItem(KEY2);
    if(raw2) return fixRoot(JSON.parse(raw2));
    const raw=localStorage.getItem(KEY);
    if(raw) return migrateV1(JSON.parse(raw));
  }catch(e){ console.warn('load failed',e); }
  return blankRoot();
}
let root=load();
if(!localStorage.getItem(KEY2)){ try{ localStorage.setItem(KEY2, JSON.stringify(root)); }catch(e){} }
function curProj(){ return root.projects.find(p=>p.id===root.cur)||root.projects[0]; }
/* facade: existing module code keeps reading db.<store>; routing decides the tier */
const db={};
COMPANY_STORES.forEach(k=>Object.defineProperty(db,k,{get:()=>root.company[k], set:v=>{root.company[k]=v;}}));
PROJECT_STORES.forEach(k=>Object.defineProperty(db,k,{get:()=>curProj()[k], set:v=>{curProj()[k]=v;}}));
['manhours','mandays','settings'].forEach(k=>Object.defineProperty(db,k,{get:()=>curProj()[k], set:v=>{curProj()[k]=v;}}));
function save(){
  try{ localStorage.setItem(KEY2, JSON.stringify(root)); }
  catch(e){ alert('Browser storage is full — the last change could NOT be saved. Remove some photos or old records, or export a backup and clear data.'); }
  schedulePush();
}
function switchProject(id){
  if(!root.projects.some(p=>p.id===id)) return;
  root.cur=id; save(); route();
}
function addProject(name){
  const p=blankProject(name);
  root.projects.push(p); root.cur=p.id; save(); return p;
}

function subRow(f, r){

function membersHtml(f, ids){

function collectRows(wrap){
  if(!wrap) return [];
  return [...wrap.querySelectorAll(':scope > .subrow')].map(sr=>{
    const o={};
    sr.querySelectorAll('[data-c]').forEach(el=>o[el.dataset.c]=el.value.trim());
    return o;
  }).filter(o=>Object.values(o).some(v=>v!==''));
}

function collectForm(mod){
  const obj={}; let ok=true, first=null;
  for(const f of mod.fields){
    if(f.type==='rows'){ obj[f.k]=collectRows(app.querySelector('[data-rows="'+f.k+'"]')); continue; }
    if(f.type==='photos'){
      const pw=app.querySelector('[data-photos="'+f.k+'"]');
      obj[f.k]=pw?[...pw.querySelectorAll('img')].map(im=>im.src):[];
      continue;
    }
    if(f.type==='members'){
      const pg=app.querySelector('.pickgrid[data-f="'+f.k+'"]');
      obj[f.k]=pg?[...pg.querySelectorAll('[data-mid]')].filter(c=>c.checked).map(c=>c.dataset.mid):[];
      continue;
    }
    const el=app.querySelector('[data-f="'+f.k+'"]');
    const v=el?el.value.trim():'';
    obj[f.k]=v;
    if(el) el.classList.remove('err');
    if(f.req && !v){ ok=false; if(el){el.classList.add('err'); first=first||el;} }
  }
  if(!ok){ if(first) first.scrollIntoView({behavior:'smooth',block:'center'}); return null; }
  return obj;
}

/* delegated handlers for repeating rows */
app.addEventListener('click', e=>{
  const add=e.target.closest('[data-addrow]');
  if(add && curEdit){
    const f=MODULES[curEdit.key].fields.find(x=>x.k===add.dataset.addrow);
    const wrap=app.querySelector('[data-rows="'+f.k+'"]');
    if(f && wrap){ wrap.insertAdjacentHTML('beforeend', subRow(f)); }
    return;
  }
  const rm=e.target.closest('.subrow .rm');
  if(rm){ rm.closest('.subrow').remove(); return; }
  const ap=e.target.closest('[data-addphoto]');
  if(ap){
    const wrap=app.querySelector('[data-photos="'+ap.dataset.addphoto+'"]');
    if(wrap && wrap.children.length>=3){ alert('Maximum 3 photos per field — remove one first.'); return; }
    const inp=app.querySelector('[data-photofile="'+ap.dataset.addphoto+'"]');
    if(inp) inp.click();
    return;
  }
  const rp=e.target.closest('.thumb .rmp');
  if(rp){ rp.closest('.thumb').remove(); }
});
app.addEventListener('change', e=>{
  const inp=e.target.closest('[data-photofile]');
  if(!inp || !inp.files || !inp.files[0]) return;
  const file=inp.files[0]; inp.value='';
  const wrap=app.querySelector('[data-photos="'+inp.dataset.photofile+'"]');
  if(!wrap) return;
  compressImage(file, dataUrl=>wrap.insertAdjacentHTML('beforeend', thumbHtml(dataUrl)));
});

  if(id && !item){ location.hash='#/'+key; return; }
  curEdit={key,id};
  app.innerHTML = header((item?'Edit — ':'New — ')+mod.title, true)+
    '<div class="card"><div class="fgrid">'+
    mod.fields.map(f=>{
      const v=item?item[f.k]:undefined;
      if(f.type==='rows') return rowsHtml(f, v);
      if(f.type==='members') return membersHtml(f, v);
      if(f.type==='photos') return photosHtml(f, v);
      return fieldHtml(f, v);
    }).join('')+
    '</div><div class="btnrow"><button class="btn" id="saveBtn">Save</button>'+
    (item?'<button class="btn ghost" title="Print / PDF report" onclick="location.hash=\'#/'+key+'/'+id+'/print\'" style="padding:12px 14px">'+ic('print')+'</button>':'')+
    (item?'<button class="btn danger" id="delBtn">Delete</button>':'')+'</div></div>';
  document.getElementById('saveBtn').onclick=()=>{
    const obj=collectForm(mod); if(!obj) return;
    if(item){ Object.assign(item,obj); }
    else{ obj.id=uid(); db[mod.store].push(obj); }
    if(mod.beforeSave) mod.beforeSave(item||obj);
    save(); location.hash='#/'+key;
  };
  const del=document.getElementById('delBtn');
  if(del) del.onclick=()=>{
    if(confirm('Delete this record? This cannot be undone.')){
      db[mod.store]=db[mod.store].filter(x=>x.id!==id); save(); location.hash='#/'+key;
    }
  };
  if(mod.afterRender) mod.afterRender(item);
}

/* ============ router ============ */
function route(){
  if(typeof GATED!=='undefined' && GATED) return; /* sign-in landing owns the screen */
  const p=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
  window.scrollTo(0,0);
  curEdit=null;
  if(/^#access_token=|^#error/.test(location.hash)){ /* Supabase invite/recovery link landing */
    app.innerHTML='<div class="empty" style="margin-top:60px">Completing sign-in&hellip;</div>';
    return;
  }
  if(p[0]==='setpw') return renderSetPw();
  if(p[0]==='team') return renderTeam();
  if(p[0]==='toolbox') return renderToolbox();
  if(p[0]==='checkin' && p[3]) return renderCheckin(p[1], p[2], decodeURIComponent(p[3]));
  if(p[0]==='connect' && p[1]){ /* one-tap device setup: #/connect/<base64url cfg> */
    try{
      const cfg=JSON.parse(atob(decodeURIComponent(p[1]).replace(/-/g,'+').replace(/_/g,'/')));
      if(cfg.url && cfg.anon){
        localStorage.setItem(SB.cfgKey, JSON.stringify({url:cfg.url, anon:cfg.anon}));
        location.hash='#/settings'; syncInit(); return;
      }
    }catch(e){}
    location.hash='#/'; return;
  }
  syncShell(p[0]||'');
  if(!p.length) return renderHome();
  const key=p[0], sub=p[1];
  if(key==='certexp')  return renderCertExp();
  if(key==='stats')    return renderStats();
  if(key==='report')   return renderReport();
  if(key==='actions')  return renderActions();
  if(key==='settings') return renderSettings();
  if(MODULES[key]){
    if(!sub) return renderList(key);
    if(sub==='new') return renderEdit(key,null);
    if(p[2]==='print') return renderRecordPrint(key,sub);
    return renderEdit(key,sub);
  }
  renderHome();
}
window.addEventListener('hashchange', route);

  afterRender:function(item){
    const kindSel=app.querySelector('[data-f="kind"]');
    const catSel=app.querySelector('[data-f="category"]');
    const subSel=app.querySelector('[data-f="subitem"]');
    let curCat=item?item.category:'', curSub=item?item.subitem:'';
    const fill=(sel,opts,cur)=>{ sel.innerHTML='<option value=""></option>'+
      opts.map(o=>'<option'+(o===cur?' selected':'')+'>'+esc(o)+'</option>').join(''); };
    const syncSub=()=>{ const items=NEGCATS[catSel.value]||[];
      fill(subSel, items, curSub);
      subSel.closest('.fld').style.display=items.length?'':'none'; };
    const syncCat=()=>{ const neg=kindSel.value!==OBS_POS;
      fill(catSel, neg?Object.keys(NEGCATS):POSCATS, curCat); syncSub(); };
    kindSel.addEventListener('change',()=>{ curCat=''; curSub=''; syncCat(); });

    syncCat();

/* ============ open-actions hub ============ */
function allOpenActions(){
  const out=[];
  const add=(due,label,detail,link,src)=>out.push({due:due||'', days:daysTo(due), label, detail, link, src});
  db.observations.forEach(o=>{ if(o.kind!==OBS_POS && o.status!=='Closed')
    add(o.due, o.category||'Observation', [o.subitem||o.desc, o.subcon].filter(Boolean).join(' · '), '#/observations/'+o.id, 'Observation'); });
  db.defects.forEach(o=>{ if(o.status!=='Closed')
    add(o.due, [o.element,o.grouping].filter(Boolean).join(' — ')||'Defect', [o.desc, o.subcon].filter(Boolean).join(' · '), '#/defects/'+o.id, 'Defect'); });
  db.inspections.forEach(i=>(i.findings||[]).forEach(f=>{ if(f.status!=='Closed' && (f.desc||f.action))
    add(f.due, f.desc||'Finding', [f.action, f.by].filter(Boolean).join(' · '), '#/inspections/'+i.id, 'Inspection'); }));
  db.incidents.forEach(i=>(i.actions||[]).forEach(a=>{ if(a.status!=='Closed' && (a.desc||a.by))
    add(a.due, a.desc||'Incident action', [a.by, fmtD(i.date)].filter(Boolean).join(' · '), '#/incidents/'+i.id, 'Incident'); }));
  db.meetings.forEach(m=>(m.agenda||[]).forEach(a=>{ if(a.status!=='Closed' && (a.item||a.action))
    add(a.due, a.action||a.item, [a.by, fmtD(m.date)].filter(Boolean).join(' · '), '#/meetings/'+m.id, 'Meeting'); }));
  return out.sort((a,b)=>(a.days??9e9)-(b.days??9e9));
}
function openActionCounts(){
  const acts=allOpenActions();

}

/* ============ statistics ============ */
let statsYear=new Date().getFullYear();
const ACC_TYPES=['First Aid Case','Medical Treatment / MC','Lost Time Injury','Fatality'];

function inYear(r,yr){ return r.date && +r.date.slice(0,4)===yr; }
function byMonth(arr,yr){ const m=Array(12).fill(0);
  arr.forEach(r=>{ if(inYear(r,yr)){ const i=+r.date.slice(5,7)-1; if(i>=0&&i<12) m[i]++; } }); return m; }
function niceStep(max){ const raw=max/4||1; const p=Math.pow(10,Math.floor(Math.log10(raw)));
  for(const m of [1,2,5,10]){ if(raw<=m*p) return m*p; } return 10*p; }

function barChartSVG(labels, series){
  const W=720,H=230,padL=36,padR=8,padT=10,padB=24;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const max=Math.max(1,...series.flatMap(s=>s.values));
  const step=Math.max(1,niceStep(max)), top=Math.ceil(max/step)*step;
  let grid='';
  for(let v=0; v<=top; v+=step){
    const y=padT+plotH-(v/top)*plotH;
    grid+='<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="'+(v===0?'var(--viz-axis)':'var(--viz-grid)')+'" stroke-width="1"/>'+
      '<text x="'+(padL-6)+'" y="'+(y+3.5)+'" text-anchor="end" font-size="10" fill="var(--viz-muted)">'+v+'</text>';
  }
  const n=labels.length, gw=plotW/n, ns=series.length;
  const bw=Math.min(20,(gw-8)/ns);
  let bars='', xlab='';
  labels.forEach((lb,i)=>{
    xlab+='<text x="'+(padL+i*gw+gw/2)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="var(--viz-muted)">'+lb+'</text>';
    series.forEach((s,si)=>{
      const v=s.values[i]; if(!v) return;
      const h=(v/top)*plotH;
      const x=padL+i*gw+(gw-ns*bw-(ns-1)*2)/2+si*(bw+2);
      const y=padT+plotH-h;
      bars+='<rect class="bar" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+
        '" rx="2" fill="'+s.color+'" data-tip="'+esc(lb+' — '+s.name+': '+v)+'"/>';
    });
  });
  return '<div class="chartwrap"><svg viewBox="0 0 '+W+' '+H+'" role="img" font-family="system-ui,sans-serif">'+grid+bars+xlab+'</svg></div>';
}

function bindTips(){
  const tip=document.getElementById('tip');
  const move=e=>{ const x=e.touches?e.touches[0].clientX:e.clientX, y=e.touches?e.touches[0].clientY:e.clientY;
    tip.style.left=Math.max(4,Math.min(x+12,innerWidth-tip.offsetWidth-8))+'px';
    tip.style.top=Math.max(4,y-34)+'px'; };
  app.querySelectorAll('.bar').forEach(b=>{
    const show=e=>{ tip.textContent=b.dataset.tip; tip.style.display='block'; move(e); };
    b.addEventListener('mouseenter',show);
    b.addEventListener('mousemove',move);
    b.addEventListener('mouseleave',()=>tip.style.display='none');
    b.addEventListener('click',e=>{ show(e); setTimeout(()=>tip.style.display='none',1800); });
  });
}

/* ============ monthly safety data report (HDB Appendix VI) ============ */
let repMonth=today().slice(0,7);

function rankedBars(rows){
  if(!rows.length) return '<div class="hint">No safety non-compliances recorded this month.</div>';
  const max=Math.max(...rows.map(r=>r.v));
  return rows.map(r=>'<div class="hbar"><div class="hlab"><span>'+esc(r.label)+'</span><b>'+r.txt+'</b></div>'+
    '<div class="htrack"><div class="hfill" style="width:'+((r.v/max)*100).toFixed(1)+'%"></div></div></div>').join('');
}

function repData(mk){
  const inMonth=r=>r.date&&r.date.slice(0,7)===mk;
  const inc=db.incidents.filter(inMonth);
  const negs=db.observations.filter(o=>o.kind!==OBS_POS&&inMonth(o));
  const byKey=(arr,fn)=>{ const m={}; arr.forEach(r=>{ const k=(fn(r)||'').trim()||'(unspecified)'; m[k]=(m[k]||0)+1; });
    return Object.entries(m).sort((a,b)=>b[1]-a[1]); };
  return {
    acc: inc.filter(r=>ACC_TYPES.includes(r.type)).length,
    doN: inc.filter(r=>r.type==='Dangerous Occurrence').length,
    fatal: inc.filter(r=>r.type==='Fatality').length,
    mh: +db.manhours[mk]||0,
    md: +db.mandays[mk]||0,
    negs, pos: db.observations.filter(o=>o.kind===OBS_POS&&inMonth(o)).length,
    trades: byKey(negs,o=>o.trade),
    subs: byKey(negs,o=>o.subcon)
  };
}

function exportReportCsv(){
  const mk=repMonth, d=repData(mk);
  const L=[];
  L.push(['Monthly Safety Data Report', MONTHS[+mk.slice(5,7)-1]+' '+mk.slice(0,4)]);
  L.push(['Total workplace accidents reported', d.acc]);
  L.push(['Total mandays worked', d.md||'']);
  L.push(['Man-hours worked', d.mh||'']);
  L.push(['Accident frequency rate (per mil man-hours)', d.mh?(d.acc*1e6/d.mh).toFixed(2):'']);
  L.push(['Number of DO', d.doN]); L.push(['Fatality', d.fatal]); L.push([]);
  L.push(['Breakdown by trade','Count','% of total']);
  d.trades.forEach(t=>L.push([t[0], t[1], d.negs.length?(t[1]/d.negs.length*100).toFixed(1):'0']));
  L.push([]);
  L.push(['Breakdown by subcontractor','Count']);
  d.subs.forEach(t=>L.push([t[0], t[1]])); L.push([]);
  L.push(['S/N','Block','Storey','Unit','Location','Initiator','Subcontractor','Trade','Category','Standard item','Description','Severity','Date found','Time found','Status','Rectified date','Verified date','Closed date','Duration (days)']);
  d.negs.forEach((o,i)=>{
    const dur=(o.closedDate&&o.date)?Math.max(0,Math.round((new Date(o.closedDate)-new Date(o.date))/864e5)):'';
    L.push([i+1,o.block,o.storey,o.unit,o.location,o.initiator,o.subcon,o.trade,o.category,o.subitem,o.desc,o.severity,o.date,o.time,o.status,o.rectifiedDate,o.verifiedDate,o.closedDate,dur]);
  });
  saveOrDownload('Monthly Reports', 'safety-report-'+mk+'.csv', L.map(r=>r.map(csvEsc).join(',')).join('\r\n'), 'text/csv;charset=utf-8');
}
function saveReportHtml(){
  const mk=repMonth;
  const cards=[...app.querySelectorAll('.card')].map(c=>{
    const cl=c.cloneNode(true); cl.querySelectorAll('.noprint,input,select,label').forEach(e=>e.remove()); return cl.outerHTML;
  }).join('');
  saveOrDownload('Monthly Reports', 'safety-report-'+mk+'.html',
    reportDocHtml('Monthly Safety Report '+mk, cards), 'text/html');
}

function tbxBlank(){
  const t={id:uid(), date:today(), time:new Date().toTimeString().slice(0,5), conductor:'',
    acts:[], ptw:'', photos:[], briefing:null, translations:null, quiz:[], qrToken:null, qrLive:false,
    checkins:[], attendees:[], spot:{by:'',desc:'',action:'',photo:null}, weather:null};
  /* a near miss reported recently auto-selects the related briefing topic */
  const d7=new Date(Date.now()-7*864e5).toISOString().slice(0,10);
  const MAP=[[/revers|lorry|tipper|truck|vehicle|traffic/i,'Vehicle & Plant Movement'],[/crane|lift|sling|load/i,'Lifting Operations'],
    [/scaffold/i,'Scaffolding'],[/trench|excavat|dig/i,'Excavation & Trenching'],[/fall|height|ladder|edge/i,'Work at Height'],
    [/weld|hot work|cut|spark|fire/i,'Hot Works'],[/confined|manhole|tank/i,'Confined Space'],[/electr|cable|shock/i,'Electrical Works']];
  db.incidents.filter(i=>i.type==='Near Miss'&&(i.date||'')>=d7).forEach(i=>{
    MAP.forEach(([re,act])=>{ if(re.test(i.description||'')&&!t.acts.includes(act)) t.acts.push(act); });
  });
  return t;
}
function tbxRaMatches(acts){
  const kw=acts.map(a=>a.toLowerCase().split(/[ &\/]+/)).flat().filter(w=>w.length>3);
  return db.ra.filter(r=>{ const t=(r.activity||'').toLowerCase();
    return acts.some(a=>t.includes(a.toLowerCase().slice(0,6))) || kw.some(w=>t.includes(w)); });
}
function tbxYesterday(){
  const items=[];
  const prev=[...db.tbm].sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0];
  if(prev && prev.spot && prev.spot.desc)
    items.push({t:'Yesterday’s hazard spot', d:prev.spot.desc+(prev.spot.action?' → '+prev.spot.action:''), photo:prev.spot.photo||null});
  const d7=new Date(Date.now()-7*864e5).toISOString().slice(0,10);
  db.incidents.filter(i=>i.type==='Near Miss'&&(i.date||'')>=d7).slice(-2).forEach(i=>
    items.push({t:'Near miss — '+fmtD(i.date), d:(i.description||'').split('\n')[0], photo:null}));
  const dy=new Date(Date.now()-3*864e5).toISOString().slice(0,10);
  db.observations.filter(o=>o.kind!=='Positive observation'&&(o.date||'')>=dy).slice(-2).forEach(o=>
    items.push({t:'Recent finding — '+esc(o.category||''), d:[o.subitem||o.desc,o.subcon].filter(Boolean).join(' · '),
      photo:(o.beforePhotos||[])[0]||null}));
  return items;
}
async function tbxWeather(){
  try{
    const r=await fetch('https://api.data.gov.sg/v1/environment/2-hour-weather-forecast');
    const d=await r.json();
    const fc=(d.items&&d.items[0]&&d.items[0].forecasts)||[];
    const wet=fc.filter(f=>/rain|shower|thunder/i.test(f.forecast)).length;
    if(!fc.length) return null;
    if(wet===0) return {line:'NEA 2-hr nowcast: no rain expected island-wide.', wet:false};
    return {line:'NEA 2-hr nowcast: rain/showers over '+wet+' of '+fc.length+' areas — lightning risk: STOP work at height, lifting and open-field work when CAT 1 sounds; watch slippery access.', wet:true};
  }catch(e){ return null; }
}
function tbxComposeBrief(){
  const s=db.settings;
  const L=[];
  L.push('TOOLBOX BRIEFING — '+fmtD(TBX.date)+(s.project?' — '+s.project:''));
  L.push('Today’s work: '+TBX.acts.join(', ')+'.');
  if(TBX.ptw) L.push('Permits (ePTW): '+TBX.ptw+' — NO PERMIT, NO WORK.');
  if(TBX.weather) L.push(TBX.weather.line);
  L.push('');
  L.push('TOP RISKS TODAY — what can kill or injure you, and what must be in place:');
  tbxTopRisks().forEach((r,i)=>{ L.push((i+1)+'. '+r.h); L.push('   → '+r.c); });
  const ra=tbxRaMatches(TBX.acts);
  if(ra.length) L.push('Refer to RA/SWP: '+ra.map(r=>r.activity+(r.ref?' ('+r.ref+')':'')).join('; ')+'.');
  const yl=tbxYesterday();
  if(yl.length){ L.push(''); L.push('YESTERDAY’S LESSON: '+yl[0].t+' — '+yl[0].d); }
  L.push('');
  L.push('Look at the photos of today’s work area: WHAT IS WRONG OR COULD GO WRONG HERE? Speak up now.');
  return L.join('\n');
}
function tbxTopRisks(){
  const out=[];
  TBX.acts.forEach(a=>{ (TBX_ACT[a]?TBX_ACT[a].risks:[]).forEach(r=>out.push(r)); });
  return out.slice(0,3+Math.max(0,TBX.acts.length-1));
}
function tbxQuizBank(){
  const qs=[];
  TBX.acts.forEach(a=>{ (TBX_ACT[a]?TBX_ACT[a].quiz:[]).forEach(q=>qs.push(q)); });
  return qs;
}
function tbxSpeak(text, langCode){
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang=langCode; u.rate=0.95;
    const v=speechSynthesis.getVoices().find(v=>v.lang && v.lang.toLowerCase().startsWith(langCode.split('-')[0]));
    if(v) u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){ toast('Audio not available on this device', true); }
}
let qrLibP=null;
function loadQrLib(){
  if(window.QRCode) return Promise.resolve();
  if(qrLibP) return qrLibP;
  qrLibP=new Promise((res,rej)=>{ const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js';
    s.onload=res; s.onerror=()=>{qrLibP=null;rej(new Error('QR library failed to load'))};
    document.head.appendChild(s); });
  return qrLibP;
}

function tbmDashboardHtml(items){
  const d30=new Date(Date.now()-30*864e5).toISOString().slice(0,10);
  const recent=items.filter(i=>(i.date||'')>=d30);
  if(!recent.length) return '';
  const roster=Math.max(1,db.members.length);
  let att=0, quizN=0, quizOk=0, spots=0, closed=0, overdue=0;
  recent.forEach(t=>{
    const n=(t.attendees||[]).length+((t.checkins||[]).filter(c=>!c.memberId).length)+((t.others||'').split('\n').filter(x=>x.trim()).length);
    att+=Math.min(1,n/roster);
    (t.checkins||[]).forEach(c=>{ if(c.answer!==undefined&&c.answer!==null){ quizN++; if(c.correct) quizOk++; } });
    if(t.spot&&t.spot.desc){ spots++;
      const o=t.spot.obsId?db.observations.find(x=>x.id===t.spot.obsId):null;
      if(o){ if(o.status==='Closed') closed++; else if(o.due&&daysTo(o.due)<0) overdue++; }
    }
  });
  const pct=v=>Math.round(v*100)+'%';
  const tile=(v,l,cls)=>'<div class="stile"><div class="v'+(cls?' '+cls:'')+'">'+v+'</div><div class="l">'+l+'</div></div>';
  return '<div class="tiles" style="margin-top:2px">'+
    tile(recent.length,'TBM held (30d)')+
    tile(pct(att/recent.length),'Avg attendance')+
    tile(quizN?pct(quizOk/quizN):'—','Comprehension','g')+
    tile(spots,'Hazards raised')+
    tile(closed,'Closed','g')+
    tile(overdue,'Overdue',overdue?'b':'')+
  '</div>';
}

function tbxPersist(final){
  const t=TBX;
  /* hazard spot -> tracked observation (once) */
  if(final && t.spot.desc && !t.spot.obsId){
    const obs={id:uid(), kind:'Safety non-compliance', date:t.date, time:t.time, initiator:t.spot.by||t.conductor,
      category:'Housekeeping / General', desc:'TBM hazard spot: '+t.spot.desc+(t.spot.action?'\nAction: '+t.spot.action:''),
      severity:'Minor', status:'Open', due:new Date(Date.now()+3*864e5).toISOString().slice(0,10),
      beforePhotos:t.spot.photo?[t.spot.photo]:[], afterPhotos:[]};
    db.observations.push(obs);
    t.spot.obsId=obs.id;
  }
  const brief=t.briefing||tbxComposeBrief();
  const risks=tbxTopRisks().map((r,i)=>(i+1)+'. '+r.h+' — '+r.c).join('\n');
  const auto=[
    'Attendance: '+(t.attendees.length+t.checkins.length)+' ('+t.checkins.length+' via QR check-in'+
      (t.checkins.length?', '+t.checkins.filter(c=>c.correct).length+' answered the check question correctly':'')+')',
    t.spot.desc?('Hazard spotted by '+(t.spot.by||'worker')+': '+t.spot.desc+(t.spot.action?' → '+t.spot.action:'')+' (tracked as observation)'):'',
    t.weather?t.weather.line:''
  ].filter(Boolean).join('\n');
  const rec={id:t.id, date:t.date, time:t.time, conductor:t.conductor,
    topics:brief, hazards:risks, ptw:t.ptw, photos:t.photos,
    attendees:t.attendees, others:t.checkins.filter(c=>!c.memberId).map(c=>c.name).join('\n'),
    remarks:auto,
    activities:t.acts, briefing:t.briefing, translations:t.translations, quiz:t.quiz,
    qrToken:t.qrToken, checkins:t.checkins, spot:t.spot, weather:t.weather?t.weather.line:null, draft:!final};
  const i=db.tbm.findIndex(x=>x.id===t.id);
  if(i>=0) db.tbm[i]=rec; else db.tbm.push(rec);
  save();
}

function rowsFromRoot(){
  const rows=[];
  COMPANY_STORES.forEach(st=>root.company[st].forEach(rec=>{ if(rec.id) rows.push({id:rec.id, project_id:'_company', store:st, data:rec}); }));
  rows.push({id:'_companymeta', project_id:'_company', store:'_meta', data:{name:root.company.name||''}});
  root.projects.forEach(p=>{
    PROJECT_STORES.forEach(st=>p[st].forEach(rec=>{ if(rec.id) rows.push({id:rec.id, project_id:p.id, store:st, data:rec}); }));
    rows.push({id:p.id, project_id:p.id, store:'_project', data:{settings:p.settings, manhours:p.manhours, mandays:p.mandays}});
  });

let pushTimer=null;
function schedulePush(){
  if(!SB.client||!SB.profile) return;
  clearTimeout(pushTimer);
  pushTimer=setTimeout(()=>pushNow().catch(e=>{
    console.warn('push',e);
    sbSetStatus('err','Could not sync latest change ('+esc(e.message||'network')+') — kept locally, will retry.');
  }), 1500);
}
async function pushNow(){
  if(!SB.client||!SB.profile||SB.busy) return;
  SB.busy=true;
  try{
    const pushed=JSON.parse(localStorage.getItem(SB.hashKey)||'{}');
    const rows=rowsFromRoot(), up=[], seen={};
    rows.forEach(r=>{
      const k=r.project_id+'|'+r.store+'|'+r.id, h=hashStr(JSON.stringify(r.data));
      seen[k]=h;
      if(pushed[k]!==h) up.push({id:r.id, project_id:r.project_id, store:r.store, data:r.data, deleted:false});
    });
    Object.keys(pushed).forEach(k=>{
      if(!(k in seen)){
        const i1=k.indexOf('|'), i2=k.indexOf('|',i1+1);
        up.push({id:k.slice(i2+1), project_id:k.slice(0,i1), store:k.slice(i1+1,i2), data:{}, deleted:true});
      }
    });
    for(let i=0;i<up.length;i+=100){
      const chunk=up.slice(i,i+100).map(r=>({...r, org_id:SB.profile.org_id, updated_by:SB.profile.id}));
      const {error}=await SB.client.from('records').upsert(chunk);
      if(error) throw error;
    }
    localStorage.setItem(SB.hashKey, JSON.stringify(seen));
    if(up.length) sbSetStatus('ok','Synced '+up.length+' change(s) · '+new Date().toLocaleTimeString());
  }finally{ SB.busy=false; }
}
function localHashOf(project_id, store, id){
  if(project_id==='_company'){
    if(store==='_meta') return hashStr(JSON.stringify({name:root.company.name||''}));
    const rec=(root.company[store]||[]).find(x=>x.id===id);
    return rec?hashStr(JSON.stringify(rec)):null;
  }
  const p=root.projects.find(x=>x.id===project_id);
  if(!p) return null;
  if(store==='_project') return hashStr(JSON.stringify({settings:p.settings, manhours:p.manhours, mandays:p.mandays}));
  const rec=(p[store]||[]).find(x=>x.id===id);
  return rec?hashStr(JSON.stringify(rec)):null;
}
function applyRemote(r, pushed){
  const k=r.project_id+'|'+r.store+'|'+r.id;
  const localH=localHashOf(r.project_id, r.store, r.id);
  if(pushed[k]!==undefined && localH!==null && localH!==pushed[k]) return false; /* local unpushed edit wins */
  const remoteH=hashStr(JSON.stringify(r.data||{}));
  if(r.project_id==='_company'){
    if(r.store==='_meta'){ if(!r.deleted){ root.company.name=(r.data&&r.data.name)||''; pushed[k]=remoteH; } return true; }
    if(!COMPANY_STORES.includes(r.store)) return false;
    const arr=root.company[r.store];
    const i=arr.findIndex(x=>x.id===r.id);
    if(r.deleted){ if(i>=0) arr.splice(i,1); delete pushed[k]; return i>=0; }
    if(i>=0) arr[i]=r.data; else arr.push(r.data);
    pushed[k]=remoteH; return true;
  }
  let p=root.projects.find(x=>x.id===r.project_id);
  if(r.store==='_project'){
    if(r.deleted){
      if(p && root.projects.length>1){ root.projects=root.projects.filter(x=>x.id!==p.id);
        if(root.cur===r.project_id) root.cur=root.projects[0].id; }
      delete pushed[k]; return !!p;
    }
    if(!p){ p=blankProject(''); p.id=r.project_id; root.projects.push(p); }
    if(r.data.settings) p.settings=r.data.settings;
    if(r.data.manhours) p.manhours=r.data.manhours;
    if(r.data.mandays) p.mandays=r.data.mandays;
    pushed[k]=remoteH; return true;
  }
  if(!PROJECT_STORES.includes(r.store)) return false;
  if(!p){ if(r.deleted) return false; p=blankProject(''); p.id=r.project_id; root.projects.push(p); }
  const arr=p[r.store];
  const i=arr.findIndex(x=>x.id===r.id);
  if(r.deleted){ if(i>=0) arr.splice(i,1); delete pushed[k]; return i>=0; }
  if(i>=0) arr[i]=r.data; else arr.push(r.data);
  pushed[k]=remoteH; return true;
}
async function pullNow(){
  if(!SB.client||!SB.profile) return;
  const last=localStorage.getItem(SB.syncKey)||'1970-01-01T00:00:00Z';
  let from=last, changed=false, guard=0;
  while(guard++<40){
    const {data,error}=await SB.client.from('records')
      .select('id,project_id,store,data,deleted,updated_at')
      .gt('updated_at',from).order('updated_at',{ascending:true}).limit(500);
    if(error) throw error;
    if(!data||!data.length) break;
    const pushed=JSON.parse(localStorage.getItem(SB.hashKey)||'{}');
    data.forEach(r=>{ try{ if(applyRemote(r,pushed)) changed=true; }catch(e){ console.warn('apply',r.store,r.id,e); } });
    localStorage.setItem(SB.hashKey, JSON.stringify(pushed));
    from=data[data.length-1].updated_at;
    if(data.length<500) break;
  }
  if(from!==last) localStorage.setItem(SB.syncKey, from);
  if(changed){
    if(!root.projects.some(p=>p.id===root.cur)) root.cur=root.projects[0].id;
    localStorage.setItem(KEY2, JSON.stringify(root));
    if(!curEdit) route(); /* don't clobber a form mid-edit */
  }
}
function pushResetLocal(){ localStorage.removeItem(SB.hashKey); localStorage.removeItem(SB.syncKey); }

  GATED=true; document.body.classList.add('gated');
  app.innerHTML='<div class="login"><div class="lg-card">'+
    '<div class="lg-brand"><span class="bmark">S</span><div><div class="lg-t">SKYTOPIA</div><div class="lg-s">Site Safety</div></div></div>'+
    '<p class="hint" style="margin:6px 0 14px">Sign in to your team workspace.</p>'+
    '<label style="margin-top:0">Email</label><input id="lgEmail" type="email" autocomplete="username" inputmode="email">'+
    '<label>Password</label><input id="lgPass" type="password" autocomplete="current-password">'+
    '<div class="lg-err" id="lgErr"></div>'+
    '<div class="btnrow"><button class="btn" id="lgGo" style="flex:1">Sign in</button></div>'+
    '<button class="minor" id="lgLocal" style="margin-top:14px">Work offline on this device only</button>'+
    '<p class="hint" style="margin-top:12px">Invited by email? Open the link in that email first — it lets you set your password.</p>'+
  '</div></div>';
  const err=m=>{ const e=document.getElementById('lgErr'); e.textContent=m; e.style.display='block'; };
  const go=async()=>{
    const email=document.getElementById('lgEmail').value.trim(), pw=document.getElementById('lgPass').value;
    if(!email||!pw){ err('Enter your email and password.'); return; }
    const btn=document.getElementById('lgGo'); btn.disabled=true; btn.textContent='Signing in…';
    try{
      await sbLoadLib();
      const cfg=sbCfg();
      if(!SB.client) SB.client=window.supabase.createClient(cfg.url,cfg.anon);
      const {error}=await SB.client.auth.signInWithPassword({email, password:pw});
      if(error) throw error;
      unGate(); route();
      await sbAfterLogin();
    }catch(e){
      err((e.message||'Sign-in failed')+ (String(e.message||'').includes('Invalid')?' — check the email/password, or use your invite email link if you have not set a password yet.':''));
      btn.disabled=false; btn.textContent='Sign in';
    }
  };
  document.getElementById('lgGo').onclick=go;
  document.getElementById('lgPass').addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
  document.getElementById('lgLocal').onclick=()=>{
    localStorage.setItem('kkl-local-ok','1'); unGate(); route(); syncInit();
  };
}
function unGate(){ GATED=false; document.body.classList.remove('gated'); }

initShell();
(async()=>{
  const authLink=/^#access_token=|^#error/.test(location.hash) || /^#\/checkin\//.test(location.hash);
  const cfg=sbCfg();
  if(cfg && cfg.url && !authLink && !localStorage.getItem('kkl-local-ok')){
    renderLanding();
    await syncInit();                       /* existing session on this device? */
    if(SB.profile){ unGate(); route(); }    /* yes — straight into the app */
  }else{
    route(); syncInit();
  }
})();
</script>
</body>
</html>
