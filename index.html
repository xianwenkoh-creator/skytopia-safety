/* ============ statistics ============ */
let statsYear=new Date().getFullYear();
const ACC_TYPES=['First Aid Case','Medical Treatment / MC','Lost Time Injury','Fatality'];

function inYear(r,yr){ return r.date && +r.date.slice(0,4)===yr; }
function byMonth(arr,yr){ const m=Array(12).fill(0);
  arr.forEach(r=>{ if(inYear(r,yr)){ const i=+r.date.slice(5,7)-1; if(i>=0&&i<12) m[i]++; } }); return m; }
function niceStep(max){ const raw=max/4||1; const p=Math.pow(10,Math.floor(Math.log10(raw)));
  for(const m of [1,2,5,10]){ if(raw<=m*p) return m*p; } return 10*p; }

function barChartSVG(labels, series){
  const W=720,H=230,padL=36,padR=8,padT=10,padB=24;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const max=Math.max(1,...series.flatMap(s=>s.values));
  const step=Math.max(1,niceStep(max)), top=Math.ceil(max/step)*step;
  let grid='';
  for(let v=0; v<=top; v+=step){
    const y=padT+plotH-(v/top)*plotH;
    grid+='<line x1="'+padL+'" y1="'+y+'" x2="'+(W-padR)+'" y2="'+y+'" stroke="'+(v===0?'var(--viz-axis)':'var(--viz-grid)')+'" stroke-width="1"/>'+
      '<text x="'+(padL-6)+'" y="'+(y+3.5)+'" text-anchor="end" font-size="10" fill="var(--viz-muted)">'+v+'</text>';
  }
  const n=labels.length, gw=plotW/n, ns=series.length;
  const bw=Math.min(20,(gw-8)/ns);
  let bars='', xlab='';
  labels.forEach((lb,i)=>{
    xlab+='<text x="'+(padL+i*gw+gw/2)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="var(--viz-muted)">'+lb+'</text>';
    series.forEach((s,si)=>{
      const v=s.values[i]; if(!v) return;
      const h=(v/top)*plotH;
      const x=padL+i*gw+(gw-ns*bw-(ns-1)*2)/2+si*(bw+2);
      const y=padT+plotH-h;
      bars+='<rect class="bar" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+
        '" rx="2" fill="'+s.color+'" data-tip="'+esc(lb+' — '+s.name+': '+v)+'"/>';
    });
  });
  return '<div class="chartwrap"><svg viewBox="0 0 '+W+' '+H+'" role="img" font-family="system-ui,sans-serif">'+grid+bars+xlab+'</svg></div>';
}

function bindTips(){
  const tip=document.getElementById('tip');
  const move=e=>{ const x=e.touches?e.touches[0].clientX:e.clientX, y=e.touches?e.touches[0].clientY:e.clientY;
    tip.style.left=Math.max(4,Math.min(x+12,innerWidth-tip.offsetWidth-8))+'px';
    tip.style.top=Math.max(4,y-34)+'px'; };
  app.querySelectorAll('.bar').forEach(b=>{
    const show=e=>{ tip.textContent=b.dataset.tip; tip.style.display='block'; move(e); };
    b.addEventListener('mouseenter',show);
    b.addEventListener('mousemove',move);
    b.addEventListener('mouseleave',()=>tip.style.display='none');
    b.addEventListener('click',e=>{ show(e); setTimeout(()=>tip.style.display='none',1800); });
  });
}

function dataTable(labels, series){

    labels.map((lb,i)=>'<tr><td>'+lb+'</td>'+series.map(s=>'<td>'+s.values[i]+'</td>').join('')+'</tr>').join('')+
    '</table></details>';
}

      tile(ltifr===null?'—':ltifr.toFixed(2),'LTIFR / mil hrs')+
      tile(daysLost,'Man-days lost')+
      tile(doN,'Dangerous occ.')+

    '</div>'+
    '<a class="btn ghost noprint" style="display:block;text-align:center;text-decoration:none;margin-bottom:12px" href="#/report">Monthly safety data report &rarr;</a>'+
    '<div class="card"><div class="charthead">Incidents by month — '+yr+'</div>'+

      (typeCounts.length?'<div style="margin-top:10px">'+typeCounts.map(x=>'<span class="chip n" style="margin:2px">'+esc(x[0])+': <b>'+x[1]+'</b></span>').join(' ')+'</div>':'')+

/* ============ monthly safety data report (HDB Appendix VI) ============ */
let repMonth=today().slice(0,7);

function rankedBars(rows){
  if(!rows.length) return '<div class="hint">No safety non-compliances recorded this month.</div>';
  const max=Math.max(...rows.map(r=>r.v));
  return rows.map(r=>'<div class="hbar"><div class="hlab"><span>'+esc(r.label)+'</span><b>'+r.txt+'</b></div>'+
    '<div class="htrack"><div class="hfill" style="width:'+((r.v/max)*100).toFixed(1)+'%"></div></div></div>').join('');
}

function repData(mk){
  const inMonth=r=>r.date&&r.date.slice(0,7)===mk;
  const inc=db.incidents.filter(inMonth);
  const negs=db.observations.filter(o=>o.kind!==OBS_POS&&inMonth(o));
  const byKey=(arr,fn)=>{ const m={}; arr.forEach(r=>{ const k=(fn(r)||'').trim()||'(unspecified)'; m[k]=(m[k]||0)+1; });
    return Object.entries(m).sort((a,b)=>b[1]-a[1]); };
  return {
    acc: inc.filter(r=>ACC_TYPES.includes(r.type)).length,
    doN: inc.filter(r=>r.type==='Dangerous Occurrence').length,
    fatal: inc.filter(r=>r.type==='Fatality').length,
    mh: +db.manhours[mk]||0,
    md: +db.mandays[mk]||0,
    negs, pos: db.observations.filter(o=>o.kind===OBS_POS&&inMonth(o)).length,
    trades: byKey(negs,o=>o.trade),
    subs: byKey(negs,o=>o.subcon)
  };
}

  L.push([]);
  L.push(['Breakdown by subcontractor','Count']);
  d.subs.forEach(t=>L.push([t[0], t[1]])); L.push([]);
  const trM={}; db.training.filter(t=>t.date&&t.date.slice(0,7)===mk).forEach(t=>{ const k=(t.course||'(untitled course)').trim(); trM[k]=(trM[k]||0)+1; });
  L.push(['Training conducted this month','Workers trained']);
  Object.entries(trM).sort((a,b)=>b[1]-a[1]).forEach(t=>L.push([t[0], t[1]]));
  L.push([]);
  L.push(['S/N','Block','Storey','Unit','Location','Initiator','Subcontractor','Trade','Category','Standard item','Description','Severity','Date found','Time found','Status','Rectified date','Verified date','Closed date','Duration (days)']);
  d.negs.forEach((o,i)=>{
    const dur=(o.closedDate&&o.date)?Math.max(0,Math.round((new Date(o.closedDate)-new Date(o.date))/864e5)):'';
    L.push([i+1,o.block,o.storey,o.unit,o.location,o.initiator,o.subcon,o.trade,o.category,o.subitem,o.desc,o.severity,o.date,o.time,o.status,o.rectifiedDate,o.verifiedDate,o.closedDate,dur]);
  });
  saveOrDownload('Monthly Reports', 'safety-report-'+mk+'.csv', L.map(r=>r.map(csvEsc).join(',')).join('\r\n'), 'text/csv;charset=utf-8');
}

/* ============ WORK ACTIVITY CORE: rules · events · context ============
   Work Activity is the hub entity linking crew, plant, RA/SWP revisions,
   PTWs, toolbox meetings, inspections, observations, actions and incidents.
   Readiness is DETERMINISTIC — hard compliance gates never come from AI.  */
function RR(ruleCode,status,title,reason,sourceEntity,sourceEntityId){
  return {ruleCode,status,title,reason,sourceEntity,sourceEntityId};
}
/* activities that must not start without a permit */
const PTW_REQUIRED=['Hot Works','Confined Space','Work at Height','Lifting Operations','Excavation & Trenching'];
/* statutory gates that management may NEVER override */
const NON_OVERRIDABLE=['MEM-WP-EXPIRED','EQP-AE-OVERDUE','EQP-CERT-EXPIRED','WA-RA-EXPIRED'];
/* activity/role → competency keywords that must appear in a live cert/course */
const REQ_CERT={
  'Lifting Operations':{role:{'Lifting Supervisor':['lifting supervisor'],'Rigger / Signalman':['rigger','signalman']}},
  'Work at Height':{all:['work at height','wah']},
  'Confined Space':{all:['confined space']},
  'Scaffolding':{role:{'Scaffolder':['scaffold']}}
};
function memberAllCerts(m){
  /* structured competencies are authoritative; legacy cert rows only count until
     the member has wrapped/added competency records; training linked by ID first */
  const comps=memberComps(m.id).map(c=>({name:c.typeName||c.typeCode||'', no:c.certNo, expiry:c.expiry||'', ver:c.verification||'UNVERIFIED'}));
  const legacy=comps.length?[]:(m.certs||[]).map(c=>({name:c.name,no:c.no,expiry:c.expiry,ver:'LEGACY'}));
  const train=db.training.filter(t=>t.memberId?t.memberId===m.id:(t.name||'').trim().toLowerCase()===(m.name||'').trim().toLowerCase())
    .map(t=>({name:t.course||'',expiry:t.expiry||'',ver:'VERIFIED'}));
  return legacy.concat(comps,train);
}
function certLive(c){ return !c.expiry || (daysTo(c.expiry)??0)>=0; }
function hasLiveCert(m,kws){ return memberAllCerts(m).some(c=>certLive(c)&&kws.some(k=>(c.name||'').toLowerCase().includes(k))); }

function checkMemberEligibility(memberId, workActivityId){
  const out=[];
  const m=db.members.find(x=>x.id===memberId);
  if(!m) return [RR('MEM-404','BLOCK','Member not found','Assigned member no longer exists in the register.','member',memberId)];
  const wa=workActivityId?db.workActivities.find(w=>w.id===workActivityId):null;
  if(m.status==='INACTIVE') out.push(RR('MEM-INACTIVE','BLOCK','Worker inactive',m.name+' is marked INACTIVE in the worker register.','member',m.id));
  const wp=m.wpExpiry?daysTo(m.wpExpiry):null;
  if(wp!==null&&wp<0) out.push(RR('MEM-WP-EXPIRED','BLOCK','Work pass expired',m.name+'’s work pass expired '+fmtD(m.wpExpiry)+'.','member',m.id));
  else if(wp!==null&&wp<=30) out.push(RR('MEM-WP-30D','WARN','Work pass expiring',m.name+'’s work pass expires in '+wp+' day(s).','member',m.id));
  const acc=memberAccess(m.id);
  if(acc&&acc.accessStatus==='BLOCKED') out.push(RR('MEM-ACCESS','BLOCK','Project access blocked',m.name+'’s access to this project is blocked.','member',m.id));
  if(acc&&acc.sicStatus==='COMPLETE'&&(!acc.sicExpiry||(daysTo(acc.sicExpiry)??0)>=0)){ /* project SIC in order */ }
  else if(acc&&acc.sicStatus==='COMPLETE') out.push(RR('MEM-SIC-EXPIRED','WARN','SIC expired',m.name+'’s site induction needs renewal.','member',m.id));
  else if(m.sicDate) out.push(RR('MEM-SIC-LEGACY','WARN','SIC not recorded for this project',m.name+' has only a legacy SIC date — record project SIC via SIC / Induction.','member',m.id));
  else out.push(RR('MEM-SIC-MISSING','WARN','No safety induction',m.name+' has no SIC recorded for this project.','member',m.id));
  const certs=memberAllCerts(m);
  certs.filter(c=>c.expiry&&(daysTo(c.expiry)??0)<0).forEach(c=>
    out.push(RR('MEM-CERT-EXPIRED','WARN','Cert expired',m.name+': '+c.name+' expired '+fmtD(c.expiry)+'.','member',m.id)));
  if(!hasLiveCert(m,['wsh in construction','csoc','safety orientation']))
    out.push(RR('MEM-CSOC','WARN','CSOC not on record','No live CSOC / WSH-in-construction course recorded for '+m.name+'.','member',m.id));
  if(wa){
    const req=REQ_CERT[wa.type];
    const crewRow=(wa.crew||[]).find(c=>c.memberId===memberId);
    const role=crewRow?crewRow.role:'';
    if(req){
      if(req.all){ const v=hasLiveCertV(m,req.all);
        if(!v.has) out.push(RR('MEM-COMP-REQ','BLOCK','Required competency missing',m.name+' has no live "'+req.all[0]+'" competency required for '+wa.type+'.','member',m.id));
        else if(!v.verified) out.push(RR('MEM-COMP-UNVER','WARN','Competency unverified',m.name+'’s '+req.all[0]+' certificate has not been verified.','member',m.id)); }
      if(req.role&&req.role[role]){ const v=hasLiveCertV(m,req.role[role]);
        if(!v.has) out.push(RR('MEM-COMP-REQ','BLOCK','Required competency missing',m.name+' is assigned as '+role+' but has no live '+role+' competency.','member',m.id));
        else if(!v.verified) out.push(RR('MEM-COMP-UNVER','WARN','Competency unverified',m.name+'’s '+role+' certificate has not been verified.','member',m.id)); }
    }
  }
  if(!out.length) out.push(RR('MEM-OK','PASS','Eligible',m.name+' is eligible.','member',m.id));
  return out;
}

function checkEquipmentReadiness(equipmentId, workActivityId){
  const out=[];
  const e=db.equipment.find(x=>x.id===equipmentId);
  if(!e) return [RR('EQP-404','BLOCK','Equipment not found','Assigned equipment no longer exists in the register.','equipment',equipmentId)];
  const label=[e.type,e.regNo].filter(Boolean).join(' ');
  const wa=workActivityId?db.workActivities.find(w=>w.id===workActivityId):null;
  if(e.status==='Under repair') out.push(RR('EQP-REPAIR','BLOCK','Under repair',label+' is marked Under repair.','equipment',e.id));
  if(e.status==='Off-site') out.push(RR('EQP-OFFSITE','WARN','Off-site',label+' is marked Off-site.','equipment',e.id));
  (e.certs||[]).forEach(c=>{ const d=c.expiry?daysTo(c.expiry):null;
    if(d!==null&&d<0) out.push(RR('EQP-CERT-EXPIRED','BLOCK','Statutory cert expired',label+': '+(c.name||'LM/LG cert')+' expired '+fmtD(c.expiry)+'.','equipment',e.id));
    else if(d!==null&&d<=30) out.push(RR('EQP-CERT-30D','WARN','Statutory cert expiring',label+': '+(c.name||'cert')+' expires in '+d+' day(s).','equipment',e.id)); });
  const ae=e.aeDue?daysTo(e.aeDue):null;
  if(ae!==null&&ae<0) out.push(RR('EQP-AE-OVERDUE','BLOCK','AE inspection overdue',label+': Authorised Examiner test was due '+fmtD(e.aeDue)+'.','equipment',e.id));
  else if(ae!==null&&ae<=30) out.push(RR('EQP-AE-30D','WARN','AE inspection due',label+': AE test due in '+ae+' day(s).','equipment',e.id));
  const sv=e.serviceDue?daysTo(e.serviceDue):null;
  if(sv!==null&&sv<0) out.push(RR('EQP-SERVICE-DUE','WARN','Servicing overdue',label+': servicing was due '+fmtD(e.serviceDue)+'.','equipment',e.id));
  const ml=e.hdbML?daysTo(e.hdbML):null;
  if(ml!==null&&ml<0) out.push(RR('EQP-HDBML','WARN','Material list registration expired',label+': material list registration expired '+fmtD(e.hdbML)+'.','equipment',e.id));
  if(wa&&wa.status==='Active'&&e.regNo){
    const pre=db.checklists.some(c=>c.date===today()&&(c.equipmentId===e.id||((c.area||'')+' '+(c.template||'')).toLowerCase().includes(String(e.regNo).toLowerCase())));
    if(!pre) out.push(RR('EQP-PRESTART','WARN','No pre-start check today','No checklist today references '+label+' while the activity is Active.','equipment',e.id));
  }
  if(e.operatorMemberId){
    const op=db.members.find(x=>x.id===e.operatorMemberId);
    if(!op) out.push(RR('EQP-OP-GONE','WARN','Operator not found','Assigned operator no longer exists in the worker register.','equipment',e.id));
    else{
      if(op.status==='INACTIVE') out.push(RR('EQP-OP-INACTIVE','BLOCK','Operator inactive',op.name+' is marked INACTIVE.','equipment',e.id));
      const opk=[['excavator',['excavator']],['crane',['crane operator','mobile crane','crawler crane','lorry crane']],
                 ['forklift',['forklift']],['mewp',['mewp','boom lift']],['piling',['piling']]]
        .find(x=>String(e.type||'').toLowerCase().includes(x[0]));
      if(opk){ const v=hasLiveCertV(op,opk[1]);
        if(!v.has) out.push(RR('EQP-OP-COMP','WARN','Operator competency missing','No live '+opk[0]+' operator competency on record for '+op.name+'.','equipment',e.id));
        else if(!v.verified) out.push(RR('EQP-OP-UNVER','WARN','Operator competency unverified',op.name+'’s '+opk[0]+' operator certificate is unverified.','equipment',e.id)); }
    }
  }
  if(!out.length) out.push(RR('EQP-OK','PASS','Ready',label+' is ready.','equipment',e.id));
  return out;
}

function checkWorkActivityReadiness(workActivityId){
  const wa=db.workActivities.find(w=>w.id===workActivityId);
  if(!wa) return {status:'BLOCKED',results:[RR('WA-404','BLOCK','Not found','Work activity does not exist.','workActivity',workActivityId)]};
  const res=[];
  const active=wa.status==='Active';
  /* crew */
  const crew=(wa.crew||[]).filter(c=>c.memberId);
  if(!crew.length) res.push(RR('WA-NO-CREW','WARN','No crew assigned','No members are assigned to this activity.','workActivity',wa.id));
  const supRoles=['Supervisor / Foreman','Lifting Supervisor'];
  if(crew.length&&!crew.some(c=>supRoles.includes(c.role)))
    res.push(RR('WA-NO-SUP','WARN','No supervisor in crew','No crew member holds a supervisory role.','workActivity',wa.id));
  if(wa.type==='Lifting Operations'&&!crew.some(c=>c.role==='Lifting Supervisor'))
    res.push(RR('WA-NO-LS','BLOCK','No Lifting Supervisor','Lifting work requires an appointed Lifting Supervisor in the crew.','workActivity',wa.id));
  crew.forEach(c=>checkMemberEligibility(c.memberId,wa.id).forEach(r=>{ if(r.status!=='PASS') res.push(r); }));
  /* plant */
  (wa.plant||[]).filter(p=>p.equipmentId).forEach(p=>
    checkEquipmentReadiness(p.equipmentId,wa.id).forEach(r=>{ if(r.status!=='PASS') res.push(r); }));
  /* RA / SWP */
  const raRefs=(wa.raRefs||[]).filter(r=>r.raId);
  if(!raRefs.length)
    res.push(RR('WA-RA-NONE',PTW_REQUIRED.includes(wa.type)?'BLOCK':'WARN','No RA/SWP linked','No risk assessment is linked to this activity.','workActivity',wa.id));
  raRefs.forEach(ref=>{
    if(String(ref.raId||'').startsWith('adopt:')){
      const ad=db.raAdoptions.find(z=>z.id===String(ref.raId).slice(6));
      if(!ad){ res.push(RR('WA-RA-GONE','WARN','Linked RA missing','A linked versioned RA/SWP no longer exists.','raAdoption',String(ref.raId).slice(6))); return; }
      const cur=db.raProjectVersions.find(v=>v.id===ad.currentVerId);
      if(!cur){ res.push(RR('WA-RA-UNAPPROVED',PTW_REQUIRED.includes(wa.type)?'BLOCK':'WARN','RA not approved yet',ad.title+' has no approved revision.','raAdoption',ad.id)); return; }
      if(ref.verId&&ref.verId!==ad.currentVerId)
        res.push(RR('WA-RA-REV','WARN','RA revision changed','Activity pinned '+(ref.rev||'?')+' but current approved is '+ad.currentRev+' — re-brief and re-link.','raAdoption',ad.id));
      return;
    }
    const ra=db.ra.find(r=>r.id===ref.raId);
    if(!ra){ res.push(RR('WA-RA-GONE','WARN','Linked RA missing','A linked RA/SWP was deleted from the register.','ra',ref.raId)); return; }
    if(ra.status==='Expired') res.push(RR('WA-RA-EXPIRED','BLOCK','RA expired',ra.activity+' is marked Expired.','ra',ra.id));
    const rv=ra.reviewDate?daysTo(ra.reviewDate):null;
    if(rv!==null&&rv<0) res.push(RR('WA-RA-REVIEW','WARN','RA review overdue',ra.activity+' review was due '+fmtD(ra.reviewDate)+'.','ra',ra.id));
    if(ref.rev&&String(ra.rev||'')!==String(ref.rev))
      res.push(RR('WA-RA-REV','WARN','RA revision changed','Activity pinned Rev '+ref.rev+' but '+ra.activity+' is now Rev '+(ra.rev||'?')+' — re-brief and re-link.','ra',ra.id));
  });
  /* PTW */
  if(PTW_REQUIRED.includes(wa.type)&&!(wa.ptw||'').trim())
    res.push(RR('WA-PTW-MISSING',active?'BLOCK':'WARN','No permit recorded',wa.type+' requires an ePTW permit. No permit number is recorded.','workActivity',wa.id));
  /* toolbox today */
  if(active&&!db.tbm.some(t=>t.waId===wa.id&&t.date===today()))
    res.push(RR('WA-TBM-TODAY','WARN','No toolbox briefing today','Activity is Active but no toolbox meeting is linked for today.','workActivity',wa.id));
  /* linked observations / incidents */
  db.observations.filter(o=>o.waId===wa.id&&o.status!=='Closed').forEach(o=>{
    if(o.severity==='Critical') res.push(RR('WA-OBS-CRITICAL','BLOCK','Open critical near miss / unsafe condition',(o.category||'Report')+' is open: '+(o.desc||o.subitem||'').split('\n')[0].slice(0,80),'observation',o.id));
    else if(o.severity==='Major') res.push(RR('WA-OBS-MAJOR','WARN','Open major near miss / unsafe condition',(o.category||'Report')+' is open.','observation',o.id));
    if(o.due&&(daysTo(o.due)??0)<0) res.push(RR('WA-OBS-OVERDUE','WARN','Near miss report overdue','Corrective action was due '+fmtD(o.due)+'.','observation',o.id));
  });
  db.incidents.filter(i=>i.waId===wa.id&&i.status!=='Closed').forEach(i=>
    res.push(RR('WA-INC-OPEN','BLOCK','Open incident',(i.type||'Incident')+' on '+fmtD(i.date)+' is not closed.','incident',i.id)));
  /* lifting plan utilisation (deterministic, from the WA's own numbers) */
  if(wa.type==='Lifting Operations'){
    const load=parseFloat(wa.liftLoad), cap=parseFloat(wa.liftCapacity);
    if(load&&cap){
      const u=load/cap;
      if(u>1) res.push(RR('WA-LIFT-OVER','BLOCK','Lift exceeds capacity','Load '+load+'t is over the crane capacity '+cap+'t at '+(wa.liftRadius||'?')+'m radius.','workActivity',wa.id));
      else if(u>0.85) res.push(RR('WA-LIFT-UTIL','WARN','High lift utilisation',Math.round(u*100)+'% of crane capacity \u2014 verify the load chart and rigging.','workActivity',wa.id));
    }else if(active){
      res.push(RR('WA-LIFT-PLAN','WARN','No lift plan figures','Record load, capacity and radius for this lifting operation.','workActivity',wa.id));
    }
  }
  /* LMRA at the workface */
  if(active){
    const todayLm=db.lmra.filter(l=>l.waId===wa.id&&l.date===today());
    if(!todayLm.length)
      res.push(RR('WA-LMRA-TODAY','WARN','No LMRA today','No last-minute risk assessment recorded for this activity today.','workActivity',wa.id));
    if(todayLm.some(l=>l.safe==='STOP'&&l.resolved!=='Resolved'))
      res.push(RR('WA-LMRA-STOP','BLOCK','STOP WORK raised at LMRA','A worker stopped work at the last-minute check \u2014 resolve and close it out before restarting.','workActivity',wa.id));
  }
  /* authorised overrides: downgrade a BLOCK to WARN, audited, time-limited.
     Statutory rules can never be overridden. */
  (wa.overrides||[]).forEach(o=>{
    if(o.expiry&&(daysTo(o.expiry)??0)<0) return;
    res.forEach(r=>{
      if(r.status==='BLOCK'&&r.ruleCode===o.ruleCode&&!NON_OVERRIDABLE.includes(r.ruleCode)){
        r.status='WARN'; r.title+=' — OVERRIDDEN'; r.overridden=true;
        r.reason+=' · Override by '+o.by+(o.expiry?' until '+fmtD(o.expiry):'')+': '+o.reason;
      }
    });
  });
  const status=res.some(r=>r.status==='BLOCK')?'BLOCKED':res.some(r=>r.status==='WARN')?'READY_WITH_WARNINGS':'READY';
  if(!res.length) res.push(RR('WA-OK','PASS','Ready','All deterministic checks passed.','workActivity',wa.id));
  return {status,results:res};
}

function recalcWA(wa){
  const r=checkWorkActivityReadiness(wa.id);
  wa.readiness={status:r.status, computedAt:new Date().toISOString(), results:r.results};
  return wa.readiness;
}

/* one structured response with ALL linked context (for humans and future AI) */
function getWorkActivityContext(workActivityId){
  const wa=db.workActivities.find(w=>w.id===workActivityId);
  if(!wa) return null;
  const s=curProj().settings;
  const acts=allOpenActions();
  return {
    activity:{id:wa.id,title:wa.title,type:wa.type,status:wa.status,startDate:wa.startDate,endDate:wa.endDate,remarks:wa.remarks||''},
    project:{id:curProj().id,name:s.project,contractor:s.company,hdbContract:s.hdbContract},
    location:{block:wa.block||'',storey:wa.storey||'',area:wa.location||''},
    subcontractor:wa.subcon||'',
    ptwRefs:(wa.ptw||'').split(/[,;\s]+/).filter(Boolean),
    crew:(wa.crew||[]).filter(c=>c.memberId).map(c=>{
      const m=db.members.find(x=>x.id===c.memberId)||{};
      return {memberId:c.memberId,name:m.name||'(deleted)',wid:m.wid||'',company:m.company||'',roleInActivity:c.role||'',trade:m.trade||'',
        eligibility:checkMemberEligibility(c.memberId,wa.id)};
    }),
    plant:(wa.plant||[]).filter(p=>p.equipmentId).map(p=>{
      const e=db.equipment.find(x=>x.id===p.equipmentId)||{};
      return {equipmentId:p.equipmentId,label:[e.type,e.regNo].filter(Boolean).join(' ')||'(deleted)',role:p.role||'',
        readiness:checkEquipmentReadiness(p.equipmentId,wa.id)};
    }),
    raSwp:(wa.raRefs||[]).filter(r=>r.raId).map(ref=>{
      const ra=db.ra.find(x=>x.id===ref.raId)||{};
      return {raId:ref.raId,activity:ra.activity||'(deleted)',pinnedRev:ref.rev||'',currentRev:ra.rev||'',status:ra.status||'',reviewDate:ra.reviewDate||''};
    }),
    toolboxMeetings:db.tbm.filter(t=>t.waId===wa.id).map(t=>({id:t.id,date:t.date,conductor:t.conductor,
      attendance:(t.attendees||[]).length+((t.checkins||[]).length),quizCorrect:(t.checkins||[]).filter(c=>c.correct).length})),
    inspections:db.inspections.filter(i=>i.waId===wa.id).map(i=>({id:i.id,date:i.date,type:i.type,
      openFindings:(i.findings||[]).filter(f=>f.status!=='Closed').length})),
    observations:db.observations.filter(o=>o.waId===wa.id).map(o=>({id:o.id,date:o.date,category:o.category,
      severity:o.severity||'',status:o.status,due:o.due||''})),
    correctiveActions:acts.filter(a=>{
      const id=(a.link||'').split('/').pop();
      return db.observations.some(o=>o.id===id&&o.waId===wa.id)||db.inspections.some(i=>i.id===id&&i.waId===wa.id)||db.incidents.some(x=>x.id===id&&x.waId===wa.id);
    }),
    incidents:db.incidents.filter(i=>i.waId===wa.id).map(i=>({id:i.id,date:i.date,type:i.type,status:i.status,hasSnapshot:!!i.contextSnapshot})),
    readiness:wa.readiness||recalcWA(wa)
  };
}

/* immutable incident context snapshot — captured once at creation, never rebuilt */
function buildIncidentSnapshot(incident){
  const strip=o=>JSON.parse(JSON.stringify(o,(k,v)=>
    (k==='beforePhotos'||k==='afterPhotos'||k==='photos'||k==='translations'||k==='eligibility'||k==='readinessDetail')?undefined:v));
  const base={capturedAt:new Date().toISOString(), schema:1,
    project:{id:curProj().id,name:curProj().settings.project||''},
    siteState:{openActions:openActionCounts(), openObservations:db.observations.filter(o=>o.status!=='Closed').length,
      activeActivities:db.workActivities.filter(w=>w.status==='Active').map(w=>({id:w.id,title:w.title,readiness:(w.readiness||{}).status}))}};
  if(incident.waId){
    const ctx=getWorkActivityContext(incident.waId);
    if(ctx) base.workActivity=strip(ctx);
  }
  return base;
}

/* ---- event/service layer: source changes recalculate affected activities ---- */
const EV={subs:{},
  on(type,fn){ (this.subs[type]=this.subs[type]||[]).push(fn); },
  emit(type,payload){ (this.subs[type]||[]).forEach(fn=>{ try{ fn(payload||{}); }catch(e){ console.warn('EV',type,e); } }); }};
function affectedWAs(store,id){
  const W=db.workActivities;
  switch(store){
    case 'members': return W.filter(w=>(w.crew||[]).some(c=>c.memberId===id));
    case 'training': { const t=db.training.find(x=>x.id===id);
      const m=t?(t.memberId?db.members.find(x=>x.id===t.memberId)
                          :db.members.find(x=>(x.name||'').trim().toLowerCase()===(t.name||'').trim().toLowerCase())):null;
      return m?W.filter(w=>(w.crew||[]).some(c=>c.memberId===m.id)):[]; }
    case 'lmra': { const l=db.lmra.find(x=>x.id===id);
      return l&&l.waId?W.filter(w=>w.id===l.waId):[]; }
    case 'workerCompetencies': case 'workerProjectAccess': {
      const r=(db[store]||[]).find(x=>x.id===id);
      return r?W.filter(w=>(w.crew||[]).some(c=>c.memberId===r.memberId)):[]; }
    case 'equipment': return W.filter(w=>(w.plant||[]).some(p=>p.equipmentId===id));
    case 'checklists': return W.filter(w=>w.status==='Active'&&(w.plant||[]).length);
    case 'ra': return W.filter(w=>(w.raRefs||[]).some(r=>r.raId===id));
    case 'tbm': case 'inspections': case 'observations': case 'incidents': {
      const rec=(db[store]||[]).find(x=>x.id===id);
      return rec&&rec.waId?W.filter(w=>w.id===rec.waId):[]; }
    default: return [];
  }
}

/* ---- new-build detection ----
   The app is one cached HTML file, so an open tab can run a stale build for
   days. Poll the first 2KB of our own URL, compare the baked build stamp, and
   offer a one-tap cache-busted reload when the server has a newer version. */
let UPD_SHOWN=false;
async function updCheck(){
  if(UPD_SHOWN||location.protocol==='file:') return;
  try{
    const r=await fetch(location.pathname,{headers:{'Range':'bytes=0-2047'},cache:'no-store'});
    const t=await r.text();
    const srv=(/name="build" content="([^"]+)"/.exec(t)||[])[1];
    const mine=(document.querySelector('meta[name="build"]')||{}).content||'';
    if(srv&&mine&&srv!==mine){
      UPD_SHOWN=true;
      const b=document.createElement('button');
      b.id='updBar'; b.type='button';
      b.textContent='App updated — tap to load the new version';
      b.onclick=()=>{ location.href=location.pathname+'?u='+Date.now()+location.hash; };
      document.body.appendChild(b);
    }
  }catch(e){ /* offline or range unsupported — try again next poll */ }
}
setTimeout(updCheck, 8000);
setInterval(updCheck, 10*60e3);

/* ---- OneDrive filing: daily auto-backup + worker document mirror ----
   Both are best-effort and silent when the Safety folder is not connected or
   permission is not yet granted this session (no prompts without a gesture). */
/* expiry alerting: toast when NEW items hit critical (expired / ≤7d) since the
   last look on this device; weekly digest files to OneDrive with the backup */
function expiryNotify(){
  try{
    const crit=certRows(isHQ()?'company':'site').filter(r=>r.days<=7);
    if(!crit.length) return;
    const h=hashStr(crit.map(r=>r.link+'|'+r.expiry).sort().join(';'));
    if(localStorage.getItem('kkl-exp-seen')===h) return;
    localStorage.setItem('kkl-exp-seen',h);
    const ex=crit.filter(r=>r.days<0).length, so=crit.length-ex;
    toast((ex?ex+' cert(s) EXPIRED':'')+(ex&&so?' · ':'')+(so?so+' expiring ≤7 days':'')+' — see Cert Expiry', ex>0);
  }catch(e){}
}
let ABK_BUSY=false;
async function autoBackup(force){
  if(ABK_BUSY||!fsSupported()) return;
  const last=+localStorage.getItem('kkl-auto-backup')||0;
  if(!force && Date.now()-last < 20*3600e3) return;          /* ~once a day */
  const dirRoot=await getSafetyDir(false); if(!dirRoot) return;
  ABK_BUSY=true;
  try{
    const dir=await dirRoot.getDirectoryHandle('Backups',{create:true});
    const fh=await dir.getFileHandle('auto-backup-'+today()+'.json',{create:true});
    const w=await fh.createWritable();
    await w.write(new Blob([JSON.stringify(root)],{type:'application/json'}));
    await w.close();
    localStorage.setItem('kkl-auto-backup', String(Date.now()));
    toast('Daily backup filed: Backups \\ auto-backup-'+today()+'.json');
    /* weekly expiry digest for HQ filing */
    const lastDg=+localStorage.getItem('kkl-exp-digest')||0;
    if(Date.now()-lastDg>6.5*86400e3){
      const rows=certRows('company').filter(r=>r.days<=30);
      if(rows.length){
        const body='<h2>Certificate & Pass Expiry Alerts — '+esc(today())+'</h2>'+
          '<table border="1" cellspacing="0" cellpadding="6" style="border-collapse:collapse;width:100%;font-size:13px">'+
          '<tr style="background:#eee"><th>Days</th><th style="text-align:left">Who / what</th><th style="text-align:left">Item</th><th>Expiry</th></tr>'+
          rows.map(r=>'<tr'+(r.days<0?' style="color:#c5221f"':'')+'><td style="text-align:center">'+r.days+'</td><td>'+esc(r.owner)+'</td><td>'+esc(r.cat+' · '+r.name)+'</td><td>'+esc(fmtD(r.expiry))+'</td></tr>').join('')+'</table>';
        const ed=await dirRoot.getDirectoryHandle('Expiry Alerts',{create:true});
        const ef=await ed.getFileHandle('expiry-alerts-'+today()+'.html',{create:true});
        const ew=await ef.createWritable();
        await ew.write(new Blob([reportDocHtml('Expiry Alerts', body)],{type:'text/html'})); await ew.close();
        localStorage.setItem('kkl-exp-digest', String(Date.now()));
      }
    }
  }catch(e){ console.warn('auto-backup failed',e); }
  finally{ ABK_BUSY=false; }
}
function dataUrlBlob(d){
  const m=/^data:([^;]+);base64,(.*)$/.exec(String(d||'')); if(!m) return null;
  try{ const bin=atob(m[2]); const u=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
    return new Blob([u],{type:m[1]}); }catch(e){ return null; }
}
function wdFolderName(m){ return ((m.wid?m.wid+' ':'')+(m.name||m.id)).trim().replace(/[\\/:*?"<>|]+/g,'-').slice(0,60); }
async function mirrorWorkerDocs(store, rec, dirRootIn){
  if(!fsSupported()||!rec) return 0;
  const dirRoot=dirRootIn||await getSafetyDir(false); if(!dirRoot) return 0;
  let m=null, files=[];
  if(store==='members'){ m=rec; files=(rec.photos||[]).map((p,i)=>['worker-photo'+(i?'-'+(i+1):'')+'.jpg',p]); }
  else if(store==='workerCompetencies'){ m=db.members.find(x=>x.id===rec.memberId);
    const base=(rec.typeCode||'CERT')+(rec.certNo?'-'+String(rec.certNo).replace(/[^A-Za-z0-9-]+/g,''):'');
    files=(rec.photos||[]).map((p,i)=>[base+(i?'-'+(i+1):'')+'.jpg',p]); }
  else if(store==='memberPrivate'){ m=db.members.find(x=>x.id===rec.memberId)||{id:rec.id,name:rec.memberName};
    files=(rec.photos||[]).map((p,i)=>['hr-doc-'+(i+1)+'.jpg',p]); }
  if(!m||!files.length) return 0;
  try{
    const wd=await dirRoot.getDirectoryHandle('Worker Documents',{create:true});
    const dir=await wd.getDirectoryHandle(wdFolderName(m),{create:true});
    let n=0;
    for(const f of files){
      const b=dataUrlBlob(f[1]); if(!b) continue;
      const fh=await dir.getFileHandle(f[0],{create:true});
      const w=await fh.createWritable(); await w.write(b); await w.close(); n++;
    }
    return n;
  }catch(e){ console.warn('worker doc mirror failed',e); return 0; }
}
EV.on('record:changed',({store,id})=>{
  if(!['members','workerCompetencies','memberPrivate'].includes(store)) return;
  const rec=(db[store]||[]).find(x=>x.id===id);
  if(rec&&(rec.photos||[]).length)
    mirrorWorkerDocs(store,rec).then(n=>{ if(n) toast('Filed to OneDrive \\ Worker Documents'); });
});
async function exportAllWorkerDocs(){
  const dirRoot=await getSafetyDir(true);
  if(!dirRoot){ alert('Connect your Skytopia \\ Safety folder first.'); return; }
  let n=0;
  for(const m of db.members) n+=await mirrorWorkerDocs('members',m,dirRoot);
  for(const c of db.workerCompetencies) n+=await mirrorWorkerDocs('workerCompetencies',c,dirRoot);
  for(const p of db.memberPrivate) n+=await mirrorWorkerDocs('memberPrivate',p,dirRoot);
  alert(n?n+' document file(s) filed into Worker Documents \\ <worker> folders.'
        :'No photos or documents on worker records yet — nothing to export.');
}

      ids.forEach(id=>{

        const cp=structuredClone(orig);
        cp.id=uid(); cp.rev='A'; cp.status='Under review';
        cp.approved=''; cp.approvedDate=''; cp.reviewDate='';
        cp.remarks=((cp.remarks?cp.remarks+'\n':'')+
          'Imported from '+srcName+' (was Rev '+(orig.rev||'—')+') on '+fmtD(today())+' — review & endorse for this site.');
        db.ra.push(cp); n++;
        EV.emit('record:changed',{store:'ra',id:cp.id});
      });
      save();
      toast(n+' RA(s) imported as drafts — review & endorse for this site');
      location.hash='#/ra';
    };
  };
  draw();
}

/* ============ RA/SWP KNOWLEDGE SYSTEM ============
   Master library -> immutable versions -> project adoption -> project
   versions -> operations. Approved versions are LOCKED; revising clones a
   new DRAFT. All rules deterministic; Claude-assisted migration happens
   outside the app and lands here with provenance. */

/* ---- helpers ---- */
function raNow(){ return new Date().toISOString(); }
function raWho(){ return SB.profile?(SB.profile.email||SB.profile.id):'local-device'; }
function revNext(rev){ const m=/^([MP])(\d+)$/.exec(rev||''); return m?m[1]+String(+m[2]+1).padStart(2,'0'):(rev||'')+'+1'; }
function riskBand(n){ return n>=15?['b','High']:n>=6?['w','Med']:['g','Low']; }
function audit(action,entity,entityId,prev,next,reason){
  db.auditEvents.push({id:uid(), at:raNow(), who:raWho(), action, entity, entityId,
    prev:prev===undefined?null:prev, next:next===undefined?null:next, reason:reason||''});
}
function itemPrefix(title){ return (title||'RA').replace(/[^A-Za-z]/g,'').slice(0,3).toUpperCase()||'RA'; }
function raApprovedStatuses(){ return ['APPROVED','LEGACY-APPROVED']; }
function verLocked(v){ return raApprovedStatuses().concat(['SUPERSEDED']).includes(v.status); }
function verStore(v){ return v.rev&&v.rev[0]==='M'?'raMasterVersions':'raProjectVersions'; }
function findVer(id){ return db.raMasterVersions.find(v=>v.id===id)||db.raProjectVersions.find(v=>v.id===id); }
function statusChip(st){
  const c=st==='DRAFT'?'n':st==='SUBMITTED'?'w':st==='SUPERSEDED'?'n':'g';
  return '<span class="chip '+c+'">'+esc(st)+'</span>';
}

/* ---- versioning engine (deterministic; no AI in any rule) ---- */
function raNewItem(head){
  head.itemSeq=(head.itemSeq||0)+1;
  return {itemId:itemPrefix(head.title)+'-'+String(head.itemSeq).padStart(3,'0'),
    activity:'',hazard:'',consequence:'',s0:'3',l0:'3',controls:[],addControls:[],s1:'3',l1:'1',resp:'',origin:null,changeLog:[]};
}
function raCreateMaster(title){
  const head={id:uid(), title:title||'New master RA', tags:[], itemSeq:0, currentRev:null, currentVerId:null, status:'ACTIVE'};
  const ver={id:uid(), masterId:head.id, rev:'M01', status:'DRAFT', items:[], swpSteps:[], links:[],
    createdAt:raNow(), createdBy:raWho(), approvedBy:'', approvedAt:'', note:''};
  db.raMasters.push(head); db.raMasterVersions.push(ver);
  audit('created','raMaster',head.id,null,{title:head.title});
  save(); return {head,ver};
}
function raCreateDraftFrom(ver){
  if(!verLocked(ver)&&ver.status!=='SUBMITTED') return ver; /* already editable */
  const isM=verStore(ver)==='raMasterVersions';
  const head=isM?db.raMasters.find(m=>m.id===ver.masterId):db.raAdoptions.find(a=>a.id===ver.adoptionId);
  const open=(isM?db.raMasterVersions:db.raProjectVersions).find(v=>
    (isM?v.masterId===ver.masterId:v.adoptionId===ver.adoptionId)&&(v.status==='DRAFT'||v.status==='SUBMITTED'));
  if(open){ toast('A '+open.status.toLowerCase()+' revision ('+open.rev+') already exists — continue there.'); return open; }
  const cp=structuredClone(ver);
  cp.id=uid(); cp.rev=revNext(ver.rev); cp.status='DRAFT';
  cp.createdAt=raNow(); cp.createdBy=raWho(); cp.approvedBy=''; cp.approvedAt='';
  cp.comments=[]; cp.note='Revision of '+ver.rev;
  (isM?db.raMasterVersions:db.raProjectVersions).push(cp);
  audit('revision-created', isM?'raMasterVersion':'raProjectVersion', cp.id, {from:ver.rev}, {rev:cp.rev});
  save(); return cp;
}
function raApprove(ver){
  if(!canRA()){ alert('Only company safety personnel can approve.'); return false; }
  if(verLocked(ver)){ alert('This revision is locked.'); return false; }
  const isM=verStore(ver)==='raMasterVersions';
  const list=isM?db.raMasterVersions:db.raProjectVersions;
  const headList=isM?db.raMasters:db.raAdoptions;
  const head=headList.find(h=>isM?h.id===ver.masterId:h.id===ver.adoptionId);
  list.forEach(v=>{
    const same=isM?v.masterId===ver.masterId:v.adoptionId===ver.adoptionId;
    if(same&&v.id!==ver.id&&raApprovedStatuses().includes(v.status)){
      const prev=v.status; v.status='SUPERSEDED';
      audit('superseded', isM?'raMasterVersion':'raProjectVersion', v.id, {status:prev}, {status:'SUPERSEDED'});
    }
  });
  ver.status='APPROVED'; ver.approvedBy=raWho(); ver.approvedAt=raNow();
  if(head){ head.currentRev=ver.rev; head.currentVerId=ver.id; }
  audit('approved', isM?'raMasterVersion':'raProjectVersion', ver.id, null, {rev:ver.rev, by:ver.approvedBy});
  if(isM){ /* master approval -> deterministic impact: flag every adoption on an older base */
    root.projects.forEach(p=>(p.raAdoptions||[]).forEach(a=>{
      if(a.masterId===ver.masterId&&a.baseMasterVerId!==ver.id){
        if(!(p.reviewTriggers||[]).some(t=>t.sourceId===ver.id&&t.adoptionId===a.id&&t.status==='OPEN')){
          (p.reviewTriggers=p.reviewTriggers||[]).push({id:uid(), at:raNow(), source:'Master Library Update',
            sourceId:ver.id, adoptionId:a.id, masterId:ver.masterId,
            reason:'Master "'+(head?head.title:'')+'" revised to '+ver.rev+'; this project is based on '+(a.baseMasterRev||'?')+'.',
            reviewer:'', status:'OPEN', outcome:''});
        }
      }
    }));
  }
  save(); EV.emit('record:changed',{store:isM?'raMasterVersions':'raProjectVersions', id:ver.id});
  return true;
}
function raSubmit(ver){
  if(verLocked(ver)) return;
  ver.status='SUBMITTED'; ver.submittedAt=raNow(); ver.submittedBy=raWho();
  audit('submitted', verStore(ver)==='raMasterVersions'?'raMasterVersion':'raProjectVersion', ver.id, null, {rev:ver.rev});
  save();
}
function raAdoptMaster(master){
  const mv=db.raMasterVersions.find(v=>v.id===master.currentVerId);
  if(!mv||!raApprovedStatuses().includes(mv.status)){ alert('This master has no approved revision to adopt yet.'); return null; }
  const head={id:uid(), masterId:master.id, title:master.title, subcon:'', baseMasterVerId:mv.id,
    baseMasterRev:mv.rev, currentRev:null, currentVerId:null, status:'ACTIVE', itemSeq:master.itemSeq||0};
  const ver={id:uid(), adoptionId:head.id, rev:'P01', status:'DRAFT', subcon:head.subcon||'',
    basedOnMasterVerId:mv.id, basedOnMasterRev:mv.rev,
    items:structuredClone(mv.items||[]), swpSteps:structuredClone(mv.swpSteps||[]), links:structuredClone(mv.links||[]),
    overrides:{added:[],excluded:[],modified:[]}, comments:[],
    createdAt:raNow(), createdBy:raWho(), approvedBy:'', approvedAt:'',
    note:'Adopted from master '+master.title+' '+mv.rev};
  db.raAdoptions.push(head); db.raProjectVersions.push(ver);
  audit('project-adopted','raAdoption',head.id,null,{master:master.title, baseRev:mv.rev});
  save(); return head;
}
function raAdoptionUpdateFromMaster(adoption){
  const master=db.raMasters.find(m=>m.id===adoption.masterId); if(!master) return null;
  const mv=db.raMasterVersions.find(v=>v.id===master.currentVerId); if(!mv) return null;
  const cur=db.raProjectVersions.find(v=>v.id===adoption.currentVerId)||
            db.raProjectVersions.find(v=>v.adoptionId===adoption.id);
  const draft=raCreateDraftFrom(cur||{rev:'P00',status:'APPROVED',adoptionId:adoption.id,items:[],swpSteps:[],links:[],overrides:{added:[],excluded:[],modified:[]}});
  if(!draft) return null;
  const excluded=new Set((draft.overrides&&draft.overrides.excluded)||[]);
  const projItems=(draft.items||[]).filter(i=>i.origin==='project');
  const merged=structuredClone((mv.items||[]).filter(i=>!excluded.has(i.itemId)));
  projItems.forEach(pi=>{ if(!merged.some(i=>i.itemId===pi.itemId)) merged.push(structuredClone(pi)); });
  draft.items=merged;
  draft.swpSteps=structuredClone(mv.swpSteps||[]).concat((draft.swpSteps||[]).filter(sp=>sp.origin==='project'));
  draft.links=structuredClone(mv.links||[]);
  draft.basedOnMasterVerId=mv.id; draft.basedOnMasterRev=mv.rev;
  draft.note='Updated to master '+mv.rev+' (project items & exclusions preserved)';
  adoption.baseMasterVerId=mv.id; adoption.baseMasterRev=mv.rev;
  audit('master-update-adopted','raProjectVersion',draft.id,null,{toMasterRev:mv.rev});
  save(); return draft;
}

/* ---- deterministic structural diff (§22) ---- */
function raDiff(a,b){
  const A=Object.fromEntries((a.items||[]).map(i=>[i.itemId,i]));
  const B=Object.fromEntries((b.items||[]).map(i=>[i.itemId,i]));
  const added=Object.keys(B).filter(k=>!A[k]).map(k=>B[k]);
  const removed=Object.keys(A).filter(k=>!B[k]).map(k=>A[k]);
  const changed=[];
  Object.keys(B).filter(k=>A[k]).forEach(k=>{
    const x=A[k], y=B[k], ch=[];
    ['activity','hazard','consequence','resp','s0','l0','s1','l1'].forEach(f=>{
      if(String(x[f]||'')!==String(y[f]||'')) ch.push({field:f, from:x[f]||'', to:y[f]||''});
    });
    const xc=(x.controls||[]).concat(x.addControls||[]), yc=(y.controls||[]).concat(y.addControls||[]);
    const cAdd=yc.filter(c=>!xc.includes(c)), cRem=xc.filter(c=>!yc.includes(c));
    if(ch.length||cAdd.length||cRem.length) changed.push({itemId:k, hazard:y.hazard||x.hazard, changes:ch, ctrlAdded:cAdd, ctrlRemoved:cRem});
  });
  const As=Object.fromEntries((a.swpSteps||[]).map(s=>[s.stepId,s]));
  const Bs=Object.fromEntries((b.swpSteps||[]).map(s=>[s.stepId,s]));
  return {added, removed, changed,
    stepsAdded:Object.keys(Bs).filter(k=>!As[k]).map(k=>Bs[k]),
    stepsRemoved:Object.keys(As).filter(k=>!Bs[k]).map(k=>As[k]),
    stepsChanged:Object.keys(Bs).filter(k=>As[k]&&As[k].text!==Bs[k].text).map(k=>({stepId:k, from:As[k].text, to:Bs[k].text}))};
}

/* ---- one-time wrap of the legacy flat registers (Phase 1 data safety) ---- */
function raWrapLegacy(){
  if(root.raV2Wrapped) return;
  db.raLibrary.forEach(l=>{
    if(db.raMasters.some(m=>m.legacySrc===l.id)) return;
    const head={id:uid(), legacySrc:l.id, title:l.activity||'(untitled master)', tags:[], itemSeq:0,
      currentRev:null, currentVerId:null, status:'ACTIVE'};
    const items=(l.hazards||[]).map(h=>{ head.itemSeq++;
      return {itemId:itemPrefix(head.title)+'-'+String(head.itemSeq).padStart(3,'0'),
        activity:l.activity||'', hazard:h.desc||'', consequence:'', s0:h.s||'3', l0:h.l||'3',
        controls:String(h.controls||'').split(/\n|;/).map(x=>x.trim()).filter(Boolean),
        addControls:[], s1:h.s||'3', l1:h.l||'1', resp:'', origin:null,
        changeLog:[{rev:'M01', change:'Wrapped from legacy library record', reason:'v2 migration', srcType:'raLibrary', srcId:l.id}]};
    });
    const ver={id:uid(), masterId:head.id, rev:'M01', status:'LEGACY-APPROVED', items, swpSteps:[], links:[],
      createdAt:raNow(), createdBy:'migration', approvedBy:'(legacy)', approvedAt:raNow(),
      note:'Wrapped from legacy RA library — original record retained', provenance:{store:'raLibrary', id:l.id}};
    head.currentRev='M01'; head.currentVerId=ver.id;
    db.raMasters.push(head); db.raMasterVersions.push(ver);
    audit('created','raMaster',head.id,null,{title:head.title, from:'legacy raLibrary'});
  });
  root.projects.forEach(p=>{
    (p.ra||[]).forEach(l=>{
      p.raAdoptions=p.raAdoptions||[]; p.raProjectVersions=p.raProjectVersions||[];
      if(p.raAdoptions.some(a=>a.legacySrc===l.id)) return;
      const head={id:uid(), legacySrc:l.id, masterId:null, title:l.activity||'(untitled RA)', subcon:'',
        baseMasterVerId:null, baseMasterRev:null, currentRev:null, currentVerId:null, status:'ACTIVE', itemSeq:0};
      const items=(l.hazards||[]).map(h=>{ head.itemSeq++;
        return {itemId:itemPrefix(head.title)+'-'+String(head.itemSeq).padStart(3,'0'),
          activity:l.activity||'', hazard:h.desc||'', consequence:'', s0:h.s||'3', l0:h.l||'3',
          controls:String(h.controls||'').split(/\n|;/).map(x=>x.trim()).filter(Boolean),
          addControls:[], s1:h.s||'3', l1:h.l||'1', resp:l.prepared||'', origin:null,
          changeLog:[{rev:'P01', change:'Wrapped from legacy project register', reason:'v2 migration', srcType:'ra', srcId:l.id}]};
      });
      const ver={id:uid(), adoptionId:head.id, rev:'P01',
        status:raApprovedStatuses().includes('LEGACY-APPROVED')&&l.approved?'LEGACY-APPROVED':'DRAFT',
        basedOnMasterVerId:null, basedOnMasterRev:null, items, swpSteps:[], links:[],
        overrides:{added:[],excluded:[],modified:[]}, comments:[],
        createdAt:raNow(), createdBy:'migration',
        approvedBy:l.approved||'', approvedAt:l.approvedDate||'',
        note:'Wrapped from legacy register (was Rev '+(l.rev||'?')+', status '+(l.status||'?')+')',
        provenance:{store:'ra', id:l.id, projectId:p.id}};
      if(ver.status==='LEGACY-APPROVED'){ head.currentRev='P01'; head.currentVerId=ver.id; }
      p.raAdoptions.push(head); p.raProjectVersions.push(ver);
    });
  });
  root.raV2Wrapped=true;
  save();
}

/* ---- linkage helpers (§15/§17) ---- */
function waAdoptRefs(wa){
  return (wa.raRefs||[]).filter(r=>String(r.raId||'').startsWith('adopt:'))
    .map(r=>({adoptionId:String(r.raId).slice(6), rev:r.rev||'', verId:r.verId||''}));
}
function adoptionLinkedWAs(adoptionId){
  return db.workActivities.filter(w=>waAdoptRefs(w).some(x=>x.adoptionId===adoptionId));
}
function adoptionLearning(adoptionId){
  const was=adoptionLinkedWAs(adoptionId).map(w=>w.id);
  const d30=new Date(Date.now()-30*864e5).toISOString().slice(0,10);
  return {obs:db.observations.filter(o=>was.includes(o.waId)&&(o.date||'')>=d30).length,
    inc:db.incidents.filter(i=>was.includes(i.waId)).length,
    reviews:db.reviewTriggers.filter(t=>t.adoptionId===adoptionId&&t.status==='OPEN').length};
}
function waPinnedRaItems(wa){
  const out=[];
  waAdoptRefs(wa).forEach(ref=>{
    const ver=db.raProjectVersions.find(v=>v.id===ref.verId)||
      db.raProjectVersions.find(v=>v.adoptionId===ref.adoptionId&&raApprovedStatuses().includes(v.status));
    if(ver) (ver.items||[]).forEach(i=>out.push({rev:ver.rev, item:i}));
  });
  return out.sort((a,b)=>((+b.item.s1||0)*(+b.item.l1||0))-((+a.item.s1||0)*(+a.item.l1||0)));
}

    app.querySelectorAll('[data-newctl]').forEach(el=>el.addEventListener('keydown',e=>{
      if(e.key==='Enter'&&el.value.trim()){ const it=RAED.ver.items[+el.dataset.newctl];
        (it.addControls=it.addControls||[]).push(el.value.trim()); renderRaVer(verId); } }));
    app.querySelectorAll('[data-rmctl]').forEach(el=>el.onclick=()=>{
      const [i,ci]=el.dataset.rmctl.split(':').map(Number);
      const it=RAED.ver.items[i]; const all=[...(it.controls||[]),...(it.addControls||[])];
      const val=all[ci];
      it.controls=(it.controls||[]).filter(c=>c!==val); it.addControls=(it.addControls||[]).filter(c=>c!==val);
      renderRaVer(verId); });
    app.querySelectorAll('[data-rmitem]').forEach(el=>el.onclick=()=>{
      if(confirm('Remove this hazard item from the draft?')){ RAED.ver.items.splice(+el.dataset.rmitem,1); renderRaVer(verId); } });
    app.querySelectorAll('[data-step]').forEach(el=>el.addEventListener('change',()=>{
      RAED.ver.swpSteps[+el.dataset.step].text=el.value; }));
    app.querySelectorAll('[data-rmstep]').forEach(el=>el.onclick=()=>{
      RAED.ver.swpSteps.splice(+el.dataset.rmstep,1); renderRaVer(verId); });
    const ai=document.getElementById('raAddItem');
    if(ai) ai.onclick=()=>{ RAED.ver.items.push(raNewItem(head)); save(); renderRaVer(verId); };
    const as=document.getElementById('raAddStep');
    if(as) as.onclick=()=>{ RAED.ver.swpSteps=RAED.ver.swpSteps||[];
      RAED.ver.swpSteps.push({stepId:'S'+String(RAED.ver.swpSteps.length+1).padStart(2,'0'), text:''}); renderRaVer(verId); };
    const sd=document.getElementById('raSaveDraft');
    if(sd) sd.onclick=()=>{ Object.assign(ver,RAED.ver); audit('edited', 'raVersion', ver.id, null, {rev:ver.rev});
      save(); toast('Draft saved'); };
    const sb=document.getElementById('raSubmitBtn');
    if(sb) sb.onclick=()=>{ Object.assign(ver,RAED.ver); raSubmit(ver); renderRaVer(verId); };
  }
  const ap=document.getElementById('raApproveBtn');
  if(ap) ap.onclick=()=>{ if(confirm('Approve and permanently lock '+ver.rev+'? Superseded revisions stay retrievable.')){ raApprove(ver); renderRaVer(verId); } };
  const rv=document.getElementById('raReviseBtn');
  if(rv) rv.onclick=()=>{ const d=raCreateDraftFrom(ver); if(d) location.hash='#/raver/'+d.id; };
  raBindComments(ver, verId);
}

        reason:'MC comment proposed for company master: "'+c.text.slice(0,140)+'"',
        reviewer:'', status:'OPEN', outcome:''});

EV.on('record:changed',({store,id})=>{
  if(!canRA()) return;
  if(store!=='observations'&&store!=='incidents') return;
  const rec=(db[store]||[]).find(x=>x.id===id);
  if(!rec||!rec.waId) return;
  const serious=store==='incidents'||rec.severity==='Critical'||rec.severity==='Major';
  if(!serious) return;
  const wa=db.workActivities.find(w=>w.id===rec.waId); if(!wa) return;
  waAdoptRefs(wa).forEach(ref=>{
    if(db.reviewTriggers.some(t=>t.sourceId===id&&t.adoptionId===ref.adoptionId)) return;
    db.reviewTriggers.push({id:uid(), at:raNow(),
      source:store==='incidents'?(rec.type==='Near Miss'?'Near Miss':'Incident'):'Observation',
      sourceId:id, adoptionId:ref.adoptionId, masterId:'',
      reason:(store==='incidents'?('Incident on linked activity: '):(''+(rec.severity||'')+' observation on linked activity: '))+
        String(rec.description||rec.desc||rec.category||'').split('\n')[0].slice(0,120)+
        ' — review whether a hazard/control is missing, ineffective, or was not implemented (pinned '+ref.rev+').',
      reviewer:'', status:'OPEN', outcome:''});
  });
  save();
});

    return acts.some(a=>t.includes(a.toLowerCase().slice(0,6))) || kw.some(w=>t.includes(w)); });

async function tbxWeather(){

    const r=await fetch('https://api.data.gov.sg/v1/environment/2-hour-weather-forecast');
    const d=await r.json();
    const fc=(d.items&&d.items[0]&&d.items[0].forecasts)||[];

function tbmDashboardHtml(items){
  const d30=new Date(Date.now()-30*864e5).toISOString().slice(0,10);
  const recent=items.filter(i=>(i.date||'')>=d30);
  if(!recent.length) return '';
  const roster=Math.max(1,db.members.length);
  let att=0, quizN=0, quizOk=0, spots=0, closed=0, overdue=0;
  recent.forEach(t=>{
    const n=(t.attendees||[]).length+((t.checkins||[]).filter(c=>!c.memberId).length)+((t.others||'').split('\n').filter(x=>x.trim()).length);
    att+=Math.min(1,n/roster);
    (t.checkins||[]).forEach(c=>{ if(c.answer!==undefined&&c.answer!==null){ quizN++; if(c.correct) quizOk++; } });
    if(t.spot&&t.spot.desc){ spots++;
      const o=t.spot.obsId?db.observations.find(x=>x.id===t.spot.obsId):null;
      if(o){ if(o.status==='Closed') closed++; else if(o.due&&daysTo(o.due)<0) overdue++; }
    }
  });
  const pct=v=>Math.round(v*100)+'%';
  const tile=(v,l,cls)=>'<div class="stile"><div class="v'+(cls?' '+cls:'')+'">'+v+'</div><div class="l">'+l+'</div></div>';
  return '<div class="tiles" style="margin-top:2px">'+
    tile(recent.length,'TBM held (30d)')+
    tile(pct(att/recent.length),'Avg attendance')+
    tile(quizN?pct(quizOk/quizN):'—','Comprehension','g')+
    tile(spots,'Hazards raised')+

  /* QR check-in */
  document.getElementById('tbxQrBtn').onclick=async()=>{

    try{
      if(!t.qrLive){

        tbxPersist(false);            /* draft record so workers’ phones can reach it */
        await pushNow();

  };
  if(t.qrLive){ loadQrLib().then(()=>{ const box=document.getElementById('tbxQrBox');
    if(box&&!box.childElementCount){ const url=location.origin+location.pathname+'#/checkin/'+curProj().id+'/'+t.id+'/'+t.qrToken;
      new QRCode(box,{text:url,width:170,height:170}); } }).catch(()=>{}); }
  const rf=document.getElementById('tbxRefresh');
  if(rf) rf.onclick=async()=>{ rf.textContent='Refreshing…';
    try{ await pullNow(); const rec=db.tbm.find(x=>x.id===t.id);
      if(rec){ t.checkins=rec.checkins||[]; document.getElementById('tbxCount').textContent=t.checkins.length;
        document.getElementById('tbxOk').textContent=t.checkins.filter(c=>c.correct).length; } }
    catch(e){} rf.textContent='Refresh'; };
  document.getElementById('tbxSave').onclick=()=>{
    upd();
    if(!t.conductor.trim()){ alert('Enter who conducted the meeting.'); return; }
    if(!t.acts.length){ alert('Select at least one activity.'); return; }
    tbxPersist(true);
    try{ localStorage.removeItem('kkl-tbx-draft'); }catch(e){}
    TBX=null;
    location.hash='#/tbm';
  };
}
function tbxPersist(final){
  const t=TBX;
  /* hazard spot -> tracked observation (once) */
  if(final && t.spot.desc && !t.spot.obsId){
    const obs={id:uid(), kind:'Safety non-compliance', date:t.date, time:t.time, initiator:t.spot.by||t.conductor,
      category:'Housekeeping / General', desc:'TBM hazard spot: '+t.spot.desc+(t.spot.action?'\nAction: '+t.spot.action:''),
      severity:'Minor', status:'Open', due:new Date(Date.now()+3*864e5).toISOString().slice(0,10),
      beforePhotos:t.spot.photo?[t.spot.photo]:[], afterPhotos:[]};
    db.observations.push(obs);
    t.spot.obsId=obs.id;
  }
  const brief=t.briefing||tbxComposeBrief();
  const risks=tbxTopRisks().map((r,i)=>(i+1)+'. '+r.h+' — '+r.c).join('\n');
  const auto=[
    'Attendance: '+(t.attendees.length+t.checkins.length)+' ('+t.checkins.length+' via QR check-in'+
      (t.checkins.length?', '+t.checkins.filter(c=>c.correct).length+' answered the check question correctly':'')+')',
    t.spot.desc?('Hazard spotted by '+(t.spot.by||'worker')+': '+t.spot.desc+(t.spot.action?' → '+t.spot.action:'')+' (tracked as observation)'):'',
    t.weather?t.weather.line:''
  ].filter(Boolean).join('\n');
  const rec={id:t.id, date:t.date, time:t.time, conductor:t.conductor,
    topics:brief, hazards:risks, ptw:t.ptw, photos:t.photos,
    attendees:t.attendees, others:t.checkins.filter(c=>!c.memberId).map(c=>c.name).join('\n'),
    remarks:auto,
    activities:t.acts, briefing:t.briefing, translations:t.translations, quiz:t.quiz, waId:t.waId||null,
    qrToken:t.qrToken, checkins:t.checkins, sigs:t.sigs||{}, spot:t.spot, weather:t.weather?t.weather.line:null, draft:!final};
  const i=db.tbm.findIndex(x=>x.id===t.id);
  if(i>=0) db.tbm[i]=rec; else db.tbm.push(rec);
  save();
  if(final){
    EV.emit('record:changed',{store:'tbm', id:rec.id});
    setTimeout(()=>autoFileRecord('tbm', rec.id), 400);   /* file the eTBM report */
  }
}

    }catch(e){ const el=document.getElementById('ciErr'); el.textContent=e.message||'Failed'; el.style.display='block';
      btn.disabled=false; btn.textContent='Check in'; }
  };
}

function compTypeByCode(code){ return db.competencyTypes.find(t=>(t.code||'').toLowerCase()===String(code||'').toLowerCase()); }
function compTypeKws(t){ return (t&&t.kws&&t.kws.length)?t.kws:(t?[String(t.name||'').toLowerCase()]:[]); }

function wfGuessType(certName){
  const n=String(certName||'').toLowerCase();
  const t=db.competencyTypes.find(x=>(x.kws||[]).some(k=>n.includes(k)));
  return t||compTypeByCode('OTH');
}
function memberAccess(mid){ return db.workerProjectAccess.find(a=>a.memberId===mid); }

/* one-time, idempotent unification: seed types, link training by ID where the
   name matches exactly one member, wrap legacy cert rows into competencies */
function wfMigrate(){
  let changed=false;
  COMP_SEED.forEach(t=>{                       /* additive: new seed types reach existing orgs */
    if(!db.competencyTypes.some(x=>x.code===t.code)){
      db.competencyTypes.push(Object.assign({id:'ct-'+t.code.toLowerCase()},t));
      changed=true;
    }
  });
  db.training.forEach(t=>{
    if(t.memberId) return;
    const nm=(t.name||'').trim().toLowerCase(); if(!nm) return;
    const hits=db.members.filter(m=>(m.name||'').trim().toLowerCase()===nm);
    if(hits.length===1){ t.memberId=hits[0].id; changed=true; }
  });
  db.members.forEach(m=>{
    if(!(m.certs||[]).length || memberComps(m.id).length) return;
    (m.certs||[]).forEach((c,i)=>{
      if(!(c.name||c.no||c.expiry)) return;
      const t=wfGuessType(c.name);
      db.workerCompetencies.push({id:'wc-'+m.id+'-'+i, memberId:m.id, memberName:m.name||'',
        company:m.company||'', typeCode:t?t.code:'OTH', typeName:c.name||(t?t.name:'Other'),
        certNo:c.no||'', expiry:c.expiry||'', verification:'LEGACY', source:'wrapped-from-member'});
    });
    changed=true;
  });
  if(!db.organisations.length && db.members.length){
    [...new Set(db.members.map(m=>(m.company||'').trim()).filter(Boolean))].forEach(nm=>{
      db.organisations.push({id:'org-'+nm.toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,30),
        name:nm, type:/^kkl/i.test(nm)?'own':'subcon'});
    });
    changed=true;
  }
  if(changed) save();
}

/* ---- verified-aware competency lookup (used by eligibility + SIC + matrix) ---- */
function hasLiveCertV(m,kws){
  const hits=memberAllCerts(m).filter(c=>certLive(c)&&kws.some(k=>(c.name||'').toLowerCase().includes(k)));
  return {has:hits.length>0, verified:hits.some(c=>!c.ver||c.ver==='VERIFIED'||c.ver==='LEGACY')};
}

/* ---- SIC requirement profiles + readiness ---- */
function sicProfile(){
  if(!db.sicProfiles.length){
    db.sicProfiles.push({id:'sp-standard', name:'Standard (pass + photo + CSOC)', client:'',
      requirements:[{req:'WORKPASS'},{req:'PHOTO'},{req:'CSOC'}]});
    save();
  }
  return db.sicProfiles.find(p=>p.id===db.settings.sicProfileId)||db.sicProfiles[0];

/* per-worker requirement check → [{label, ok, warn, why, fix}] */
function sicCheckMember(m, prof){
  const out=[];
  (prof&&prof.requirements||[]).forEach(r=>{
    const code=String(r.req||'').trim(); if(!code) return;
    const tr=String(r.trade||'').trim().toLowerCase();
    if(tr && !((m.trade||'')+' '+(m.remarks||'')).toLowerCase().includes(tr)) return; /* requirement not applicable to this trade */
    const C=code.toUpperCase();
    if(C==='PHOTO'){ out.push({label:'Worker photo', ok:!!(m.photos&&m.photos.length), why:'No photo on record', fix:'#/members/'+m.id}); return; }
    if(C==='WORKPASS'){
      const d=m.wpExpiry?daysTo(m.wpExpiry):null;
      out.push({label:'Valid work pass', ok:d!==null&&d>=0,
        why:d===null?'No work pass expiry recorded':(d<0?'Pass expired '+fmtD(m.wpExpiry):''), fix:'#/members/'+m.id});
      return;
    }
    const t=compTypeByCode(C)||db.competencyTypes.find(x=>(x.name||'').toLowerCase()===code.toLowerCase());
    const v=hasLiveCertV(m, t?compTypeKws(t):[code.toLowerCase()]);
    out.push({label:t?t.name:code, ok:v.has, warn:v.has&&!v.verified,
      why:v.has?(v.verified?'':'Held but unverified'):'Not held or expired', fix:'#/workerCompetencies/new'});
  });
  if(m.status==='INACTIVE') out.push({label:'Worker active', ok:false, why:'Worker is marked INACTIVE', fix:'#/members/'+m.id});
  return out;
}
function sicReady(m, prof){ return sicCheckMember(m, prof).every(r=>r.ok); }

   safety-trade members. Deduped, alphabetical. */
/* supervisors listed for THIS site: site contacts, anyone holding a
   supervisory role on a work activity crew, and supervisory trades on site. */
function siteSupervisorList(){
  const set=new Set();
  const add=v=>{ v=String(v||'').trim(); if(v) set.add(v); };
  const SUP=/supervisor|foreman|wsho|wshc|safety|manager|engineer|\bre\b|\bpm\b|charge/i;
  db.contacts.filter(c=>SUP.test((c.role||'')+' '+(c.notes||''))).forEach(c=>add(c.name));
  db.workActivities.forEach(w=>(w.crew||[]).forEach(c=>{
    if(!SUP.test(c.role||'')) return;
    const m=db.members.find(x=>x.id===c.memberId); if(m) add(m.name);
  }));
  const onSite=(typeof projectMemberIds==='function')?projectMemberIds():new Set();
  db.members.filter(m=>!m.mergedInto&&SUP.test(m.trade||'')&&(!onSite.size||onSite.has(m.id)))
    .forEach(m=>add(m.name));
  safetyPersonnelList().forEach(add);
  return [...set].sort((a,b)=>a.localeCompare(b));
}
function safetyPersonnelList(){
  const set=new Set();
  const add=v=>{ v=String(v||'').trim(); if(v) set.add(v); };
  db.sicSessions.forEach(x=>add(x.conductor));
  db.tbm.forEach(x=>add(x.conductor));
  db.inspections.forEach(x=>add(x.inspector));
  db.checklists.forEach(x=>add(x.inspector));
  db.contacts.filter(c=>/wsh|safety|sho|wsho|wshc/i.test((c.role||'')+' '+(c.notes||''))).forEach(c=>add(c.name));
  db.members.filter(m=>/wsh|safety/i.test(m.trade||'')).forEach(m=>add(m.name));
  add(myDisplayName());
  return [...set].sort((a,b)=>a.localeCompare(b));
}

    '<div class="btnrow" style="margin-top:12px"><button class="btn" id="scDone" style="flex:1">Complete SIC session</button></div>';

    const present=[...document.querySelectorAll('input[data-m]:checked')].map(cb=>cb.dataset.m);
    if(!present.length){ alert('No attendance ticked.'); return; }
    const sess={id:uid(), date, conductor:by, remarks:document.getElementById('scRem').value.trim(),
      profileId:sicProfile().id, status:'COMPLETED',
      workers:rows.map(r=>({memberId:r.m.id, name:r.m.name, company:r.m.company||'',
        ready:r.checks.every(c=>c.ok), present:present.includes(r.m.id)}))};
    db.sicSessions.push(sess);
    present.forEach(mid=>{
      const m=db.members.find(x=>x.id===mid); if(!m) return;
      const docsOk=rows.find(r=>r.m.id===mid).checks.every(c=>c.ok);
      let acc=memberAccess(mid);
      if(!acc){ acc={id:'wpa-'+mid, memberId:mid}; db.workerProjectAccess.push(acc); }
      Object.assign(acc,{memberName:m.name||'', company:m.company||'', sicStatus:'COMPLETE', sicDate:date,
        sessionId:sess.id, approvedBy:by, accessStatus:docsOk?'ALLOWED':'FLAGGED'});
      audit('sic-complete','member',mid,null,{date, by, session:sess.id});
    });
    save(); EV.emit('record:changed',{store:'sicSessions', id:sess.id}); EV.emit('sync:applied',{});
    SICX=null; location.hash='#/sic/'+sess.id;
  };
}

/* ---- competency matrix + workforce dashboard ---- */
let MTX={q:'',co:'',show:'ALL',all:false,scope:'site'};
function renderMatrix(){
  const cols=db.competencyTypes.filter(t=>t.core);
  const compIdx={};
  db.workerCompetencies.forEach(c=>{ (compIdx[c.memberId]=compIdx[c.memberId]||[]).push(c); });
  const siteIds=MTX.scope==='site'?projectMemberIds():null;
  const cell=(m,t)=>{
    const kws=compTypeKws(t);
    const certs=memberAllCerts(m).filter(c=>kws.some(k=>(c.name||'').toLowerCase().includes(k)));
    if(!certs.length) return '<td class="mx">—</td>';
    const live=certs.filter(certLive);
    if(!live.length) return '<td class="mx bad">&#10007;</td>';
    const d=Math.min(...live.map(c=>c.expiry?(daysTo(c.expiry)??9999):9999));
    const unver=!live.some(c=>!c.ver||c.ver==='VERIFIED'||c.ver==='LEGACY');
    if(d<=30||unver) return '<td class="mx warn">&#9888;</td>';
    return '<td class="mx ok">&#10003;</td>';
  };
  const q=MTX.q.toLowerCase();
  let ms=db.members.filter(m=>!m.mergedInto).filter(m=>!q||JSON.stringify(m).toLowerCase().includes(q));
  if(siteIds&&!q) ms=ms.filter(m=>siteIds.has(m.id));
  if(MTX.co) ms=ms.filter(m=>(m.company||'')===MTX.co);
  const rows=ms.map(m=>{
    const acc=memberAccess(m.id);
    const sic=acc&&acc.sicStatus==='COMPLETE'?(acc.sicExpiry&&(daysTo(acc.sicExpiry)??0)<0?'EXPIRED':'OK'):(m.sicDate?'LEGACY':'NONE');
    const el=checkMemberEligibility(m.id,MTX.waId||null);
    const worst=el.some(r=>r.status==='BLOCK')?'BLOCKED':el.some(r=>r.status==='WARN')?'WARN':'READY';
    const exp=memberAllCerts(m).map(c=>c.expiry?daysTo(c.expiry):null).filter(d=>d!==null);
    if(m.wpExpiry) exp.push(daysTo(m.wpExpiry));
    const minExp=exp.length?Math.min(...exp):null;
    return {m,sic,worst,minExp};
  }).filter(r=>{
    if(MTX.show==='SIC') return r.sic!=='OK';
    if(MTX.show==='ELIGWA') return r.worst!=='BLOCKED';
    if(MTX.show==='BLOCKED') return r.worst==='BLOCKED';
    if(MTX.show==='E7') return r.minExp!==null&&r.minExp<=7;
    if(MTX.show==='E30') return r.minExp!==null&&r.minExp<=30;
    if(MTX.show==='E60') return r.minExp!==null&&r.minExp<=60;
    if(MTX.show==='E90') return r.minExp!==null&&r.minExp<=90;
    if(MTX.show==='EXP') return r.minExp!==null&&r.minExp<0;
    return true;
  }).sort((a,b)=>(a.m.company||'').localeCompare(b.m.company||'')||(a.m.name||'').localeCompare(b.m.name||''));
  const base=siteIds?db.members.filter(m=>siteIds.has(m.id)):db.members;
  const active=base.filter(m=>m.status!=='INACTIVE').length;
  const sicMiss=base.filter(m=>m.status!=='INACTIVE'&&!(memberAccess(m.id)&&memberAccess(m.id).sicStatus==='COMPLETE')).length;
  const e30=base.filter(m=>memberAllCerts(m).concat(m.wpExpiry?[{expiry:m.wpExpiry}]:[]).some(c=>{const d=c.expiry?daysTo(c.expiry):null; return d!==null&&d>=0&&d<=30;})).length;
  const expd=base.filter(m=>memberAllCerts(m).some(c=>{const d=c.expiry?daysTo(c.expiry):null; return d!==null&&d<0;})).length;
  const shown=MTX.all?rows:rows.slice(0,150);
  app.innerHTML=header('Competency Matrix')+
    '<div class="btnrow" style="margin:0 0 10px">'+
      '<button class="btn'+(MTX.scope==='site'?'':' ghost')+'" id="mxSite" style="flex:1">This project</button>'+
      (isHQ()?'<button class="btn'+(MTX.scope==='company'?'':' ghost')+'" id="mxAllScope" style="flex:1">Whole company</button>':'')+
    '</div>'+
    '<div class="tiles">'+
      '<div class="stile"><div class="v">'+active+'</div><div class="l">Active workers</div></div>'+
      '<div class="stile"><div class="v'+(sicMiss?' w':'')+'">'+sicMiss+'</div><div class="l">SIC incomplete</div></div>'+
      '<div class="stile"><div class="v'+(e30?' w':'')+'">'+e30+'</div><div class="l">Expiring &le;30d</div></div>'+
      '<div class="stile"><div class="v'+(expd?' w':'')+'">'+expd+'</div><div class="l">Expired certs</div></div></div>'+
    '<div class="card"><input id="mxQ" placeholder="Search worker / ID / trade" value="'+esc(MTX.q)+'">'+
    '<div class="btnrow" style="margin-top:8px">'+
    '<select id="mxCo" style="flex:1"><option value="">All companies</option>'+
      [...new Set(db.members.map(m=>m.company).filter(Boolean))].map(c=>'<option'+(MTX.co===c?' selected':'')+'>'+esc(c)+'</option>').join('')+'</select>'+
    '<select id="mxShow" style="flex:1">'+
      [['ALL','Show all'],['SIC','SIC incomplete'],['BLOCKED','Blocked'],['ELIGWA','Eligible (not blocked)'],['EXP','Expired'],['E7','Expiring ≤7d'],['E30','Expiring ≤30d'],['E60','Expiring ≤60d'],['E90','Expiring ≤90d']]
      .map(o=>'<option value="'+o[0]+'"'+(MTX.show===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+'</select></div>'+
    '<div class="btnrow" style="margin-top:8px">'+
    '<select id="mxWa" style="flex:1"><option value="">Eligibility: general</option>'+
      db.workActivities.filter(w=>w.status!=='Completed').map(w=>'<option value="'+w.id+'"'+(MTX.waId===w.id?' selected':'')+'>For: '+esc(w.title||w.type||'activity')+'</option>').join('')+'</select>'+
    '<button class="btn ghost" id="mxRecords">Records</button>'+
    '<button class="btn ghost" onclick="location.hash=\'#/training\'">Training</button>'+
    '<button class="btn ghost" onclick="location.hash=\'#/certexp\'">Cert Expiry</button>'+
    '<button class="btn ghost" id="mxFinder">Find workers</button></div></div>'+
    '<div style="overflow-x:auto;margin-top:10px"><table class="mxt"><tr><th style="text-align:left">Worker</th><th>SIC</th>'+
    cols.map(t=>'<th title="'+esc(t.name)+'" style="cursor:help" onclick="toast(this.title)">'+esc(t.code)+'</th>').join('')+'<th>Status</th></tr>'+
    shown.map(r=>'<tr onclick="location.hash=\'#/passport/'+r.m.id+'\'"><td style="text-align:left;white-space:nowrap">'+esc(memberLabel(r.m))+
      '<div class="hint">'+esc(r.m.company||'')+'</div></td>'+
      '<td class="mx'+(r.sic==='OK'?' ok':r.sic==='NONE'?'':' warn')+'">'+(r.sic==='OK'?'&#10003;':r.sic==='LEGACY'?'L':r.sic==='EXPIRED'?'&#10007;':'—')+'</td>'+
      cols.map(t=>cell(r.m,t)).join('')+
      '<td><span class="chip '+(r.worst==='READY'?'g':r.worst==='WARN'?'w':'b')+'">'+r.worst+'</span></td></tr>').join('')+
    '</table></div>'+
    (rows.length>shown.length?'<div class="btnrow" style="margin-top:10px"><button class="btn ghost" id="mxAll" style="flex:1">Show all '+rows.length+'</button></div>':'')+
    '<p class="hint">&#10003; valid · &#9888; expiring &le;30d or unverified · &#10007; expired · — not held · SIC "L" = legacy date only. Tap a row for the Worker Passport.</p>';
  const ms1=document.getElementById('mxSite'), ms2=document.getElementById('mxAllScope');
  if(ms1) ms1.onclick=()=>{ MTX.scope='site'; renderMatrix(); };
  if(ms2) ms2.onclick=()=>{ MTX.scope='company'; renderMatrix(); };
  document.getElementById('mxWa').onchange=e=>{ MTX.waId=e.target.value||null; renderMatrix(); };
  document.getElementById('mxRecords').onclick=()=>location.hash='#/workerCompetencies';
  document.getElementById('mxFinder').onclick=()=>location.hash='#/finder';
  document.getElementById('mxQ').oninput=e=>{ MTX.q=e.target.value; MTX.all=false; renderMatrix(); };
  document.getElementById('mxCo').onchange=e=>{ MTX.co=e.target.value; renderMatrix(); };
  document.getElementById('mxShow').onchange=e=>{ MTX.show=e.target.value; renderMatrix(); };
  const ma=document.getElementById('mxAll'); if(ma) ma.onclick=()=>{ MTX.all=true; renderMatrix(); };
}

/* ---- duplicate worker review (workforce brief §32): never auto-merge ---- */
function dupPairs(){
  const pairs=[], seen=new Set();
  const add=(a,b,why,conf)=>{ const k=[a.id,b.id].sort().join('~');
    if(seen.has(k)) return; seen.add(k); pairs.push({a,b,why,conf,key:k}); };
  const ms=db.members.filter(m=>!m.mergedInto);
  const group=(fn,why,conf)=>{ const map={};
    ms.forEach(m=>{ const v=fn(m); if(v) (map[v]=map[v]||[]).push(m); });
    Object.values(map).filter(g=>g.length>1).forEach(g=>{
      for(let i=0;i<g.length-1;i++) add(g[i],g[i+1],why,conf); }); };
  group(m=>(m.wid||'').trim().toUpperCase()||null,'Same Worker ID','High');
  group(m=>{ const v=(m.idno||'').replace(/[^A-Za-z0-9]/g,''); return v.length>=5?v.toUpperCase():null; },'Same NRIC/FIN','High');
  group(m=>{ const n=(m.name||'').trim().toLowerCase(); return n?n+'|'+(m.company||'').trim().toLowerCase():null; },'Same name + company','Medium');
  const dismissed=new Set(db.auditEvents.filter(a=>a.action==='dup-dismissed').map(a=>a.entityId));
  return pairs.filter(p=>!dismissed.has(p.key));
}
function mergeWorkers(keepId, dropId){
  const keep=db.members.find(m=>m.id===keepId), drop=db.members.find(m=>m.id===dropId);
  if(!keep||!drop) return;
  root.projects.forEach(p=>{
    (p.workerProjectAccess||[]).forEach(a=>{ if(a.memberId===dropId){ a.memberId=keepId; a.memberName=keep.name||''; } });
    (p.workActivities||[]).forEach(w=>(w.crew||[]).forEach(c=>{ if(c.memberId===dropId) c.memberId=keepId; }));
    (p.tbm||[]).forEach(t=>{ (t.checkins||[]).forEach(c=>{ if(c.memberId===dropId) c.memberId=keepId; });
      if(Array.isArray(t.attendees)) t.attendees=t.attendees.map(id=>id===dropId?keepId:id); });
    (p.sicSessions||[]).forEach(s=>(s.workers||[]).forEach(w=>{ if(w.memberId===dropId) w.memberId=keepId; }));
  });
  db.workerCompetencies.forEach(c=>{ if(c.memberId===dropId){ c.memberId=keepId; c.memberName=keep.name||''; } });
  db.training.forEach(t=>{ if(t.memberId===dropId) t.memberId=keepId; });
  db.equipment.forEach(e=>{ if(e.operatorMemberId===dropId) e.operatorMemberId=keepId; });
  ['wid','idno','phone','wpExpiry','passType','designation','trade','company'].forEach(k=>{ if(!keep[k]&&drop[k]) keep[k]=drop[k]; });
  drop.mergedInto=keepId; drop.status='INACTIVE';
  drop.remarks=((drop.remarks||'')+' Merged into '+(keep.name||keepId)+' on '+today()+'.').trim();
  audit('worker-merged','member',dropId,null,{into:keepId});
  save(); EV.emit('record:changed',{store:'members',id:keepId});
}

/* ============ SPATIAL LOCATION ENGINE — Phase 1-2 ============
   Logical Locations (stable records, tree) are separate from geometry
   (versioned per layout). A layout is a representation: a geographic map
   (WGS84/OSM) or an uploaded site-plan image in its own pixel space.
   Geometry is GeoJSON in the layout's native coordinates, never destroyed.
   CAD (DXF), georeferencing/SVY21 and module integration are later phases. */
const LOC_TYPES=['PROJECT_AREA','ZONE','SUBZONE','LEVEL','ROOM','ROAD','CHAINAGE','WORKFRONT','ASSET','STRUCTURE','DRAIN','MANHOLE','OTHER'];
const ZONE_TYPES=['WORK_ZONE','EXCLUSION_ZONE','LIFTING_ZONE','EXCAVATION_ZONE','HOT_WORK_ZONE','CONFINED_SPACE_ZONE','PEDESTRIAN_ZONE','VEHICLE_ZONE','HAUL_ROUTE','STORAGE_ZONE','EMERGENCY_ZONE','RESTRICTED_ZONE','OTHER'];

/* ---- core location services ---- */
function locById(id){ return db.locations.find(l=>l.id===id); }
function locChildren(id){ return db.locations.filter(l=>l.parentId===id&&l.status!=='ARCHIVED'); }
function locDepth(id){ let d=0,l=locById(id); while(l&&l.parentId&&d<12){ d++; l=locById(l.parentId); } return d; }
function locBreadcrumb(id){
  const parts=[]; let l=locById(id), guard=0;
  while(l&&guard++<12){ parts.unshift(l.name||l.code||'?'); l=l.parentId?locById(l.parentId):null; }
  return parts.join(' → ');
}
function searchLocations(q){
  q=String(q||'').trim().toLowerCase();
  if(!q) return [];
  const score=l=>{
    const name=(l.name||'').toLowerCase(), code=(l.code||'').toLowerCase();
    const alias=(l.aliases||'').toLowerCase(), crumb=locBreadcrumb(l.id).toLowerCase();
    if(name===q||code===q) return 0;
    if(name.startsWith(q)||code.startsWith(q)) return 1;
    if(name.includes(q)||code.includes(q)||alias.includes(q)) return 2;
    if(crumb.includes(q)) return 3;
    return -1;
  };
  return db.locations.filter(l=>l.status!=='ARCHIVED')
    .map(l=>({l,s:score(l)})).filter(x=>x.s>=0)
    .sort((a,b)=>a.s-b.s||(a.l.name||'').localeCompare(b.l.name||''))
    .map(x=>x.l).slice(0,12);
}
function layoutCurVer(layout){ return db.layoutVersions.find(v=>v.id===layout.currentVerId); }
function getCurrentLocationGeometry(locId, layoutVerId){
  return db.locGeoms.filter(g=>g.locationId===locId&&g.layoutVerId===layoutVerId&&g.status!=='SUPERSEDED')
    .sort((a,b)=>(b.at||'').localeCompare(a.at||''))[0]||null;
}
function getLocationGeometryAtTime(locId, layoutVerId, isoDate){
  return db.locGeoms.filter(g=>g.locationId===locId&&g.layoutVerId===layoutVerId
      &&(g.validFrom||'')<=isoDate&&(!g.validUntil||g.validUntil>=isoDate))
    .sort((a,b)=>(b.validFrom||'').localeCompare(a.validFrom||''))[0]||null;
}

/* ---- OpenLayers lazy loader (CDN, only when a spatial page opens) ---- */
let OLP=null;
function loadOL(){
  if(window.ol) return Promise.resolve();
  if(OLP) return OLP;
  if(!document.getElementById('olcss')){
    const l=document.createElement('link'); l.id='olcss'; l.rel='stylesheet';
    l.href='https://cdn.jsdelivr.net/npm/ol@9.2.4/ol.css'; document.head.appendChild(l);
  }
  OLP=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/ol@9.2.4/dist/ol.js';
    s.onload=()=>res(); s.onerror=()=>{ OLP=null; rej(new Error('Could not load the map library — check the connection.')); };
    document.head.appendChild(s);
  });
  return OLP;
}
