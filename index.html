    viewOpts={projection:proj, center:ol.extent.getCenter(extent), zoom:1, maxZoom:7};
  }else{
    baseLayers=[new ol.layer.Tile({source:new ol.source.OSM()})];
    viewOpts={center:ol.proj.fromLonLat([103.82,1.352]), zoom:11, maxZoom:21}; /* Singapore */
  }
  const featStyle=sel=>f=>{
    const zone=f.get('zoneId');
    return new ol.style.Style({
      stroke:new ol.style.Stroke({color:zone?'#b76e00':(sel?'#8f0d07':'#e11b12'), width:sel?4:2.5,
        lineDash:zone?[8,6]:undefined}),
      fill:new ol.style.Fill({color:sel?'rgba(225,27,18,.18)':'rgba(225,27,18,.06)'}),
      text:new ol.style.Text({text:f.get('label')||'', font:'600 12px system-ui',
        fill:new ol.style.Fill({color:'#8f0d07'}), stroke:new ol.style.Stroke({color:'#fff',width:3}), overflow:true})
    });
  };
  const src=new ol.source.Vector();
  const vec=new ol.layer.Vector({source:src, style:featStyle(false)});
  const map=new ol.Map({target:'spMap', layers:baseLayers.concat([vec]),
    view:new ol.View(viewOpts), controls:ol.control.defaults.defaults({attribution:!isImg})});
  SPX={map, src, lay, ver, fmt, sel:null, drawInt:null, modInt:null, snapInt:null};
  const dataProj=isImg?proj:'EPSG:3857';
  const geoOpts=isImg?{dataProjection:proj, featureProjection:proj}
                     :{dataProjection:'EPSG:4326', featureProjection:'EPSG:3857'};
  function loadFeatures(){
    src.clear();
    db.locGeoms.filter(g=>g.layoutVerId===ver.id&&g.status!=='SUPERSEDED').forEach(g=>{
      try{
        const f=fmt.readFeature({type:'Feature', geometry:g.geometry}, geoOpts);
        const l=locById(g.locationId);
        f.set('locationId', g.locationId); f.set('geomId', g.id);
        f.set('label', l?(l.code||l.name||''):'');
        src.addFeature(f);
      }catch(e){ console.warn('bad geometry', g.id, e); }
    });
    db.zoneGeoms.filter(g=>g.layoutVerId===ver.id&&g.status!=='SUPERSEDED').forEach(g=>{
      const z=db.spatialZones.find(x=>x.id===g.zoneId);
      if(z&&z.validUntil&&z.validUntil<today()) return; /* expired overlays hidden */
      try{
        const f=fmt.readFeature({type:'Feature', geometry:g.geometry}, geoOpts);
        f.set('zoneId', g.zoneId); f.set('geomId', g.id);
        f.set('label', z?(z.code||z.name||''):'');
        src.addFeature(f);
      }catch(e){}
    });
  }
  loadFeatures();
  if(src.getFeatures().length){ map.getView().fit(src.getExtent(),{padding:[40,40,40,40],maxZoom:isImg?5:18}); }
  document.getElementById('spFit').onclick=()=>{
    if(src.getFeatures().length) map.getView().fit(src.getExtent(),{padding:[40,40,40,40]});
    else if(isImg) map.getView().fit(proj.getExtent());
  };
  /* --- selection: map -> record --- */
  function selectLocation(locId, fromMap){
    SPX.sel=locId;
    src.getFeatures().forEach(f=>f.setStyle(f.get('locationId')===locId?featStyle(true)(f):null));
    renderSpPanel(locId);
    if(!fromMap){ /* text -> map: zoom + highlight */
      const f=src.getFeatures().find(x=>x.get('locationId')===locId);
      if(f) map.getView().fit(f.getGeometry().getExtent(),{padding:[60,60,60,60],maxZoom:isImg?5:19,duration:300});
    }
  }
  window.spSelectLocation=id=>selectLocation(id,false);
  map.on('singleclick',e=>{
    if(SPX.tool&&SPX.tool!=='select') return;
    const hits=[]; map.forEachFeatureAtPixel(e.pixel,f=>{ hits.push(f); }, {hitTolerance:8});
    const locs=hits.filter(f=>f.get('locationId'));
    if(!locs.length){ renderSpPanel(null); return; }
    /* prefer the deepest physical location; offer a chooser only for genuinely
       unrelated overlaps */
    locs.sort((a,b)=>locDepth(b.get('locationId'))-locDepth(a.get('locationId')));
    const top=locs[0].get('locationId');
    const unrelated=locs.filter(f=>{
      let l=locById(top);
      while(l){ if(l.id===f.get('locationId')) return false; l=l.parentId?locById(l.parentId):null; }
      return true;
    });
    if(unrelated.length) renderSpChooser([top].concat(unrelated.map(f=>f.get('locationId'))));
    else selectLocation(top,true);
    /* active overlays at the click point are shown in the panel */
    SPX.overlays=hits.filter(f=>f.get('zoneId')).map(f=>f.get('zoneId'));
  });
  /* --- tools --- */
  function clearTools(){
    ['drawInt','modInt','snapInt'].forEach(k=>{ if(SPX[k]){ map.removeInteraction(SPX[k]); SPX[k]=null; } });
  }
  function setTool(t){
    SPX.tool=t; clearTools();
    document.querySelectorAll('.sp-t').forEach(b=>b.classList.toggle('on',b.dataset.tool===t));
    if(t==='poly'||t==='rect'||t==='line'){
      const d=new ol.interaction.Draw({source:src,
        type:t==='line'?'LineString':t==='rect'?'Circle':'Polygon',
        geometryFunction:t==='rect'?ol.interaction.Draw.createBox():undefined});
      d.on('drawend',ev=>{ setTimeout(()=>spNewLocationForm(ev.feature),10); });
      SPX.drawInt=d; map.addInteraction(d);
      SPX.snapInt=new ol.interaction.Snap({source:src}); map.addInteraction(SPX.snapInt);
    }
    if(t==='edit'){
      SPX.modInt=new ol.interaction.Modify({source:src});
      SPX.modInt.on('modifyend',ev=>{
        ev.features.forEach(f=>{
          const gid=f.get('geomId'); if(!gid) return;
          const g=db.locGeoms.find(x=>x.id===gid)||db.zoneGeoms.find(x=>x.id===gid);
          if(g){ g.geometry=JSON.parse(fmt.writeGeometry(f.getGeometry(), geoOpts));
            audit('geometry-edited', g.locationId?'locGeom':'zoneGeom', gid, null, null); save(); }
        });
      });
      map.addInteraction(SPX.modInt);
      SPX.snapInt=new ol.interaction.Snap({source:src}); map.addInteraction(SPX.snapInt);
    }
    if(t==='del'){
      if(!SPX.sel){ alert('Select a location shape first, then Delete shape.'); setTool('select'); return; }
      const g=getCurrentLocationGeometry(SPX.sel, ver.id);
      const l=locById(SPX.sel);
      if(g&&confirm('Remove the drawn shape for "'+(l?l.name:'?')+'" on this layout? The Location record itself stays.')){
        g.status='SUPERSEDED'; g.validUntil=today();
        audit('geometry-removed','locGeom',g.id,null,{locationId:SPX.sel});
        save(); loadFeatures(); renderSpPanel(null);
      }
      setTool('select');
    }
  }
  document.querySelectorAll('.sp-t').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));
  SPX.tool='select';
  /* --- fast create form after drawing --- */
  function spNewLocationForm(feature){
    const panel=document.getElementById('spPanel');
    panel.innerHTML='<div class="card"><label style="margin-top:0">New location from drawing</label>'+
      '<div class="fgrid">'+
      '<div class="fld half"><label>Name *</label><input id="nlName" placeholder="e.g. Zone B"></div>'+
      '<div class="fld half"><label>Code</label><input id="nlCode" placeholder="e.g. Z-B"></div>'+
      '<div class="fld half"><label>Type</label><select id="nlType">'+LOC_TYPES.map(t=>'<option'+(t==='ZONE'?' selected':'')+'>'+t+'</option>').join('')+'</select></div>'+
      '<div class="fld half"><label>Parent</label><select id="nlParent"><option value="">— none (top level) —</option>'+
        db.locations.filter(l=>l.status!=='ARCHIVED').map(l=>'<option value="'+l.id+'">'+esc(locBreadcrumb(l.id))+'</option>').join('')+'</select></div>'+
      '</div><div class="btnrow"><button class="btn" id="nlSave" style="flex:1">Save location</button>'+
      '<button class="btn ghost" id="nlCancel">Discard</button></div></div>';
    panel.scrollIntoView({behavior:'smooth'});
    document.getElementById('nlCancel').onclick=()=>{ src.removeFeature(feature); panel.innerHTML=''; };
    document.getElementById('nlSave').onclick=()=>{
      const name=document.getElementById('nlName').value.trim();
      if(!name){ alert('Give the location a name.'); return; }
      const loc={id:uid(), name, code:document.getElementById('nlCode').value.trim(),
        locationType:document.getElementById('nlType').value,
        parentId:document.getElementById('nlParent').value||'', aliases:'', status:'ACTIVE', createdAt:today()};
      const geom={id:uid(), locationId:loc.id, layoutVerId:ver.id,
        geometry:JSON.parse(fmt.writeGeometry(feature.getGeometry(), geoOpts)),
        sourceType:'MANUAL', status:'CURRENT', validFrom:today(), at:new Date().toISOString(), by:raWho()};
      db.locations.push(loc); db.locGeoms.push(geom);
      feature.set('locationId',loc.id); feature.set('geomId',geom.id); feature.set('label',loc.code||loc.name);
      audit('location-created','location',loc.id,null,{name, layout:lay.id});
      save(); setTool('select'); selectLocation(loc.id,true);
    };
  }
  /* --- panel + chooser + search --- */
  function renderSpChooser(ids){
    document.getElementById('spPanel').innerHTML='<div class="card"><label style="margin-top:0">Which location?</label>'+
      ids.map(id=>'<div class="lrow" onclick="spSelectLocation(\''+id+'\')"><div><div class="l1">'+esc(locById(id)?locById(id).name:'?')+'</div>'+
      '<div class="l2">'+esc(locBreadcrumb(id))+'</div></div></div>').join('')+'</div>';
  }
  function renderSpPanel(locId){
    const panel=document.getElementById('spPanel');
    if(!locId){ panel.innerHTML='<p class="hint" style="margin-top:10px">Tap a shape to select its location'+(canRA()?', or use a draw tool to add one':'')+'.</p>'; return; }
    const l=locById(locId); if(!l){ panel.innerHTML=''; return; }
    const kids=locChildren(locId);
    const overlays=(SPX.overlays||[]).map(zid=>db.spatialZones.find(z=>z.id===zid)).filter(Boolean);
    panel.innerHTML='<div class="card"><label style="margin-top:0">'+esc(l.name)+' <span class="chip n">'+esc(l.locationType||'')+'</span></label>'+
      '<div class="hint">'+esc(locBreadcrumb(locId))+(l.code?' · code '+esc(l.code):'')+'</div>'+
      (kids.length?'<div style="margin-top:8px">'+kids.map(k=>'<span class="chip n" style="cursor:pointer" onclick="spSelectLocation(\''+k.id+'\')">'+esc(k.name)+'</span> ').join('')+'</div>':'')+
      (overlays.length?'<div style="margin-top:8px"><b style="font-size:12px">ACTIVE OVERLAYS</b><br>'+
        overlays.map(z=>'<span class="chip w">'+esc(z.name||z.zoneType)+'</span> ').join('')+'</div>':'')+
      '<p class="hint" style="margin-top:8px">Linked records (activities, permits, observations at this location) connect in the integration phase.</p>'+
      '<div class="btnrow">'+(canRA()?'<button class="btn ghost" onclick="location.hash=\'#/locations/'+l.id+'\'">Edit location</button>':'')+'</div></div>';
  }
  renderSpPanel(null);
  const qEl=document.getElementById('spQ'), qr=document.getElementById('spQr');
  qEl.oninput=()=>{
    const hits=searchLocations(qEl.value);
    qr.style.display=hits.length?'':'none';
    qr.innerHTML=hits.map(l=>'<div class="lrow" onclick="spSelectLocation(\''+l.id+'\');document.getElementById(\'spQr\').style.display=\'none\'">'+
      '<div><div class="l1">'+esc(l.name)+(l.code?' <span class="chip n">'+esc(l.code)+'</span>':'')+'</div>'+
      '<div class="l2">'+esc(locBreadcrumb(l.id))+'</div></div></div>').join('');
  };
}

/* ---- photo markup editor: draw on evidence photos before saving ---- */
let MK=null;
function openMarkup(imgEl){
  const base=new Image();
  base.onload=()=>{
    const maxW=1600, sc=Math.min(1,maxW/base.width);
    const W=Math.round(base.width*sc), H=Math.round(base.height*sc);
    const wrap=document.createElement('div'); wrap.className='mkwrap';
    wrap.innerHTML='<div class="mkbar">'+
      '<button class="mkt on" data-mk="pen">Pen</button>'+
      '<button class="mkt" data-mk="arrow">Arrow</button>'+
      '<button class="mkt" data-mk="circle">Circle</button>'+
      '<span class="mkc on" data-mc="#e11b12" style="background:#e11b12"></span>'+
      '<span class="mkc" data-mc="#ffd23d" style="background:#ffd23d"></span>'+
      '<span class="mkc" data-mc="#ffffff" style="background:#fff"></span>'+
      '<button class="mkt" id="mkUndo" style="margin-left:auto">Undo</button>'+
      '<button class="mkt" id="mkCancel">Cancel</button>'+
      '<button class="mkt mksave" id="mkSave">Save</button></div>'+
      '<div class="mkcv"><canvas width="'+W+'" height="'+H+'"></canvas></div>';
    document.body.appendChild(wrap);
    const cv=wrap.querySelector('canvas'), ctx=cv.getContext('2d');
    MK={tool:'pen', color:'#e11b12', strokes:[], cur:null};
    const lw=Math.max(4, Math.round(W/200));
    function drawStroke(s){
      ctx.strokeStyle=s.color; ctx.lineWidth=lw; ctx.lineCap='round'; ctx.lineJoin='round';
      if(s.tool==='pen'&&s.pts.length>1){
        ctx.beginPath(); ctx.moveTo(s.pts[0][0],s.pts[0][1]);
        s.pts.forEach(p=>ctx.lineTo(p[0],p[1])); ctx.stroke();
      }
      if(s.tool==='arrow'&&s.pts.length===2){
        const [a,b]=s.pts, ang=Math.atan2(b[1]-a[1],b[0]-a[0]), hl=lw*4;
        ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(b[0],b[1]);
        ctx.lineTo(b[0]-hl*Math.cos(ang-0.45), b[1]-hl*Math.sin(ang-0.45));
        ctx.moveTo(b[0],b[1]);
        ctx.lineTo(b[0]-hl*Math.cos(ang+0.45), b[1]-hl*Math.sin(ang+0.45)); ctx.stroke();
      }
      if(s.tool==='circle'&&s.pts.length===2){
        const [a,b]=s.pts;
        ctx.beginPath();
        ctx.ellipse((a[0]+b[0])/2,(a[1]+b[1])/2, Math.abs(b[0]-a[0])/2||1, Math.abs(b[1]-a[1])/2||1, 0, 0, Math.PI*2);
        ctx.stroke();
      }
    }
    function redraw(){
      ctx.drawImage(base,0,0,W,H);
      MK.strokes.forEach(drawStroke);
      if(MK.cur) drawStroke(MK.cur);
    }
    redraw();
    const pos=e=>{ const r=cv.getBoundingClientRect();
      return [(e.clientX-r.left)*W/r.width, (e.clientY-r.top)*H/r.height]; };
    cv.addEventListener('pointerdown',e=>{ e.preventDefault(); cv.setPointerCapture(e.pointerId);
      const p=pos(e);
      MK.cur=MK.tool==='pen'?{tool:'pen',color:MK.color,pts:[p]}:{tool:MK.tool,color:MK.color,pts:[p,p]}; });
    cv.addEventListener('pointermove',e=>{ if(!MK.cur) return; e.preventDefault();
      const p=pos(e);
      if(MK.tool==='pen') MK.cur.pts.push(p); else MK.cur.pts[1]=p;
      redraw(); });
    cv.addEventListener('pointerup',()=>{ if(MK.cur){ MK.strokes.push(MK.cur); MK.cur=null; redraw(); } });
    wrap.querySelectorAll('[data-mk]').forEach(b=>b.onclick=()=>{ MK.tool=b.dataset.mk;
      wrap.querySelectorAll('[data-mk]').forEach(x=>x.classList.toggle('on',x===b)); });
    wrap.querySelectorAll('[data-mc]').forEach(b=>b.onclick=()=>{ MK.color=b.dataset.mc;
      wrap.querySelectorAll('[data-mc]').forEach(x=>x.classList.toggle('on',x===b)); });
    wrap.querySelector('#mkUndo').onclick=()=>{ MK.strokes.pop(); redraw(); };
    wrap.querySelector('#mkCancel').onclick=()=>wrap.remove();
    wrap.querySelector('#mkSave').onclick=()=>{
      imgEl.src=cv.toDataURL('image/jpeg',0.8);
      wrap.remove(); toast('Markup saved onto the photo');
    };
  };
  base.src=imgEl.src;
}

/* ---- signatures: SS679 auditor — get a signature from the person ---- */
function sigWire(cv){
  const dpr=Math.min(2,window.devicePixelRatio||1);
  const w=cv.clientWidth||300, h=cv.clientHeight||140;
  cv.width=w*dpr; cv.height=h*dpr;
  const ctx=cv.getContext('2d');
  ctx.scale(dpr,dpr); ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h);
  ctx.strokeStyle='#16305c'; ctx.lineWidth=2.2; ctx.lineCap='round'; ctx.lineJoin='round';
  let draw=false, drawn=false, px=0, py=0;
  const pos=e=>{ const r=cv.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; };
  cv.addEventListener('pointerdown',e=>{ e.preventDefault(); try{ cv.setPointerCapture(e.pointerId); }catch(err){} draw=true; const xy=pos(e); px=xy[0]; py=xy[1]; });
  cv.addEventListener('pointermove',e=>{ if(!draw) return; e.preventDefault(); const xy=pos(e);
    ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(xy[0],xy[1]); ctx.stroke(); px=xy[0]; py=xy[1]; drawn=true; });
  ['pointerup','pointercancel'].forEach(ev=>cv.addEventListener(ev,()=>{ draw=false; }));
  return { drawn:()=>drawn,
    clear(){ ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h); drawn=false; },
    data(){ const sc=document.createElement('canvas'); sc.width=Math.round(w*0.75); sc.height=Math.round(h*0.75);
      const c2=sc.getContext('2d'); c2.fillStyle='#fff'; c2.fillRect(0,0,sc.width,sc.height);
      c2.drawImage(cv,0,0,sc.width,sc.height);
      return sc.toDataURL('image/jpeg',0.7); } };
}

/* extra check lines drawn from this activity's own approved RA controls */
function lmraRaChecks(waId){
  const wa=db.workActivities.find(w=>w.id===waId); if(!wa) return [];
  if(typeof waPinnedRaItems!=='function') return [];
  const out=[];
  waPinnedRaItems(wa).slice(0,6).forEach(x=>{
    const ctl=[].concat(x.item.controls||[],x.item.addControls||[]).filter(Boolean);
    if(ctl.length) out.push({hazard:x.item.hazard||'', text:ctl.slice(0,2).join('; ')});
  });
  return out;
}
function lmraAllQs(waId){
  return lmraBaseQs().concat(lmraRaChecks(waId).map(r=>'RA control \u2014 '+r.text+(r.hazard?' (for: '+r.hazard+')':'')));
}

    box.innerHTML='<div class="empty">Sign in to browse the Report Library. Reports generated while signed out download to this device only.</div>';
    return;
  }

    box.innerHTML='<div class="empty">The Report Library is available to the main contractor’s team.</div>';
    return;
  }
  const pid=repoKeySafe(db.settings.project||root.cur||'Project');
  let html='';
  for(const cat of REPORT_CATS){
    try{
      const {data,error}=await SB.client.storage.from('reports')
        .list(pid+'/'+repoKeySafe(cat), {limit:200, sortBy:{column:'name', order:'desc'}});
      if(error||!data||!data.length) continue;
      html+='<h2 class="sect">'+esc(cat)+'</h2>'+data.filter(f=>f.id||f.metadata).map(f=>{
        const kb=f.metadata&&f.metadata.size?Math.max(1,Math.round(f.metadata.size/1024)):'';
        return '<button class="pick repo-item" data-key="'+esc(pid+'/'+repoKeySafe(cat)+'/'+f.name)+'" '+
          'style="display:flex;width:100%;text-align:left;align-items:center;gap:10px;margin-bottom:6px">'+
          ic(/\.csv$/i.test(f.name)?'stats':'doc')+
          '<span style="flex:1;min-width:0"><span style="display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(f.name)+'</span>'+
          '<span class="hint">'+(f.created_at?fmtD(f.created_at.slice(0,10)):'')+(kb?' · '+kb+' KB':'')+'</span></span>'+
          ic('dl')+'</button>';
      }).join('');
    }catch(e){ /* category folder may not exist yet */ }
  }
  box.innerHTML=html||'<div class="empty">Nothing in transit — everything has been carried into OneDrive.</div>';
  box.querySelectorAll('.repo-item').forEach(b=>b.onclick=async()=>{
    b.disabled=true;
    try{
      const {data,error}=await SB.client.storage.from('reports').createSignedUrl(b.dataset.key, 3600, {download:true});
      if(error||!data){ toast('Could not open that report', true); return; }
      window.open(data.signedUrl, '_blank');
    }finally{ b.disabled=false; }
  });
}

/* ---- subcontractor scorecard (company level) ---- */
function subconScorecard(){
  const yr=String(new Date().getFullYear());
  const names=[...new Set(db.organisations.filter(o=>o.type==='subcon').map(o=>o.name)
    .concat(db.members.map(m=>m.company||'')))].map(n=>n.trim()).filter(n=>n&&!/^kkl/i.test(n));
  return names.map(n=>{
    const L=n.toLowerCase();
    const workers=db.members.filter(m=>(m.company||'').trim().toLowerCase()===L&&m.status!=='INACTIVE'&&!m.mergedInto);
    let sic=0;
    workers.forEach(m=>{ if(root.projects.some(p=>(p.workerProjectAccess||[]).some(a=>a.memberId===m.id&&a.sicStatus==='COMPLETE'))) sic++; });
    let obs=0, defx=0, inc=0;
    root.projects.forEach(p=>{
      obs+=(p.observations||[]).filter(o=>(o.subcon||'').trim().toLowerCase()===L&&o.status!=='Closed').length;
      defx+=(p.defects||[]).filter(o=>(o.subcon||'').trim().toLowerCase()===L&&o.status!=='Closed').length;
      inc+=(p.incidents||[]).filter(i=>(i.subcon||'').trim().toLowerCase()===L&&(i.date||'').slice(0,4)===yr).length;
    });
    return {n, workers:workers.length, sic, obs, defx, inc};
  }).filter(r=>r.workers||r.obs||r.defx||r.inc)
    .sort((a,b)=>(b.obs+b.defx+b.inc)-(a.obs+a.defx+a.inc));
}
function subconScorecardHtml(){
  const rows=subconScorecard();
  if(!rows.length) return '';
  return '<h2 class="sect">Subcontractor scorecard</h2>'+
    '<div style="overflow-x:auto"><table class="mxt" style="min-width:520px"><tr>'+
    '<th style="text-align:left">Company</th><th>Workers</th><th>SIC %</th><th>Open obs</th><th>Open defects</th><th>Incidents '+new Date().getFullYear()+'</th></tr>'+
    rows.map(r=>'<tr style="cursor:default"><td style="text-align:left">'+esc(r.n)+'</td><td>'+r.workers+'</td>'+
      '<td>'+(r.workers?Math.round(100*r.sic/r.workers)+'%':'—')+'</td>'+
      '<td'+(r.obs?' style="color:#b76e00;font-weight:700"':'')+'>'+r.obs+'</td>'+
      '<td'+(r.defx?' style="color:#b76e00;font-weight:700"':'')+'>'+r.defx+'</td>'+
      '<td'+(r.inc?' style="color:#c5221f;font-weight:700"':'')+'>'+r.inc+'</td></tr>').join('')+'</table></div>';
}

/* which modules remember field values / offer copy-last (assigned post-hoc so
   the module registry itself stays untouched) */
(function(){
  const MEMF={observations:['initiator'], inspections:['inspector','type'], checklists:['inspector','template'],
    meetings:['chairman','venue'], visitors:['host','company'], training:['provider'],
    workerCompetencies:['issuer'], tbm:['conductor','area'], materialRequests:['requestedBy','supplier']};
  Object.keys(MEMF).forEach(k=>{ const m=MODULES[k]; if(!m) return;
    m.fields.forEach(f=>{ if(MEMF[k].includes(f.k)) f.mem=1; }); });
  ['checklists','inspections','tbm','meetings','workActivities','visitors','training','observations','materialRequests']
    .forEach(k=>{ if(MODULES[k]) MODULES[k].copyLast=1; });
})();

let DIA={date:today()};

function diaryShift(days){
  const dt=new Date(DIA.date+'T00:00'); dt.setDate(dt.getDate()+days);
  DIA.date=isoLocal(dt); renderDiary();

function diaryData(d){
  const tbms=db.tbm.filter(t=>t.date===d);
  const ids=new Set(); const byCo={};
  tbms.forEach(t=>{ (t.checkins||[]).forEach(c=>{ if(c.memberId&&!ids.has(c.memberId)){ ids.add(c.memberId);
      const co=c.company||'—'; byCo[co]=(byCo[co]||0)+1; } });
    (t.attendees||[]).forEach(id=>{ if(!ids.has(id)){ ids.add(id);
      const m=db.members.find(x=>x.id===id); const co=(m&&m.company)||'—'; byCo[co]=(byCo[co]||0)+1; } }); });
  return {

/* ---- optional TOTP two-factor authentication (Supabase MFA) ---- */
async function mfaRefresh(){
  const wrap=document.getElementById('mfaWrap'), box=document.getElementById('mfaBox'), btn=document.getElementById('mfaBtn');
  if(!wrap||!SB.client||!SB.profile) return;
  wrap.style.display='';
  try{
    const {data,error}=await SB.client.auth.mfa.listFactors();
    if(error) throw error;
    const f=((data&&data.totp)||[]).find(x=>x.status==='verified');
    box.textContent=f?'Enabled — a 6-digit authenticator code is required at sign-in on any device.'
                     :'Not enabled. Adds a 6-digit code from an authenticator app (Google Authenticator, Authy) at sign-in.';
    btn.style.display=''; btn.textContent=f?'Disable 2FA':'Enable 2FA';
    btn.className=f?'btn danger':'btn ghost';
    btn.onclick=f?()=>mfaDisable(f.id):mfaEnroll;
  }catch(e){ box.textContent='2FA not available: '+(e.message||e); }
}
async function mfaEnroll(){
  try{
    const {data,error}=await SB.client.auth.mfa.enroll({factorType:'totp'});
    if(error) throw error;
    const fid=data.id, uri=data.totp.uri;
    await loadQrLib();
    const box=document.getElementById('mfaBox');
    box.innerHTML='<div style="background:#fff;padding:10px;display:inline-block;border-radius:6px" id="mfaQr"></div>'+
      '<div class="hint" style="margin:8px 0">Scan with your authenticator app, then enter the 6-digit code:</div>'+
      '<div class="btnrow"><input id="mfaCode" inputmode="numeric" maxlength="6" placeholder="000000" style="max-width:140px">'+
      '<button class="btn" id="mfaVerify">Verify</button></div>';
    new QRCode(document.getElementById('mfaQr'),{text:uri,width:150,height:150,correctLevel:QRCode.CorrectLevel.M});
    document.getElementById('mfaVerify').onclick=async()=>{
      const code=(document.getElementById('mfaCode').value||'').trim();
      if(code.length!==6) return;
      const ch=await SB.client.auth.mfa.challenge({factorId:fid});
      if(ch.error){ alert(ch.error.message); return; }
      const vr=await SB.client.auth.mfa.verify({factorId:fid, challengeId:ch.data.id, code});
      if(vr.error){ alert('Wrong code — try again.'); return; }
      audit('mfa-enabled','profile',SB.profile.id,null,null); save();
      toast('Two-factor authentication enabled');
      mfaRefresh();
    };
  }catch(e){ alert('Could not start 2FA: '+(e.message||e)); }
}
async function mfaDisable(fid){
  if(!confirm('Disable two-factor authentication for your account?')) return;
  const {error}=await SB.client.auth.mfa.unenroll({factorId:fid});
  if(error){ alert(error.message); return; }
  audit('mfa-disabled','profile',SB.profile.id,null,null); save();
  toast('2FA disabled');
  mfaRefresh();
}
async function mfaGate(){
  try{
    const {data:aal}=await SB.client.auth.mfa.getAuthenticatorAssuranceLevel();
    if(!aal||aal.nextLevel!=='aal2'||aal.nextLevel===aal.currentLevel) return;
    const {data:fs}=await SB.client.auth.mfa.listFactors();
    const f=((fs&&fs.totp)||[]).find(x=>x.status==='verified');
    if(!f) return;
    for(;;){
      const code=prompt('Two-factor authentication — enter the 6-digit code from your authenticator app:');
      if(code===null){ try{ await SB.client.auth.signOut(); }catch(e){} throw new Error('2FA code required to sign in.'); }
      const ch=await SB.client.auth.mfa.challenge({factorId:f.id});
      if(ch.error){ alert(ch.error.message); continue; }
      const vr=await SB.client.auth.mfa.verify({factorId:f.id, challengeId:ch.data.id, code:code.trim()});
      if(!vr.error) return;
      alert('Wrong code — try again.');
    }
  }catch(e){
    if(String(e&&e.message).includes('2FA')) throw e;
    /* MFA API unavailable -> fail open on the gate, factor list was empty */
  }
}

/* ---- ambient stamps: last known GPS fix + NEA weather, attached to records ---- */
let GEO_LAST=null, WX_LAST=null;
function geoCapture(){
  if(!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(
    p=>{ GEO_LAST={lat:+p.coords.latitude.toFixed(6), lng:+p.coords.longitude.toFixed(6), at:Date.now()}; },
    ()=>{}, {maximumAge:300000, timeout:8000, enableHighAccuracy:false});
}
function geoStamp(){ return (GEO_LAST&&Date.now()-GEO_LAST.at<10*60e3)?{lat:GEO_LAST.lat,lng:GEO_LAST.lng}:null; }
function wxRefresh(){ tbxWeather().then(w=>{ if(w&&w.line) WX_LAST={line:w.line, at:Date.now()}; }).catch(()=>{}); }
function wxStamp(){ return (WX_LAST&&Date.now()-WX_LAST.at<2*3600e3)?WX_LAST.line:''; }

/* ---- deterministic Project Safety Score (leading indicators, transparent) ---- */
function projectSafetyScore(){
  const parts=[]; const add=(label,pts,max,note)=>parts.push({label,pts:Math.round(pts),max,note});
  const activeWAs=db.workActivities.filter(w=>w.status==='Active');
  /* toolbox coverage of active work today */
  const tbToday=activeWAs.filter(w=>db.tbm.some(t=>t.waId===w.id&&t.date===today())).length;
  add('Toolbox coverage today', activeWAs.length?20*tbToday/activeWAs.length:20, 20,
      activeWAs.length?tbToday+'/'+activeWAs.length+' active activities briefed':'no active activities');
  /* LMRA practice */
  const lmToday=activeWAs.filter(w=>db.lmra.some(l=>l.waId===w.id&&l.date===today())).length;
  add('LMRA practice', activeWAs.length?15*lmToday/activeWAs.length:15, 15,
      activeWAs.length?lmToday+'/'+activeWAs.length+' activities checked':'—');
  /* blocked work */
  const blocked=activeWAs.filter(w=>(w.readiness||{}).status==='BLOCKED').length;
  add('No blocked work', Math.max(0,15-8*blocked), 15, blocked+' blocked activit'+(blocked===1?'y':'ies'));
  /* action discipline */
  const acts=allOpenActions(); const over=acts.filter(a=>a.days!==null&&a.days<0).length;
  add('Action discipline', acts.length?Math.max(0,15*(1-over/Math.max(acts.length,1))-(over?2:0)):15, 15,
      over+' overdue of '+acts.length+' open');
  /* workforce compliance on site */
  const ids=projectMemberIds();
  const site=[...ids].map(id=>db.members.find(m=>m.id===id)).filter(Boolean).filter(m=>m.status!=='INACTIVE');
  const expired=site.filter(m=>memberAllCerts(m).concat(m.wpExpiry?[{expiry:m.wpExpiry}]:[]).some(c=>{const d=c.expiry?daysTo(c.expiry):null; return d!==null&&d<0;})).length;
  add('Workforce compliance', site.length?Math.max(0,15*(1-expired/site.length)):15, 15,
      expired+'/'+(site.length||0)+' site workers with an expired cert/pass');
  /* inspections cadence (7 days) */
  const wk=new Date(); wk.setDate(wk.getDate()-7); const wkIso=isoLocal(wk);
  const insp7=db.inspections.filter(x=>(x.date||'')>=wkIso).length+db.checklists.filter(x=>(x.date||'')>=wkIso).length;
  add('Inspection cadence (7d)', Math.min(10, insp7*2.5), 10, insp7+' inspections/checks this week');
  /* incident-free (30 days) */
  const mo=new Date(); mo.setDate(mo.getDate()-30); const moIso=isoLocal(mo);
  const inc30=db.incidents.filter(i=>(i.date||'')>=moIso).length;
  add('Incident-free 30d', Math.max(0,10-5*inc30), 10, inc30+' incident(s) in 30 days');
  const score=Math.round(parts.reduce((s,x)=>s+x.pts,0));
  const grade=score>=85?'A':score>=70?'B':score>=55?'C':score>=40?'D':'E';
  return {score, grade, parts};
}

}

/* ---- Attention service: one deterministic feed, deduped, severity-ranked ---- */
function attentionItems(){
  const out=[]; const seen=new Set();
  const add=(sev,src,type,id,title,why,link)=>{
    const k=src+'|'+id+'|'+title.slice(0,30);
    if(seen.has(k)) return; seen.add(k);
    out.push({sev,src,type,id,title,why,link});
  };
  db.workActivities.filter(w=>w.status==='Active').forEach(w=>{
    const r=w.readiness||{};
    if(r.status==='BLOCKED') add('CRITICAL','readiness','wa',w.id,(w.title||w.type||'Activity')+' is BLOCKED',
      (r.results||[]).filter(x=>x.status==='BLOCK').map(x=>x.title).slice(0,2).join('; ')||'Blocking rule failed','#/work/'+w.id);
  });
  db.lmra.filter(l=>l.safe==='STOP'&&l.resolved!=='Resolved').forEach(l=>{
    const w=db.workActivities.find(x=>x.id===l.waId);
    add('CRITICAL','lmra','wa',l.waId,'STOP WORK — '+esc(w?(w.title||w.type):'activity'),
      (l.hazard||'Raised at last-minute check')+' ('+esc(l.by||'')+')','#/lmra');
  });
  db.checklists.filter(c=>c.date===today()&&c.result==='Fail').forEach(c=>
    add('CRITICAL','prestart','equipment',c.equipmentId||c.id,'Failed pre-start: '+(c.area||c.template||''),
      'Logged today'+(c.inspector?' by '+c.inspector:''), c.equipmentId?'#/eq/'+c.equipmentId:'#/checklists/'+c.id));
  db.incidents.filter(i=>i.status!=='Closed').forEach(i=>{
    add('CRITICAL','incident','incident',i.id,(i.type||'Incident')+' open', fmtD(i.date)+(i.location?' · '+i.location:''), '#/incidents/'+i.id);
    const dl=incidentMomDeadline(i);
    if(dl) add((daysTo(dl)??9)<=3?'CRITICAL':'WARNING','ireport','incident',i.id,
      'MOM iReport due '+fmtD(dl), 'File via MyMOM Portal, then record the reference', '#/incidents/'+i.id);
  });
  const over=allOpenActions().filter(a=>a.days!==null&&a.days<0);
  if(over.length) add(over.length>5?'CRITICAL':'WARNING','actions','actions','all',
    over.length+' corrective action(s) overdue','Oldest: '+String(over[0].label||'').slice(0,60),'#/actions');
  const subs=db.workerProjectAccess.filter(a=>a.sicStatus==='SUBMITTED');
  if(subs.length) add('WARNING','sic','sic','subs',subs.length+' SIC submission(s) awaiting review',
    subs.slice(0,3).map(a=>a.memberName).join(', '),'#/sic');
  db.reviewTriggers.filter(r=>r.status!=='CLOSED'&&r.status!=='Closed').slice(0,5).forEach(r=>
    add('WARNING','ra','ra',r.id,'RA review: '+(r.reason||r.type||'trigger'),(r.detail||'').slice(0,80),'#/rareviews'));
  const ids=projectMemberIds();
  const expOnSite=[...ids].map(x=>db.members.find(m=>m.id===x)).filter(Boolean)
    .filter(m=>m.status!=='INACTIVE'&&memberAllCerts(m).concat(m.wpExpiry?[{expiry:m.wpExpiry}]:[])
      .some(c=>{const d=c.expiry?daysTo(c.expiry):null; return d!==null&&d<0;}));
  if(expOnSite.length) add('WARNING','certs','matrix','site',
    expOnSite.length+' site worker(s) with an expired cert/pass', expOnSite.slice(0,3).map(m=>m.name).join(', '),'#/matrix');
  db.materialRequests.filter(m=>m.status!=='Delivered'&&m.status!=='Rejected'&&m.neededBy&&(daysTo(m.neededBy)??1)<0)
    .forEach(m=>add('WARNING','material','material',m.id,'Material late: '+(((m.items||[])[0]||{}).desc||'request'),
      'Needed '+fmtD(m.neededBy)+' · '+(m.status||''),'#/materialRequests/'+m.id));
  db.organisations.forEach(o=>{ const d=checksafeDue(o);
    if(d&&(daysTo(d)??1)<=0) add('INFO','checksafe','org',o.id,'CheckSafe vetting due: '+o.name,
      o.checksafeDate?('last checked '+fmtD(o.checksafeDate)):'never checked','#/organisations/'+o.id); });
  const rank={CRITICAL:0,WARNING:1,INFO:2};
  return out.sort((a,b2)=>rank[a.sev]-rank[b2.sev]);
}
function attentionCopyText(){
  const items=attentionItems();
  const s=projectSafetyScore();
  return 'KKL CMS — attention snapshot, '+(db.settings.project||'')+', '+today()+'\n'+
    'Safety score: '+s.score+'/100 ('+s.grade+')\n\n'+
    (items.length?items.map((x,i)=>(i+1)+'. ['+x.sev+'] '+x.title+' — '+x.why).join('\n'):'No open attention items.')+
    '\n\n(Structured export for AI review — every line derives from live records.)';
}

/* ---- global search (all data is local; instant) ---- */
function globalSearch(q){
  q=String(q||'').trim().toLowerCase();
  if(q.length<2) return [];
  const R=[]; const push=(type,id,l1,l2)=>R.push({type,id,l1,l2});
  const has=v=>String(v||'').toLowerCase().includes(q);
  db.members.filter(m=>!m.mergedInto&&(has(m.name)||has(m.wid))).slice(0,5)
    .forEach(m=>push('member',m.id,memberLabel(m),[m.company,m.trade].filter(Boolean).join(' · ')));
  db.equipment.filter(e=>has(e.regNo)||has(e.type)).slice(0,4)
    .forEach(e=>push('equipment',e.id,[e.type,e.regNo].filter(Boolean).join(' '),e.owner||''));
  db.locations.filter(l=>l.status!=='ARCHIVED'&&(has(l.name)||has(l.code)||has(l.aliases))).slice(0,4)
    .forEach(l=>push('location',l.id,l.name,locBreadcrumb(l.id)));
  db.workActivities.filter(w=>has(w.title)||has(w.type)||has(w.ptw)).slice(0,4)
    .forEach(w=>push('wa',w.id,w.title||w.type,[(w.readiness||{}).status,w.location].filter(Boolean).join(' · ')));
  db.observations.filter(o=>has(o.desc)||has(o.category)).slice(0,3)
    .forEach(o=>push('observation',o.id,(o.category||'Near miss / unsafe'),fmtD(o.date)+' · '+(o.status||'')));
  db.incidents.filter(i=>has(i.desc)||has(i.type)).slice(0,3)
    .forEach(i=>push('incident',i.id,i.type||'Incident',fmtD(i.date)));
  db.raAdoptions.filter(r=>has(r.title)).slice(0,3)
    .forEach(r=>R.push({type:'link',id:'#/rasys/'+r.id,l1:r.title,l2:'RA/SWP '+(r.currentRev||'')}));
  return R.slice(0,15);
}
function bindGlobalSearch(){
  const g=document.getElementById('gsearch'), dd=document.getElementById('gsearchDD');
  if(!g||g._bound) return; g._bound=true;
  g.oninput=()=>{
    const hits=globalSearch(g.value);
    dd.style.display=hits.length?'':'none';
    dd.innerHTML=hits.map((h,i)=>'<div class="lrow" data-gs="'+i+'"><div><div class="l1">'+esc(h.l1)+'</div>'+
      '<div class="l2">'+esc(h.type==='link'?h.l2:(h.type+' · '+h.l2))+'</div></div></div>').join('');
    dd.querySelectorAll('[data-gs]').forEach(row=>row.onclick=()=>{
      const h=hits[+row.dataset.gs];
      dd.style.display='none'; g.value='';
      if(h.type==='link') location.hash=h.id; else openContext(h.type,h.id);
    });
  };
  g.onkeydown=e=>{ if(e.key==='Escape'){ dd.style.display='none'; g.blur(); } };
  document.addEventListener('click',e=>{ if(!e.target.closest('.gsearch-wrap')) dd.style.display='none'; });
}

let pushTimer=null;
function schedulePush(){
  if(!SB.client||!SB.profile) return;
  clearTimeout(pushTimer);
  pushTimer=setTimeout(()=>pushNow().catch(e=>{
    console.warn('push',e);
    sbSetStatus('err','Could not sync latest change ('+esc(e.message||'network')+') — kept locally, will retry.');
  }), 1500);
}
async function pushNow(){
  if(!SB.client||!SB.profile||SB.busy) return;
  SB.busy=true;
  try{
    const pushed=JSON.parse(localStorage.getItem(SB.hashKey)||'{}');
    const rows=rowsFromRoot(), up=[], seen={};
    rows.forEach(r=>{
      const k=r.project_id+'|'+r.store+'|'+r.id, h=hashStr(JSON.stringify(r.data));
      seen[k]=h;
      if(pushed[k]!==h) up.push({id:r.id, project_id:r.project_id, store:r.store, data:r.data, deleted:false});
    });
    Object.keys(pushed).forEach(k=>{
      if(!(k in seen)){
        const i1=k.indexOf('|'), i2=k.indexOf('|',i1+1);
        up.push({id:k.slice(i2+1), project_id:k.slice(0,i1), store:k.slice(i1+1,i2), data:{}, deleted:true});
      }
    });
    for(let i=0;i<up.length;i+=100){
      const chunk=up.slice(i,i+100).map(r=>({...r, org_id:SB.profile.org_id, updated_by:SB.profile.id}));
      const {error}=await SB.client.from('records').upsert(chunk);
      if(error) throw error;
    }
    localStorage.setItem(SB.hashKey, JSON.stringify(seen));
    if(up.length) sbSetStatus('ok','Synced '+up.length+' change(s) · '+new Date().toLocaleTimeString());
  }finally{ SB.busy=false; }
}
function localHashOf(project_id, store, id){
  if(project_id==='_company'){
    if(store==='_meta') return hashStr(JSON.stringify({name:root.company.name||''}));
    const rec=(root.company[store]||[]).find(x=>x.id===id);
    return rec?hashStr(JSON.stringify(rec)):null;
  }
  const p=root.projects.find(x=>x.id===project_id);
  if(!p) return null;
  if(store==='_project') return hashStr(JSON.stringify({settings:p.settings, manhours:p.manhours, mandays:p.mandays}));
  const rec=(p[store]||[]).find(x=>x.id===id);
  return rec?hashStr(JSON.stringify(rec)):null;
}
function applyRemote(r, pushed){
  const k=r.project_id+'|'+r.store+'|'+r.id;
  const localH=localHashOf(r.project_id, r.store, r.id);
  if(pushed[k]!==undefined && localH!==null && localH!==pushed[k]) return false; /* local unpushed edit wins */
  const remoteH=hashStr(JSON.stringify(r.data||{}));
  if(r.project_id==='_company'){
    if(r.store==='_meta'){ if(!r.deleted){ root.company.name=(r.data&&r.data.name)||''; pushed[k]=remoteH; } return true; }
    if(!COMPANY_STORES.includes(r.store)) return false;
    const arr=root.company[r.store];
    const i=arr.findIndex(x=>x.id===r.id);
    if(r.deleted){ if(i>=0) arr.splice(i,1); delete pushed[k]; return i>=0; }
    if(i>=0) arr[i]=r.data; else arr.push(r.data);
    pushed[k]=remoteH; return true;
  }
  let p=root.projects.find(x=>x.id===r.project_id);
  if(r.store==='_project'){
    if(r.deleted){
      if(p && root.projects.length>1){ root.projects=root.projects.filter(x=>x.id!==p.id);
        if(root.cur===r.project_id) root.cur=root.projects[0].id; }
      delete pushed[k]; return !!p;
    }
    if(!p){ p=blankProject(''); p.id=r.project_id; root.projects.push(p); }
    if(r.data.settings) p.settings=r.data.settings;
    if(r.data.manhours) p.manhours=r.data.manhours;
    if(r.data.mandays) p.mandays=r.data.mandays;
    pushed[k]=remoteH; return true;
  }
  if(!PROJECT_STORES.includes(r.store)) return false;
  if(!p){ if(r.deleted) return false; p=blankProject(''); p.id=r.project_id; root.projects.push(p); }
  const arr=p[r.store];
  const i=arr.findIndex(x=>x.id===r.id);
  if(r.deleted){ if(i>=0) arr.splice(i,1); delete pushed[k]; return i>=0; }
  if(i>=0) arr[i]=r.data; else arr.push(r.data);
  pushed[k]=remoteH; return true;
}
async function pullNow(){
  if(!SB.client||!SB.profile) return;
  const last=localStorage.getItem(SB.syncKey)||'1970-01-01T00:00:00Z';
  /* gte + overlap, NOT gt: bulk writes share one updated_at, and a gt cursor
     silently skips the rest of an equal-timestamp group at a page boundary
     (lost ~100 imported workers). Re-applying overlap rows is idempotent. */
  let from=last, changed=false, guard=0;
  const pushed=JSON.parse(localStorage.getItem(SB.hashKey)||'{}');
  const applyPage=data=>{
    data.forEach(r=>{ try{ if(applyRemote(r,pushed)) changed=true; }catch(e){ console.warn('apply',r.store,r.id,e); } });
  };
  while(guard++<60){
    const {data,error}=await SB.client.from('records')
      .select('id,project_id,store,data,deleted,updated_at')
      .gte('updated_at',from)
      .order('updated_at',{ascending:true}).order('id',{ascending:true})
      .limit(500);
    if(error) throw error;
    if(!data||!data.length) break;
    applyPage(data);
    const newFrom=data[data.length-1].updated_at;
    if(data.length<500){ from=newFrom; break; }
    if(newFrom===from){
      /* a single timestamp spans beyond one page: drain it by offset, then step past */
      let off=500;
      for(let g2=0; g2<40; g2++){
        const {data:more,error:e2}=await SB.client.from('records')
          .select('id,project_id,store,data,deleted,updated_at')
          .eq('updated_at',from).order('id',{ascending:true}).range(off,off+499);
        if(e2) throw e2;
        if(!more||!more.length) break;
        applyPage(more);
        if(more.length<500) break;
        off+=500;
      }
      const {data:next}=await SB.client.from('records')
        .select('updated_at').gt('updated_at',from)
        .order('updated_at',{ascending:true}).limit(1);
      if(!next||!next.length){ break; }
      from=next[0].updated_at;
    }else{
      from=newFrom;
    }
  }
  localStorage.setItem(SB.hashKey, JSON.stringify(pushed));
  if(from!==last) localStorage.setItem(SB.syncKey, from);
  if(changed){
    if(!root.projects.some(p=>p.id===root.cur)) root.cur=root.projects[0].id;
    localStorage.setItem(KEY2, JSON.stringify(root));
    EV.emit('sync:applied',{});
    if(!curEdit){
      const y=window.scrollY;            /* background refresh must not yank the page */
      window._keepScroll=true;
      route();
      window.scrollTo(0,y);
    }
  }
}
function pushResetLocal(){ localStorage.removeItem(SB.hashKey); localStorage.removeItem(SB.syncKey); }
function sbConnectLink(){
  const cfg=sbCfg(); if(!cfg) return '';
  const b64=btoa(JSON.stringify({url:cfg.url,anon:cfg.anon})).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  return location.origin+location.pathname+'#/connect/'+b64;
}
function sbBindSettings(){
  const cfg=sbCfg();
  const cfgWrap=document.getElementById('sbCfgWrap'), loginWrap=document.getElementById('sbLoginWrap');
  const main=document.getElementById('sbMain'), out=document.getElementById('sbOut'), push=document.getElementById('sbPush');
  const lnk=document.getElementById('sbLink');
  if(cfg && lnk){ lnk.style.display='';
    lnk.onclick=()=>{ navigator.clipboard.writeText(sbConnectLink()).then(()=>toast('Connect link copied — send it to teammates; they tap it, then sign in.'))
      .catch(()=>prompt('Copy this link:', sbConnectLink())); }; }
  sbSetStatus(SB.status, SB.statusMsg||'&hellip;');
  if(!cfg){
    cfgWrap.style.display=''; loginWrap.style.display='none';
    main.textContent='Save connection';
    sbSetStatus('off','<b>Not configured</b> — data stays on this device only.');
    main.onclick=()=>{
      const url=document.getElementById('sbUrl').value.trim().replace(/\/+$/,'');
      const anon=document.getElementById('sbAnon').value.trim();
      if(!/^https:\/\/.+\.supabase\.co$/.test(url)){ alert('That does not look like a Supabase project URL (https://xxxx.supabase.co).'); return; }
      if(anon.length<80){ alert('That does not look like the anon public key — copy it from Supabase → Settings → API.'); return; }
      localStorage.setItem(SB.cfgKey, JSON.stringify({url,anon}));
      syncInit().then(()=>renderSettings());
    };
    return;
  }
  cfgWrap.style.display='none';
  if(!SB.profile){
    loginWrap.style.display='';
    main.textContent='Sign in';
    main.onclick=async()=>{
      const email=document.getElementById('sbEmail').value.trim(), pw=document.getElementById('sbPass').value;
      if(!email||!pw) return;
      main.disabled=true;
      try{
        await sbLoadLib();
        if(!SB.client) SB.client=window.supabase.createClient(cfg.url,cfg.anon);
        const {error}=await SB.client.auth.signInWithPassword({email, password:pw});
        if(error) throw error;
        await sbAfterLogin(); renderSettings();
      }catch(e){ alert('Sign-in failed: '+(e.message||e)); }
      finally{ main.disabled=false; }
    };
    out.style.display='';
    out.textContent='Forget connection';
    out.onclick=()=>{ if(confirm('Remove the Supabase connection from this device? Local data stays.')){
      localStorage.removeItem(SB.cfgKey); pushResetLocal(); SB.client=null; SB.profile=null; renderSettings(); } };
    return;
  }
  loginWrap.style.display='none';
  main.style.display='none';
  push.style.display='';
  push.onclick=async()=>{ push.disabled=true;
    try{ await pushNow(); await pullNow(); toast('Sync complete'); }
    catch(e){ toast('Sync failed: '+(e.message||'network'), true); }
    finally{ push.disabled=false; } };
  out.style.display='';
  out.textContent='Sign out';
  out.onclick=async()=>{
    if(!confirm('Sign out on this device? Unsynced changes are pushed first, then ALL local data is wiped from this device (it re-syncs on next sign-in).')) return;
    try{ await pushNow(); }catch(e){
      if(!confirm('Could not push the latest changes (offline?). Sign out and WIPE anyway? Unpushed edits will be lost.')) return;
    }
    try{ await SB.client.auth.signOut(); }catch(e){}
    /* device hygiene: a signed-out phone holds nothing */
    [KEY2, KEY, SB.hashKey, SB.syncKey, 'kkl-local-ok', 'kkl-auto-backup', 'kkl-exp-seen', 'kkl-exp-digest']
      .forEach(k=>localStorage.removeItem(k));
    Object.keys(localStorage).filter(k=>k.startsWith('kkl-mem-')).forEach(k=>localStorage.removeItem(k));
    location.hash='#/'; location.reload();   /* back to the sign-in landing */
  };
  mfaRefresh();
}

/* ============ sign-in landing gate ============ */
let GATED=false;
function renderLanding(){
  GATED=true; document.body.classList.add('gated');
  app.innerHTML='<div class="login"><div class="lg-card">'+
    '<div class="lg-brand"><img src="'+KKL_LOGO+'" alt="KKL" style="height:42px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px 8px">'+
    '<div><div class="lg-t">KKL CMS</div><div class="lg-s">Construction Management System</div></div></div>'+
    '<p class="hint" style="margin:6px 0 14px">Sign in to your team workspace.</p>'+
    '<label style="margin-top:0">Email</label><input id="lgEmail" type="email" autocomplete="username" inputmode="email">'+
    '<label>Password</label><input id="lgPass" type="password" autocomplete="current-password">'+
    '<div class="lg-err" id="lgErr"></div>'+
    '<div class="btnrow"><button class="btn" id="lgGo" style="flex:1">Sign in</button></div>'+

    '<p class="hint" style="margin-top:12px">Invited by email? Open the link in that email first — it lets you set your password.</p>'+
  '</div></div>';
  const err=m=>{ const e=document.getElementById('lgErr'); e.textContent=m; e.style.display='block'; };
  const go=async()=>{
    const email=document.getElementById('lgEmail').value.trim(), pw=document.getElementById('lgPass').value;
    if(!email||!pw){ err('Enter your email and password.'); return; }
    const btn=document.getElementById('lgGo'); btn.disabled=true; btn.textContent='Signing in…';
    try{
      await sbLoadLib();
      const cfg=sbCfg();
      if(!SB.client) SB.client=window.supabase.createClient(cfg.url,cfg.anon);
      const {error}=await SB.client.auth.signInWithPassword({email, password:pw});
      if(error) throw error;
      await mfaGate();      /* enrolled TOTP factor -> require the 6-digit code */
      unGate(); route();
      await sbAfterLogin();
    }catch(e){
      err((e.message||'Sign-in failed')+ (String(e.message||'').includes('Invalid')?' — check the email/password, or use your invite email link if you have not set a password yet.':''));
      btn.disabled=false; btn.textContent='Sign in';
    }
  };
  document.getElementById('lgGo').onclick=go;
  document.getElementById('lgPass').addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
  /* offline-only mode removed from the UI (team workspace is the norm);
     the kkl-local-ok flag still works for development/testing */
}
function unGate(){ GATED=false; document.body.classList.remove('gated'); }

initShell();
(async()=>{
  const authLink=/^#access_token=|^#error/.test(location.hash) || /^#\/(checkin|hazard)\//.test(location.hash);
  const cfg=sbCfg();
  if(cfg && cfg.url && !authLink && !localStorage.getItem('kkl-local-ok')){
    renderLanding();
    await syncInit();                       /* existing session on this device? */
    if(SB.profile){ unGate(); wfMigrate(); route(); }  /* yes — straight into the app */
  }else{
    wfMigrate(); route(); syncInit();
  }
  setTimeout(()=>autoBackup(), 4000);   /* daily OneDrive backup, silent if folder not connected */
  setTimeout(()=>expiryNotify(), 6500); /* after the initial pull has usually landed */
  setTimeout(()=>wxRefresh(), 3500);    /* ambient weather for record stamps */
})();
</script>
